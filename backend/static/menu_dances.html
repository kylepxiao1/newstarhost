<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dance Menu</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 16px 24px 16px; background: #1e293b; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 20px; }
    main { padding: 20px; }
    section { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.02); }
    h2 { margin: 0 0 10px 0; font-size: 16px; letter-spacing: 0.02em; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    .row.filter-checkboxes { align-items: center; gap: 8px; }
    .filter-opt { display: inline-flex; align-items: center; gap: 6px; line-height: 1.15; }
    button { cursor: pointer; background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px 12px; font-weight: 600; }
    select, input:not([type="checkbox"]) { padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0b1222; color: #e2e8f0; flex: 1; }
    input[type="checkbox"] { flex: 0 0 auto; width: 16px; height: 16px; padding: 0; margin: 0; accent-color: #2563eb; }
    .songs { display: flex; gap: 8px; flex-wrap: wrap; }
    .card { position: relative; background: #0b1222; border: 1px solid #1f2937; border-radius: 8px; padding: 10px; width: 220px; min-height: 90px; display: flex; flex-direction: column; }
    .corner-flags { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; align-items: center; }
    .corner-flag { width: 18px; height: 18px; opacity: 0.92; object-fit: contain; }
    .card h3 { margin: 0 0 6px 0; font-size: 14px; word-break: break-word; }
    .card .duration { color: #94a3b8; font-weight: 600; }
    .card div { word-break: break-word; }
    .card button { margin-top: auto; }
    @media (max-width: 900px) {
      header { padding: 12px 12px 0px; flex-direction: column; align-items: flex-start; gap: 8px; }
      h1 { font-size: 18px; }
      #statusText { display: none; }
      main { padding: 12px !important; }
      section { padding: 12px; }
      .row { flex-wrap: wrap; }
      .row > * { flex: 1 1 220px; }
      .row label { min-width: 220px; }
      .row.filter-checkboxes { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 6px; }
      .row.filter-checkboxes > * { flex: 0 0 auto !important; }
      .row.filter-checkboxes .filter-opt { width: auto; min-width: 0; justify-content: flex-start; margin: 0; padding: 0; }
      .card { width: 100%; }
    }
    
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="wsDot" style="display:inline-flex;align-items:center;justify-content:center;width:10px;height:10px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444;"></span>
      <h1>Dance Menu Control</h1>
    </div>
    <div class="status" style="display:flex;align-items:center;gap:6px;font-weight:700;text-transform:uppercase;">
      <span id="statusText">Connecting</span>
    </div>
  </header>
  <main>
  <section>
    <h2>Filters</h2>
    <div class="row">
      <select id="dancerFilter" onchange="renderSongs()"></select>
      <button onclick="playSuggested()">Play Suggested</button>
    </div>
    <div class="row filter-checkboxes">
      <label class="filter-opt">
        <input type="checkbox" id="filterAssigned" checked onchange="renderSongs()"> Assigned dancers
      </label>
      <label class="filter-opt">
        <input type="checkbox" id="filterFronts" checked onchange="renderSongs()"> Front dancers
      </label>
      <label class="filter-opt">
        <input type="checkbox" id="filterKnows" onchange="renderSongs()"> Knows dance
      </label>
      <label class="filter-opt">
        <input type="checkbox" id="filterMvp" onchange="renderSongs()"> MVP
      </label>
    </div>
  </section>

  <section>
    <h2>All Songs</h2>
    <div id="songsContainer" class="songs"></div>
  </section>

  
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/static/state_ws_helper.js"></script>
  <script src="/static/page_shared.js"></script>
  <script>
    const api = window.PageShared.api;
    let library = {};
    let songsState = {};
    let state = {};
    let currentUrl = "";
    let backgroundStarted = false;
    let dancersList = [];
    let playCounts = loadPlayCounts();
    let lastSongUrl = loadLastSong();
    let supabaseClient = null;
    let currentSuggestedUrl = "";
    let hotkeyMap = {};
    let settingsFadeIn = true;
    let settingsFadeOut = true;
    let settingsLoopSameSongAfterFinish = false;

    async function loadSettings() {
      const data = await window.PageShared.fetchAppSettings(api);
      settingsFadeIn = data.fade_in !== false;
      settingsFadeOut = data.fade_out !== false;
      settingsLoopSameSongAfterFinish = data.loop_same_song_after_finish === true;
      hotkeyMap = data.hotkeys || {};
    }

    function handleHotkey(evt) {
      if (evt.defaultPrevented) return;
      if (evt.metaKey || evt.ctrlKey || evt.altKey) return;
      if (window.PageShared.isTypingTarget(evt.target)) return;
      const key = evt.key;
      if (!/^\d$/.test(key)) return;
      const role = hotkeyMap[key];
      if (!role) return;
      evt.preventDefault();
      playRoleHotkey(role);
    }

    async function getSupabaseConfig() {
      return api("/config").then(r => r.json()).catch(() => ({}));
    }

    async function ensureSupabaseClient() {
      if (supabaseClient) return supabaseClient;
      if (!window.supabase || !window.supabase.createClient) return null;
      const cfg = await getSupabaseConfig();
      if (!cfg.supabase_url || !cfg.supabase_key) {
        return null;
      }
      supabaseClient = window.supabase.createClient(cfg.supabase_url, cfg.supabase_key);
      return supabaseClient;
    }
    function getSavedAudio() {
      try { return JSON.parse(localStorage.getItem("globalAudioState") || "null"); } catch (e) { return null; }
    }

    async function refreshState() {
      try {
        state = await api("/state").then(r => r.json());
        renderSongs();
      } catch (e) {
        console.warn("Failed to refresh state", e);
      }
    }

    async function refreshSongs() {
      await refreshData();
    }

    async function refreshData() {
      const songs = await api("/songs").then(r=>r.json());
      songsState = songs || {};
      library = songs.library || {};
      restoreAudio(document.getElementById("player"));
      try {
        const dancersResp = await api("/dancers").then(r=>r.json());
        if (Array.isArray(dancersResp)) {
          dancersList = dancersResp.map(d => typeof d === "string" ? d : (d?.name || "")).filter(Boolean);
        } else if (dancersResp && typeof dancersResp === "object") {
          dancersList = Object.keys(dancersResp || {});
        } else {
          dancersList = [];
        }
      } catch (e) {
        dancersList = [];
      }
      renderDancerFilterOptions();
      renderSongs();
      ensureBackground();
    }

    function renderDancerFilterOptions() {
      const sel = document.getElementById("dancerFilter");
      if (!sel) return;
      const current = sel.value || "";
      sel.innerHTML = "";
      const all = document.createElement("option");
      all.value = "";
      all.textContent = "All dancers";
      sel.appendChild(all);
      dancersList.sort((a,b)=>a.localeCompare(b)).forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      });
      if (current && !dancersList.some(n => n.toLowerCase() === current.toLowerCase())) {
        const opt = document.createElement("option");
        opt.value = current;
        opt.textContent = current;
        sel.appendChild(opt);
      }
      sel.value = current || "";
    }

    function baseFilterSong(song) {
      const hasRole = (song.roles || []).length > 0;
      const hasDancers = (song.dancers || []).length > 0;
      return !hasRole && hasDancers;
    }

    function hasFilterToggle() {
      const a = document.getElementById("filterAssigned")?.checked !== false;
      const f = document.getElementById("filterFronts")?.checked !== false;
      const k = document.getElementById("filterKnows")?.checked === true;
      const m = document.getElementById("filterMvp")?.checked === true;
      return a || f || k || m;
    }

    function getFilteredSongsForCards() {
      const dancerFilter = (document.getElementById("dancerFilter")?.value || "").toLowerCase();
      const includeAssigned = document.getElementById("filterAssigned")?.checked !== false;
      const includeFronts = document.getElementById("filterFronts")?.checked !== false;
      const includeKnows = document.getElementById("filterKnows")?.checked === true;
      const includeMvp = document.getElementById("filterMvp")?.checked === true;
      return Object.values(library)
        .filter(s => {
          if (baseFilterSong(s)) return true;
          return includeMvp && !!(s.exclusive_mvp_for || "");
        })
        .filter(s => {
          if (!dancerFilter) return true;
          const assigned = [];
          if (includeAssigned) assigned.push(...(s.dancers||[]));
          if (includeFronts) assigned.push(...(s.front_dancers||[]).slice(0, 1));
          if (includeKnows) assigned.push(...(s.knows_song||[]));
          const exclusive = (s.exclusive_mvp_for || "").toLowerCase();
          if (exclusive && exclusive.includes(dancerFilter)) return true;
          return assigned.some(n => (n||"").toLowerCase().includes(dancerFilter));
        })
        .filter(s => {
          if (hasFilterToggle()) return true;
          const target = (dancerFilter || "").trim();
          if (!target) return true;
          const pool = [
            ...(s.dancers || []),
            ...(s.front_dancers || []),
            ...(s.knows_song || []),
          ];
          return pool.some(n => (n||"").toLowerCase().includes(target));
        })
        .sort((a,b)=> (a.name||"").localeCompare(b.name||""));
    }

    /**
     * Weight by cooldown factor: w = 1 - exp(-x / tau), where x = plays_after_last.
     * Missing songs are treated as x = infinity (w = 1).
     */
    async function pickWithRecencyPenalty(songs, tau = 10) {
      const list = Array.isArray(songs)
        ? songs.filter(Boolean)
        : Array.from(songs || []).filter(Boolean);
      if (!list.length) return null;
      if (!Number.isFinite(tau) || tau <= 0) tau = 10;
      const pickByWeights = (items, weights) => {
        const total = weights.reduce((sum, w) => sum + (Number.isFinite(w) ? w : 0), 0);
        if (!Number.isFinite(total) || total <= 0) {
          const idx = Math.floor(Math.random() * items.length);
          return items[idx] ?? null;
        }
        let r = Math.random() * total;
        for (let i = 0; i < items.length; i++) {
          r -= weights[i];
          if (r <= 0) return items[i];
        }
        return items[items.length - 1] ?? null;
      };
      const client = await ensureSupabaseClient();
      if (!client) {
        return pickByWeights(list, list.map(() => 1));
      }
      const names = Array.from(new Set(list.map(s => s?.name).filter(Boolean)));
      const playsMap = new Map();
      if (names.length) {
        const { data, error } = await client
          .from("play_counts_after_last")
          .select("song_name,plays_after_last")
          .in("song_name", names);
        if (!error && Array.isArray(data)) {
          data.forEach(row => {
            if (!row) return;
            const name = row.song_name;
            const val = Number(row.plays_after_last);
            if (name && Number.isFinite(val)) playsMap.set(name, val);
          });
        }
      }
      const weights = list.map(song => {
        const name = song?.name;
        const x = playsMap.has(name) ? playsMap.get(name) : Number.POSITIVE_INFINITY;
        const safeX = Number.isFinite(x) ? Math.max(0, x) : Number.POSITIVE_INFINITY;
        const factor = safeX === Number.POSITIVE_INFINITY ? 1 : (1 - Math.exp(-safeX / tau));
        return Math.max(0, factor);
      });
      return pickByWeights(list, weights);
    }

    async function playSuggested() {
      const list = getFilteredSongsForCards();
      const pick = await pickWithRecencyPenalty(list);
      if (!pick?.url) {
        alert("No suggested song found.");
        return;
      }
      currentSuggestedUrl = pick.url;
      playSongWithUrl(pick.url);
    }

    function renderSongs() {
      const container = document.getElementById("songsContainer");
      if (container) {
        container.innerHTML = "";
        const durationLabel = (song) => {
          const d = parseInt(song.duration_sec, 10);
          return Number.isFinite(d) && d > 0 ? ` <span class="duration">(${d}s)</span>` : "";
        };
        const list = getFilteredSongsForCards();
        list.forEach(song => {
          const card = document.createElement("div");
          card.className = "card";
          const rawDiff = String(song.difficulty || "").toLowerCase();
          const diff = (rawDiff === "easy" || rawDiff === "hard") ? rawDiff : "medium";
          const mvpRow = song.exclusive_mvp_for
            ? `<div style="margin:4px 0 2px 0;"><span style="padding:2px 6px;border-radius:6px;background:#f59e0b;color:#0f172a;font-weight:700;">MVP: ${song.exclusive_mvp_for}</span></div>`
            : "";
          const frontList = (song.front_dancers || []).filter(Boolean);
          const dancerList = (song.dancers || []).filter(Boolean);
          const frontLine = frontList.length ? `Front: ${frontList[0]}` : "";
          const dancerLine = dancerList.length ? `Dancers: ${dancerList.join(", ")}` : "";
          const details = [frontLine, dancerLine].filter(Boolean).join("<br>");
          card.innerHTML = `<h3>${song.name||"Unnamed"}${durationLabel(song)}</h3>${mvpRow}${details ? `<div>${details}</div>` : ""}`;
          const flags = document.createElement("div");
          flags.className = "corner-flags";
          const difficulty = document.createElement("img");
          difficulty.src = `/media/${diff}.svg`;
          difficulty.alt = `${diff} difficulty`;
          difficulty.className = "corner-flag";
          flags.appendChild(difficulty);
          card.appendChild(flags);
          const playBtn = document.createElement("button");
          playBtn.textContent = "Play Song";
          playBtn.onclick = () => playSongWithUrl(song.url);
          card.appendChild(playBtn);
          container.appendChild(card);
        });
      }

      const songs = songsState || {};
      const lib = songs.library || {};
      const currentUrlLocal = songs.current || "";
      const backgroundUrlLocal = songs.background || "";
      let currentName = "None";
      const tryResolve = (url) => {
        let name = "None";
        Object.values(lib).forEach(item => {
          if (item.url === url) {
            name = item.name || url;
          }
        });
        if (name === "None" && url && url === backgroundUrlLocal) {
          name = "Background";
        }
        if (name === "None" && url) name = url;
        return name;
      };
      if (currentSuggestedUrl) {
        currentName = tryResolve(currentSuggestedUrl);
      } else if (currentUrlLocal) {
        currentName = tryResolve(currentUrlLocal);
      } else if (backgroundUrlLocal) {
        currentName = tryResolve(backgroundUrlLocal);
      }
      const currentLabel = document.getElementById("currentSongLabel");
      if (currentLabel) currentLabel.textContent = currentName;
    }

    async function playSongWithUrl(url, fromSelect=false) {
      if (!url) {
        if (fromSelect) return;
        return alert("Select a song");
      }
      await loadSettings();
      api("/songs/play", {method:"POST", body:{target: "group", url, context: "menu"}}).catch(()=>{});
      if (!songsState) songsState = {};
      songsState.current = url;
      if (settingsLoopSameSongAfterFinish) {
        const bellUrl = getRoleUrl("bell");
        if (bellUrl) {
          startAudio(bellUrl, {
            loop:false,
            isRole:true,
            fade:false,
            fadeOut:false,
            skipFadeOut:true,
            onEnd: () => {
              setCurrent(url);
              startAudio(url, {
                loop:false,
                fade:true,
                fadeOut:false,
                skipFadeOut:true,
                onEnd: () => runPracticeRepeatCues(url),
              });
            }
          });
        } else {
          setCurrent(url);
          startAudio(url, {
            loop:false,
            fade:true,
            fadeOut:false,
            skipFadeOut:true,
            onEnd: () => runPracticeRepeatCues(url),
          });
        }
      } else {
        const bellUrl = getRoleUrl("bell");
        // bell -> song -> applause -> background (loop)
        const steps = [];
        if (bellUrl) steps.push(bellUrl);
        steps.push(url);
        steps.push("applause_role");
        steps.push("background_role");
        playSequence(steps);
      }
      refreshState();
    }

    function persistAudio(player) {
      if (!player) return;
      const payload = {
        src: player.src || "",
        t: player.currentTime || 0,
        paused: player.paused,
        loop: player.loop,
        volume: player.volume,
      };
      try { localStorage.setItem("globalAudioState", JSON.stringify(payload)); } catch (e) {}
    }

    function restoreAudio(player) {
      if (!player) return;
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem("globalAudioState") || "null"); } catch (e) {}
      if (!saved || !saved.src) return;
      player.src = saved.src;
      player.loop = !!saved.loop;
      player.volume = typeof saved.volume === "number" ? saved.volume : 1;
      player.currentTime = saved.t || 0;
      if (!saved.paused) {
        player.play().catch(()=>{});
      }
    }

    function startAudio(url, opts={}) {
      const player = getAudioPlayer();
      if (!player) return;
      window.PageShared.startAudio({
        player,
        url,
        opts,
        getRoleUrl,
        getSongVolume,
        settingsFadeIn,
        settingsFadeOut,
        onTrackPlay: () => { notePlay(url); },
        onAfterStart: ({player: p}) => {
          persistAudio(p);
          p.onplay = () => persistAudio(p);
          p.onpause = () => persistAudio(p);
          p.ontimeupdate = () => persistAudio(p);
        },
      });
    }

    function getRoleUrl(role) {
      return Object.values(library).find(s => (s.roles||[]).includes(role))?.url || "";
    }

    function queueSongPaused(url) {
      window.PageShared.queueSongPaused({url, getSongVolume, setCurrent});
    }

    function runPracticeRepeatCues(url) {
      queueSongPaused(url);
    }

    function normalizeVolume(val) {
      return window.PageShared.normalizeVolume(val);
    }

    function getSongVolume(url) {
      const song = Object.values(library).find(s => s.url === url);
      const v = song ? parseFloat(song.volume) : NaN;
      if (Number.isFinite(v)) return normalizeVolume(v);
      return 1;
    }

    function getAudioPlayer() {
      return window.PageShared.getGlobalAudioPlayer();
    }

    function setCurrent(url) {
      currentUrl = url;
      const label = document.getElementById("currentSongLabel");
      let name = "None";
      Object.values(library).forEach(s => { if (s.url === url) name = s.name || url; });
      if (!url) name = "None";
      if (label) label.textContent = name;
    }

    function playRole(role) {
      const url = getRoleUrl(role);
      if (!url) {
        alert(`No song with role: ${role}`);
        return;
      }
      api("/songs/play", {method:"POST", body:{target:"group", url, context: "menu"}}).catch(()=>{});
      startAudio(url, {loop:false});
    }

    function playRoleHotkey(role) {
      const url = getRoleUrl(role);
      if (!url) return;
      const bg = getRoleUrl("background");
      startAudio(url, {
        loop: false,
        isRole: true,
        onEnd: () => {
          if (bg) {
            startAudio(bg, {loop:true, fade:false, fadeOut:false, skipFadeOut:true, isRole:true});
          }
        }
      });
    }

    function playSequence(steps) {
      if (!steps || !steps.length) return;
      const [first, ...rest] = steps.filter(Boolean);
      if (!first) return;
      let url = first;
      let isRole = false;
      if (first === "applause_role") {
        url = getRoleUrl("applause");
        if (!url) { playSequence(rest); return; }
        isRole = true;
      } else if (first === "background_role") {
        url = getRoleUrl("background");
        if (!url) { playSequence(rest); return; }
        songsState.background = url;
        setCurrent(url);
        startAudio(url, {loop:true, fade:false, fadeOut:false, skipFadeOut:true, isRole:true});
        return;
      }
      // normal audio
      setCurrent(url);
      startAudio(url, {loop:false, fade:true, fadeOut:false, skipFadeOut:true, isRole, onEnd: () => playSequence(rest)});
    }

    function ensureBackground() {
      if (backgroundStarted) return;
      const saved = getSavedAudio();
      const player = document.getElementById("player");
      // If we already have saved audio or current player has a source, don't auto-start background
      if ((saved && saved.src) || (player && player.src)) return;
      const bg = getRoleUrl("background");
      if (!bg) return;
      backgroundStarted = true;
      setCurrent(bg);
      startAudio(bg, {loop:true, fade:false, fadeOut:false, skipFadeOut:true, isRole:true});
    }

    function loadPlayCounts() {
      try {
        const raw = localStorage.getItem("playCounts");
        return raw ? JSON.parse(raw) : {};
      } catch (e) { return {}; }
    }
    function savePlayCounts() {
      try { localStorage.setItem("playCounts", JSON.stringify(playCounts)); } catch (e) {}
    }
    function loadLastSong() {
      try { return localStorage.getItem("lastSongUrl") || ""; } catch (e) { return ""; }
    }
    function saveLastSong(url) {
      lastSongUrl = url || "";
      try { localStorage.setItem("lastSongUrl", lastSongUrl); } catch (e) {}
    }
    function notePlay(url) {
      if (!url) return;
      playCounts[url] = (playCounts[url] || 0) + 1;
      savePlayCounts();
      saveLastSong(url);
    }

    function highlightNav() {
      let here = location.pathname.replace(/\/+$/,"");
      if (!here) here = "/";
      const links = Array.from(document.querySelectorAll(".nav-bar a"));
      // pick the longest href that is a prefix of the current path
      let best = null;
      links.forEach(a => {
        let link = (a.getAttribute("href") || "").replace(/\/+$/,"");
        if (!link) link = "/";
        if (here === link || here.startsWith(link)) {
          if (!best || link.length > best.href.length) {
            best = {el:a, href:link};
          }
        }
      });
      links.forEach(a => a.classList.remove("active"));
      if (best) best.el.classList.add("active");
    }

    loadSettings();
    refreshData();
    refreshState();
    refreshSongs();
    function connectWs() {
      if (!window.PageShared?.connectWsStatus) return;
      window.PageShared.connectWsStatus({
        connectedText: "Live",
        disconnectedText: "Disconnected",
        onOpen: () => { refreshState(); },
        onWake: () => { refreshState(); },
        onState: (payload) => {
          state = payload;
          renderState();
        },
      });
    }
    connectWs();
    restoreAudio(document.getElementById("player"));
    highlightNav();
    document.addEventListener("keydown", handleHotkey);
    window.addEventListener("message", (evt) => {
      if (evt?.data?.type === "settings-updated") {
        loadSettings();
      }
    });

    function stopPreview() {
      const video = document.getElementById("preview");
      if (!video) return;
      const stream = video.srcObject;
      if (stream && stream.getTracks) {
        stream.getTracks().forEach(t => t.stop());
      }
      video.srcObject = null;
    }

    async function startPreview() {
      const video = document.getElementById("preview");
      if (!navigator.mediaDevices?.getUserMedia) return;
      try {
        stopPreview();
        const refreshed = await navigator.mediaDevices.enumerateDevices();
        const vcams = refreshed.filter(d => d.kind === "videoinput");
        const target = vcams.find(c => /virtual/i.test(c.label || "")) || vcams[0];
        if (!target) return;
        const constraints = target.deviceId ? { deviceId: { exact: target.deviceId } } : true;
        const stream = await navigator.mediaDevices.getUserMedia({ video: constraints });
        video.srcObject = stream;
        await video.play();
      } catch (e) {
        // ignore preview errors
      }
    }
    window.addEventListener("pagehide", stopPreview);
    window.addEventListener("beforeunload", stopPreview);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stopPreview();
    });
    </script>
  </body>
</html>
