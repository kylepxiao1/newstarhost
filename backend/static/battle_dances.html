<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Battle Control</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 16px 24px; background: #1e293b; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 20px; }
    main { padding: 20px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    section { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.02); }
    h2 { margin-top: 0; font-size: 16px; letter-spacing: 0.02em; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    button { cursor: pointer; background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px 12px; font-weight: 600; }
    button.secondary { background: #334155; }
    button.danger { background: #ef4444; }
    input, select { padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0b1222; color: #e2e8f0; }
    #slotOneSelect, #slotTwoSelect { font-weight: 700; }
    ul { list-style: none; padding: 0; margin: 0; max-height: 220px; overflow: auto; }
    li { padding: 8px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
    .badge { padding: 4px 8px; border-radius: 6px; background: #1e293b; font-size: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .status { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; text-transform: uppercase; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 6px 4px; border-bottom: 1px solid #1f2937; }
    .overlay-toggle { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding: 6px 8px; background: #0b1222; border-radius: 6px; }
    .bar-wrap { width: 100%; height: 18px; background: #0b1222; border: 1px solid #1f2937; border-radius: 10px; overflow: hidden; display: flex; }
    .bar-left { background: #ef4444; height: 100%; }
    .bar-right { background: #3b82f6; height: 100%; }
    .leader1 { background: #7f1d1d; color:#fef2f2; border-radius: 6px; padding: 4px 6px; }
    .leader2 { background: #1d4ed8; color:#eff6ff; border-radius: 6px; padding: 4px 6px; }
    .secondary.active { background:#22c55e; color:#0b1222; }
    .hint { position: relative; display:flex; flex:1; }
    .hint-text { position:absolute; top:-28px; left:0; background:#111827; border:1px solid #1f2937; padding:4px 8px; border-radius:6px; font-size:12px; white-space:nowrap; opacity:0; visibility:hidden; transition:opacity .1s; z-index:10; }
    .hint:hover .hint-text { opacity:1; visibility:visible; }
    .nav-bar a.active { font-weight:700; }
    .songs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .card { background: #0b1222; border: 1px solid #1f2937; border-radius: 8px; padding: 10px; width: 220px; min-height: 90px; display: flex; flex-direction: column; }
    .card.easy { background: rgba(34,197,94,0.12); border-color: rgba(34,197,94,0.35); }
    .card.hard { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.35); }
    .card h3 { margin: 0 0 6px 0; font-size: 14px; word-break: break-word; }
    .card .duration { color: #94a3b8; font-weight: 600; }
    .card div { word-break: break-word; }
    .card button { margin-top: auto; }
    .songs-empty { color: #94a3b8; font-style: italic; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="wsDot" style="display:inline-flex;align-items:center;justify-content:center;width:10px;height:10px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444;"></span>
      <h1>TikTok Battle Control</h1>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="status"><span id="statusText">Connecting</span></div>
      <div id="current"></div>
    </div>
  </header>
  <main>
    <section>
      <h2>Battle</h2>
      <div class="row">
        <button class="secondary" onclick="startRoutine(120000)">Simulate 2m Battle</button>
        <button class="secondary" onclick="startRoutine(60000)">Simulate 1m Battle</button>
        <button class="danger" onclick="cancelRoutine()">Cancel Battle</button>
      </div>
      <div class="row">
        <button class="secondary" id="battleListenerBtn" onclick="toggleBattleListener()">Start Battle Listener</button>
        <button class="secondary" onclick="skipSong()">Skip to Next Song</button>
      </div>
      <div class="grid-2" style="margin-bottom:10px; align-items:center;">
        <label style="display:flex;gap:6px;align-items:center;">
          <span style="white-space:nowrap;">Dancer 1:</span>
          <select id="slotOneSelect" style="flex:1;" onchange="saveSlotSelects()"></select>
        </label>
        <label style="display:flex;gap:6px;align-items:center;">
          <span style="white-space:nowrap;">Dancer 2:</span>
          <select id="slotTwoSelect" style="flex:1;" onchange="saveSlotSelects()"></select>
        </label>
      </div>
      <div class="row">
        <span>Timer: <strong id="timerDisplay">-</strong></span>
      </div>
      <div class="row">
        <span>Status: <strong id="battleStatusLabel">Tie</strong></span>
      </div>
      <div class="row">
        <label style="display:flex;gap:6px;align-items:center; width:100%;">
          <span style="white-space:nowrap;">Current group:</span>
          <select id="groupSelect" style="flex:1;" onchange="saveGroupSelect()"></select>
        </label>
      </div>
      <div class="row" id="enabledDancers"></div>
      <div class="row" id="winsEditor" style="flex-wrap:wrap; gap:8px;"></div>
      <table>
        <tr><td>Slot One</td><td id="slotOneCell">-</td></tr>
        <tr><td>Slot Two</td><td id="slotTwoCell">-</td></tr>
        <tr><td>Points</td><td>
          <div class="bar-wrap"><div id="barLeft" class="bar-left" style="width:50%"></div><div id="barRight" class="bar-right" style="width:50%"></div></div>
          <div class="row" style="margin-top:4px; gap:12px;">
            <span id="pointsLeftLabel">0</span>
            <span id="pointsRightLabel" style="margin-left:auto;">0</span>
          </div>
        </td></tr>
      </table>
      <div class="row">
        <button class="secondary" onclick="spoofStartBattle()">Spoof Start Battle</button>
        <button class="secondary" onclick="spoofGift()">Spoof Score Update (Dancer 1)</button>
        <button class="secondary" onclick="spoofGiftTwo()">Spoof Score Update (Dancer 2)</button>
      </div>
    </section>

    <section>
      <h2>Music Control</h2>
      <div class="row">
        <button class="secondary" id="tabGroup" onclick="selectTab('group')">Group</button>
        <button class="secondary" id="tabOne" onclick="selectTab('slot_one')">Dancer 1</button>
        <button class="secondary" id="tabTwo" onclick="selectTab('slot_two')">Dancer 2</button>
        <button class="secondary" id="tabIntersect" onclick="selectTab('intersect')">Intersect</button>
        <button class="secondary" onclick="pickSuggestedSong()">Pick Suggested</button>
      </div>
      <div class="row">
      </div>
      <div class="row">
        <span>Current song: <span id="currentSongLabel">-</span></span>
      </div>
      <div class="row" style="align-items:center;">
        <label style="display:flex;gap:6px;align-items:center;">
          <input type="checkbox" id="fadeToggle" checked> Fade in 0.5s
        </label>
        <label style="display:flex;gap:6px;align-items:center;">
          <input type="checkbox" id="fadeOutToggle" checked> Fade out 0.5s
        </label>
      </div>
      
      <div id="songsEmpty" class="songs-empty"></div>
      <div id="songsContainer" class="songs"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/static/state_ws_helper.js"></script>
  <script>
    const api = (path, opts={}) => fetch(path, {method: opts.method||"GET", headers: {"Content-Type":"application/json"}, body: opts.body ? JSON.stringify(opts.body) : undefined});
    let state = {};
    let currentTab = "";
    let routine = { active:false, live:false, timers:[], endTime:0, startTime:0, dancers:[], firstSongPlayed:false, warned:false, pointsInterval:null, switchInterval:null, currentSongOwner:"", currentSongUrl:"", playedSongs:new Set(), logged:false, startedLive:false, competitionId:"" };
    let timerInterval = null;
    const SPECIAL_ROLES = ["bell","applause","attention","background","win","closing"];
    let playCounts = loadPlayCounts();
    let lastSongUrl = loadLastSong();
    const CENTER_LINE = "CenterDottedLine";
    let audioUnlocked = false;
    let supabaseClient = null;
    let giftChannel = null;
    let competitionChannel = null;
    let battleListenerActive = false;
    let battleListenerStarting = false;
    let battleListenerStopping = false;
    const handledCompetitionStartIds = new Set();
    let latestBattleStartKey = 0;
    let hotkeyMap = {};
    let settingsFadeIn = true;
    let settingsFadeOut = true;

    async function loadSettings() {
      try {
        const res = await api("/settings/data");
        const data = await res.json();
        settingsFadeIn = data.fade_in !== false;
        settingsFadeOut = data.fade_out !== false;
        hotkeyMap = data.hotkeys || {};
        const fadeInToggle = document.getElementById("fadeToggle");
        const fadeOutToggle = document.getElementById("fadeOutToggle");
        if (fadeInToggle) fadeInToggle.checked = settingsFadeIn;
        if (fadeOutToggle) fadeOutToggle.checked = settingsFadeOut;
      } catch (e) {}
    }

    function isTypingTarget(target) {
      if (!target) return false;
      const tag = (target.tagName || "").toLowerCase();
      return tag === "input" || tag === "textarea" || tag === "select" || target.isContentEditable;
    }

    function handleHotkey(evt) {
      if (evt.defaultPrevented) return;
      if (evt.metaKey || evt.ctrlKey || evt.altKey) return;
      if (isTypingTarget(evt.target)) return;
      const key = evt.key;
      if (!/^\d$/.test(key)) return;
      const role = hotkeyMap[key];
      if (!role) return;
      evt.preventDefault();
      playRoleHotkey(role);
    }

    let _randSeed = (Date.now() % 2147483647) || 1;
    function rand() {
      if (window.crypto && window.crypto.getRandomValues) {
        const buf = new Uint32Array(1);
        window.crypto.getRandomValues(buf);
        return buf[0] / 4294967296;
      }
      // time-seeded LCG fallback
      const t = Date.now() ^ (performance && performance.now ? Math.floor(performance.now()*1000) : 0);
      _randSeed = (_randSeed + t) % 2147483647;
      _randSeed = (_randSeed * 48271) % 2147483647;
      return _randSeed / 2147483647;
    }

    async function getSupabaseConfig() {
      return api("/config").then(r => r.json()).catch(() => ({}));
    }

    async function ensureSupabaseClient() {
      if (supabaseClient) return supabaseClient;
      if (!window.supabase || !window.supabase.createClient) return null;
      const cfg = await getSupabaseConfig();
      if (!cfg.supabase_url || !cfg.supabase_key) {
        alert("Supabase config missing. Set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY.");
        return null;
      }
      supabaseClient = window.supabase.createClient(cfg.supabase_url, cfg.supabase_key);
      return supabaseClient;
    }

    function setBattleListenerButton() {
      const btn = document.getElementById("battleListenerBtn");
      if (!btn) return;
      if (battleListenerStarting) {
        btn.textContent = "Starting Battle Listener...";
        btn.className = "secondary";
        btn.disabled = true;
        return;
      }
      btn.disabled = false;
      btn.textContent = battleListenerActive ? "Stop Battle Listener" : "Start Battle Listener";
      btn.className = battleListenerActive ? "secondary active" : "secondary";
    }

    function battleListenerLog(message, data=null) {
      try {
        if (data === null) console.log("[battle-listener]", message);
        else console.log("[battle-listener]", message, data);
      } catch (e) {}
    }

    function normalizeId(value) {
      if (value == null) return "";
      let out = String(value).trim();
      if (!out) return "";
      out = out.replace(/^"(.*)"$/, "$1").trim();
      if (/^\d+(\.0+)?$/.test(out)) {
        out = out.replace(/\.0+$/, "");
      }
      return out;
    }

    function normalizeHandle(value) {
      if (value == null) return "";
      return String(value).trim().replace(/^@+/, "").toLowerCase();
    }

    function selectedGroupName() {
      const sel = document.getElementById("groupSelect");
      const fromSelect = (sel?.value || "").trim();
      if (fromSelect) return fromSelect;
      return (state.group_name || "").trim();
    }

    function selectedGroupHandle() {
      const groupName = selectedGroupName().toLowerCase();
      if (!groupName) return "";
      const dancer = (state.dancers || []).find(d => ((d.name || "").toLowerCase() === groupName));
      if (!dancer) return "";
      return normalizeHandle(dancer.handle);
    }

    function parseIdList(value) {
      const out = [];
      const add = (v) => {
        if (v == null) return;
        if (Array.isArray(v)) {
          v.forEach(add);
          return;
        }
        if (typeof v === "number" && Number.isFinite(v)) {
          const id = normalizeId(String(Math.trunc(v)));
          if (id) out.push(id);
          return;
        }
        if (typeof v === "string") {
          const text = v.trim();
          if (!text) return;
          if (text.startsWith("{") && text.endsWith("}")) {
            const inner = text.slice(1, -1).trim();
            if (!inner) return;
            inner.split(",").map(p => p.trim()).forEach(add);
            return;
          }
          if ((text.startsWith("[") && text.endsWith("]")) || (text.startsWith("{") && text.endsWith("}"))) {
            try {
              add(JSON.parse(text));
              return;
            } catch (e) {}
          }
          const id = normalizeId(text);
          if (id) out.push(id);
          return;
        }
        if (typeof v === "object") {
          Object.values(v).forEach(add);
        }
      };
      add(value);
      return out;
    }

    function extractTeamMemberIds(row) {
      const team1 = parseIdList(row?.team_1_member_ids);
      const team2 = parseIdList(row?.team_2_member_ids);
      if (team1.length && team2.length) {
        return { team1, team2 };
      }
      let parsed = row?.team_infos_json;
      if (typeof parsed === "string") {
        try { parsed = JSON.parse(parsed); } catch (e) { parsed = null; }
      }
      if (Array.isArray(parsed)) {
        const fromInfos = parsed.map(team => {
          if (!team || typeof team !== "object") return [];
          const users = Array.isArray(team.users) ? team.users : (Array.isArray(team.members) ? team.members : []);
          const ids = [];
          users.forEach(u => {
            if (!u || typeof u !== "object") return;
            const direct = normalizeId(u.userId);
            if (direct) ids.push(direct);
            const nested = normalizeId(u.user?.userId);
            if (nested) ids.push(nested);
          });
          return ids;
        });
        const fallback1 = team1.length ? team1 : (fromInfos[0] || []);
        const fallback2 = team2.length ? team2 : (fromInfos[1] || []);
        return { team1: fallback1, team2: fallback2 };
      }
      return { team1, team2 };
    }

    function dancerNameForTiktokId(tiktokId) {
      const id = normalizeId(tiktokId);
      if (!id) return "";
      const dancers = state.dancers || [];
      const exact = dancers.find(d => normalizeId(d.tiktok_id || d.tiktokId) === id);
      if (exact) return exact.name || "";

      // bigint values can lose precision in JS; fall back to a stable prefix key.
      const key = id.length >= 15 ? id.slice(0, 15) : id;
      const approx = dancers.filter(d => {
        const dancerId = normalizeId(d.tiktok_id || d.tiktokId);
        if (!dancerId) return false;
        const dancerKey = dancerId.length >= 15 ? dancerId.slice(0, 15) : dancerId;
        return dancerKey === key;
      });
      if (approx.length === 1) {
        battleListenerLog("mapped dancer by approximate tiktok_id", {
          incoming_id: id,
          incoming_key: key,
          dancer: approx[0].name || "",
          dancer_id: normalizeId(approx[0].tiktok_id || approx[0].tiktokId),
        });
        return approx[0].name || "";
      }
      if (approx.length > 1) {
        battleListenerLog("ambiguous approximate tiktok_id mapping", {
          incoming_id: id,
          incoming_key: key,
          candidates: approx.map(d => ({name: d.name || "", tiktok_id: normalizeId(d.tiktok_id || d.tiktokId)})),
        });
      }
      return "";
    }

    async function applyBattleStartDancersFromRow(row) {
      const { team1, team2 } = extractTeamMemberIds(row);
      const team1Id = team1[0] || "";
      const team2Id = team2[0] || "";
      const dancerOne = dancerNameForTiktokId(team1Id);
      const dancerTwo = dancerNameForTiktokId(team2Id);
      if (!dancerOne || !dancerTwo || dancerOne.toLowerCase() === dancerTwo.toLowerCase()) {
        battleListenerLog("ignored start: could not map team member ids to Dancer 1/2", {
          team_1_id: team1Id,
          team_2_id: team2Id,
          team_1_candidates: team1,
          team_2_candidates: team2,
        });
        return null;
      }
      state.slot_one = dancerOne;
      state.slot_two = dancerTwo;
      const slotOneSel = document.getElementById("slotOneSelect");
      const slotTwoSel = document.getElementById("slotTwoSelect");
      if (slotOneSel) slotOneSel.value = dancerOne;
      if (slotTwoSel) slotTwoSel.value = dancerTwo;
      renderSlotSelects();
      await api("/battle/slots/import", {method:"POST", body:{slot_one: dancerOne, slot_two: dancerTwo}});
      battleListenerLog("mapped start dancers", {
        team_1_id: team1Id,
        team_2_id: team2Id,
        dancer_1: dancerOne,
        dancer_2: dancerTwo,
      });
      return { dancerOne, dancerTwo };
    }

    function parseUnixSeconds(value) {
      const n = Number(value);
      if (!Number.isFinite(n) || n <= 0) return null;
      if (n > 1_000_000_000_000) return Math.floor(n / 1000);
      return Math.floor(n);
    }

    function parseEpochMs(value) {
      const n = Number(value);
      if (!Number.isFinite(n) || n <= 0) return 0;
      if (n > 1_000_000_000_000) return Math.floor(n);
      return Math.floor(n * 1000);
    }

    function competitionStartSortKey(row) {
      const fromCreate = parseEpochMs(row?.create_time_ms ?? row?.createTimeMs);
      if (fromCreate > 0) return fromCreate;
      const fromUnix = parseEpochMs(row?.unix_ts ?? row?.unixTs);
      if (fromUnix > 0) return fromUnix;
      const fromIso = Date.parse(String(row?.iso_ts ?? row?.isoTs ?? "").trim() || "");
      return Number.isFinite(fromIso) && fromIso > 0 ? Math.floor(fromIso) : 0;
    }

    function competitionIdFromRow(row) {
      return normalizeId(row?.competition_id ?? row?.competitionId);
    }

    function parseNonNegativeInt(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return null;
      return Math.max(0, Math.floor(n));
    }

    async function handleCompetitionScoreChange(row) {
      if (!row) return;
      const msgType = row.competition_message_type || row.competitionMessageType || row.type;
      if (msgType !== "COMPETITION_MESSAGE_TYPE_SCORE_CHANGE") return;
      if (!routine.active) {
        battleListenerLog("ignored score update: routine not active", {message_id: row.message_id || row.messageId || row.id});
        return;
      }
      const rowCompetitionId = competitionIdFromRow(row);
      const activeCompetitionId = normalizeId(routine.competitionId);
      if (!activeCompetitionId || !rowCompetitionId || rowCompetitionId !== activeCompetitionId) {
        battleListenerLog("ignored score update: competition_id mismatch", {
          active_competition_id: activeCompetitionId,
          event_competition_id: rowCompetitionId,
          message_id: row.message_id || row.messageId || row.id,
        });
        return;
      }
      const slotOneName = (state.slot_one || "").trim();
      const slotTwoName = (state.slot_two || "").trim();
      if (!slotOneName || !slotTwoName) {
        battleListenerLog("ignored score update: slots not mapped", {
          slot_one: slotOneName,
          slot_two: slotTwoName,
          message_id: row.message_id || row.messageId || row.id,
        });
        return;
      }
      const teamOneScore = parseNonNegativeInt(row.team_1_score ?? row.team1_score ?? row.teamOneScore);
      const teamTwoScore = parseNonNegativeInt(row.team_2_score ?? row.team2_score ?? row.teamTwoScore);
      if (teamOneScore == null || teamTwoScore == null) {
        battleListenerLog("ignored score update: invalid team scores", {
          team_1_score: row.team_1_score,
          team_2_score: row.team_2_score,
          message_id: row.message_id || row.messageId || row.id,
        });
        return;
      }
      await api("/battle/scores/import", {method:"POST", body:{slot_one: teamOneScore, slot_two: teamTwoScore}});
      refreshState();
      battleListenerLog("applied score update", {
        competition_id: rowCompetitionId,
        team_1_score: teamOneScore,
        team_2_score: teamTwoScore,
        message_id: row.message_id || row.messageId || row.id,
      });
    }

    function rememberCompetitionStart(id) {
      if (!id) return;
      handledCompetitionStartIds.add(id);
      if (handledCompetitionStartIds.size <= 200) return;
      const first = handledCompetitionStartIds.values().next();
      if (!first.done) handledCompetitionStartIds.delete(first.value);
    }

    async function handleCompetitionStart(row) {
      if (!row) {
        battleListenerLog("ignored insert: missing row");
        return;
      }
      const msgType = row.competition_message_type || row.competitionMessageType || row.type;
      if (msgType !== "COMPETITION_MESSAGE_TYPE_START") {
        battleListenerLog("ignored insert: not START type", {msgType, message_id: row.message_id || row.messageId || row.id});
        return;
      }
      const groupHandle = selectedGroupHandle();
      if (!groupHandle) {
        battleListenerLog("ignored start: selected group has no handle", {group: selectedGroupName()});
        return;
      }
      const rowUsername = normalizeHandle(row.tiktok_username ?? row.tiktokUsername);
      if (!rowUsername || rowUsername !== groupHandle) {
        battleListenerLog("ignored start: tiktok_username does not match selected group handle", {
          group_handle: groupHandle,
          event_tiktok_username: rowUsername,
          message_id: row.message_id || row.messageId || row.id,
        });
        return;
      }
      const key = normalizeId(row.message_id || row.id);
      if (key && handledCompetitionStartIds.has(key)) {
        battleListenerLog("ignored start: duplicate message", {message_id: key});
        return;
      }
      const startSortKey = competitionStartSortKey(row);
      if (latestBattleStartKey > 0 && startSortKey > 0 && startSortKey < latestBattleStartKey) {
        battleListenerLog("ignored start: older than latest tracked start", {
          message_id: key || "",
          start_key: startSortKey,
          latest_start_key: latestBattleStartKey,
        });
        return;
      }
      const mapped = await applyBattleStartDancersFromRow(row);
      if (!mapped) return;
      if (routine.active && startSortKey > 0 && latestBattleStartKey > 0 && startSortKey > latestBattleStartKey) {
        battleListenerLog("newer start detected: restarting active routine", {
          message_id: key || "",
          start_key: startSortKey,
          previous_start_key: latestBattleStartKey,
        });
        cancelRoutine();
      } else if (routine.active) {
        battleListenerLog("ignored start: routine already active", {message_id: key || ""});
        rememberCompetitionStart(key);
        return;
      }
      const endTs = parseUnixSeconds(row.end_timestamp_actual ?? row.end_timestamp ?? row.endTimestamp ?? row.endTimestampActual);
      if (!endTs) {
        battleListenerLog("ignored start: missing end_timestamp", {message_id: key});
        return;
      }
      const endMs = endTs * 1000;
      const durationMs = Math.max(0, endMs - Date.now());
      const competitionId = competitionIdFromRow(row);
      try {
        battleListenerLog("competition start detected", {
          message_id: row.message_id || row.messageId || row.id,
          group_name: selectedGroupName(),
          group_handle: groupHandle,
          competition_id: competitionId,
          end_timestamp: endTs,
          end_ms: endMs,
          duration_ms: durationMs
        });
      } catch (e) {}
      if (startSortKey > 0) latestBattleStartKey = startSortKey;
      rememberCompetitionStart(key);
      await startLiveRoutine(durationMs, endMs, competitionId);
    }

    async function startBattleListener() {
      if (battleListenerStarting) return;
      battleListenerStarting = true;
      setBattleListenerButton();
      const client = await ensureSupabaseClient();
      if (!client) {
        battleListenerStarting = false;
        setBattleListenerButton();
        return;
      }
      const groupName = selectedGroupName();
      const groupHandle = selectedGroupHandle();
      if (!groupName || !groupHandle) {
        alert("Set Current group to a dancer with a handle before starting Battle Listener.");
        battleListenerStarting = false;
        setBattleListenerButton();
        return;
      }
      battleListenerLog("starting listener", {group_name: groupName, group_handle: groupHandle});
      stopBattleListener();
      handledCompetitionStartIds.clear();
      latestBattleStartKey = 0;
      const channel = client
        .channel("competition-events-battle")
        .on("postgres_changes", {event:"INSERT", schema:"public", table:"competition_events"}, payload => {
          const row = payload?.new || payload?.record || payload || {};
          battleListenerLog("insert event received", {
            message_id: row.message_id || row.messageId || row.id,
            competition_message_type: row.competition_message_type || row.competitionMessageType || row.type,
            tiktok_username: row.tiktok_username || row.tiktokUsername || "",
            competition_id: competitionIdFromRow(row),
          });
          (async () => {
            await handleCompetitionStart(row);
            await handleCompetitionScoreChange(row);
          })().catch((err) => battleListenerLog("insert handler error", String(err)));
        })
        .on("postgres_changes", {event:"UPDATE", schema:"public", table:"competition_events"}, payload => {
          const row = payload?.new || payload?.record || payload || {};
          battleListenerLog("update event received", {
            message_id: row.message_id || row.messageId || row.id,
            competition_message_type: row.competition_message_type || row.competitionMessageType || row.type,
            competition_id: competitionIdFromRow(row),
          });
          (async () => {
            await handleCompetitionScoreChange(row);
          })().catch((err) => battleListenerLog("update handler error", String(err)));
        })
        .subscribe((status) => {
          battleListenerLog("channel status", status);
          if (channel !== competitionChannel) return;
          if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
            stopBattleListener();
          }
        });
      competitionChannel = channel;
      battleListenerActive = true;
      setBattleListenerButton();
      try {
        const nowSec = Math.floor(Date.now() / 1000);
        const { data, error } = await client
          .from("competition_events")
          .select("*")
          .eq("competition_message_type", "COMPETITION_MESSAGE_TYPE_START")
          .ilike("tiktok_username", groupHandle)
          .gt("end_timestamp", nowSec)
          .order("create_time_ms", { ascending: false, nullsFirst: false })
          .order("id", { ascending: false })
          .limit(5);
        if (error) {
          battleListenerLog("failed initial start check", error);
        } else if (Array.isArray(data) && data.length) {
          battleListenerLog("initial start check rows", data.length);
          for (const row of data) {
            await handleCompetitionStart(row);
            if (routine.active) break;
          }
        } else {
          battleListenerLog("initial start check found no active starts");
        }
      } catch (e) {
        battleListenerLog("initial start check threw", String(e));
      } finally {
        battleListenerStarting = false;
        setBattleListenerButton();
      }
    }

    function giftPointsFromRow(row) {
      const diamond = Number(row.diamond_count ?? row.diamondCount ?? row.diamondcount);
      const repeatRaw = row.repeat_count ?? row.repeatCount ?? row.repeatcount;
      const repeat = repeatRaw == null ? 1 : Number(repeatRaw);
      if (!Number.isFinite(diamond) || diamond <= 0) return 0;
      const count = Number.isFinite(repeat) && repeat > 0 ? repeat : 1;
      return Math.round(diamond * count);
    }

    async function unlockAudio() {
      if (audioUnlocked) return true;
      const player = getAudioPlayer();
      if (!player) return false;
      try {
        if (!player.paused) {
          audioUnlocked = true;
          return true;
        }
        const prevSrc = player.src;
        player.muted = true;
        await player.play();
        player.pause();
        player.muted = false;
        if (prevSrc) player.src = prevSrc;
        audioUnlocked = true;
        return true;
      } catch (e) {
        return false;
      }
    }

    function renderSongs() {

      const container = document.getElementById("songsContainer");
      const empty = document.getElementById("songsEmpty");

      if (empty) empty.textContent = "";
      if (container && empty) {

          empty.textContent = msg;
          return [];
        };
        let list = [];
        if (!currentTab) {
          list = missing("Select Group, Dancer 1, Dancer 2, or Intersect to view songs.");
        } else if (currentTab === "group") {
          const groupName = (state.group_name || "").trim();
          list = groupName ? groupSongs() : missing("Set Current group to view songs.");
        } else if (currentTab === "slot_one") {
          const name = (state.slot_one || "").trim();
          list = name ? songsForDancer(name) : missing("Select Dancer 1 to view songs.");
        } else if (currentTab === "slot_two") {
          const name = (state.slot_two || "").trim();
          list = name ? songsForDancer(name) : missing("Select Dancer 2 to view songs.");
        } else if (currentTab === "intersect") {
          const a = (state.slot_one || "").trim();
          const b = (state.slot_two || "").trim();
          list = (a && b) ? intersectSongsFor(a, b) : missing("Select Dancer 1 and Dancer 2 to view intersect songs.");
        }

        const durationLabel = (song) => {
          const d = parseInt(song.duration_sec, 10);
          return Number.isFinite(d) && d > 0 ? ` <span class="duration">(${d}s)</span>` : "";
        };

        if (!list.length && !empty.textContent) {
          empty.textContent = "No songs found for this selection.";
        }

        list
          .sort((a,b)=> (a.name||"").localeCompare(b.name||""))
          .forEach(song => {
            const card = document.createElement("div");
            card.className = "card";
            const diff = (song.difficulty || "medium").toLowerCase();
            if (diff === "easy") card.classList.add("easy");
            if (diff === "hard") card.classList.add("hard");
            const badge = song.exclusive_mvp_for
              ? `<span style="margin-left:8px;padding:2px 6px;border-radius:6px;background:#f59e0b;color:#0f172a;font-weight:700;">MVP: ${song.exclusive_mvp_for}</span>`
              : "";
            const frontList = (song.front_dancers || []).filter(Boolean);
            const dancerList = (song.dancers || []).filter(Boolean);
            const frontLine = frontList.length ? `Front: ${frontList[0]}` : "";
            const dancerLine = dancerList.length ? `Dancers: ${dancerList.join(", ")}` : "";
            const details = [frontLine, dancerLine].filter(Boolean).join("<br>");
            card.innerHTML = `<h3>${song.name||"Unnamed"}${durationLabel(song)} ${badge}</h3>${details ? `<div>${details}</div>` : ""}`;
            const playBtn = document.createElement("button");
            playBtn.textContent = "Play Song";
            playBtn.onclick = () => playSongUrl(song.url);
            card.appendChild(playBtn);
            container.appendChild(card);
          });
      }
      let currentName = "-";
      const tryResolve = (url) => {
        let name = "-";
        Object.values(lib).forEach(item => {
          if (item.url === url) {
            name = item.name || url;
          }
        });
        if (name === "-" && url && url === backgroundUrl) {
          name = "Background";
        }
        if (name === "-" && url) name = url;
        return name;
      };
      if (currentUrl) {
        currentName = tryResolve(currentUrl);
      } else if (backgroundUrl) {
        currentName = tryResolve(backgroundUrl);
      }
      document.getElementById("currentSongLabel").textContent = currentName;
    }

      if (!audioUnlocked) {
        const ok = await unlockAudio();
        if (!ok) return alert("Click anywhere on the page once to enable audio.");
      }
      // cancel routine if user manually picks music
      cancelRoutine();
      await api("/songs/play", {method:"POST", body:{target: currentTab, url, context: "battle"}});
      const songs = state.songs || {};
      songs.current = url;
      songs[currentTab] = url;
      state.songs = songs;
      // bell -> selected -> applause -> background
      playSequence(["bell"], false, () => {
        startAudio(url, {loop:false, onEnd: () => {
          playSequence(["applause"], false, () => {
            const bg = state.songs?.background;
            if (bg) startAudio(bg, {loop:true});
          });
        }});
      });
      refreshState();
    }

      if (!audioUnlocked) {
        const ok = await unlockAudio();
        if (!ok) return alert("Click anywhere on the page once to enable audio.");
      }
      const slotOne = (state.slot_one || "").trim();
      const slotTwo = (state.slot_two || "").trim();
      if (!slotOne || !slotTwo) {
        alert("Select Dancer 1 and Dancer 2 first.");
        return;
      }
      const currentUrl = state.songs?.current || "";
      const played = routine.playedSongs || new Set();
      const both = intersectSongsFor(slotOne, slotTwo)
        .filter(s => !(s.roles||[]).some(r=>SPECIAL_ROLES.includes(r)))
        .filter(s => !played.has(s.url) && s.url !== currentUrl);
      const groups = groupSongs()
        .filter(s => !(s.roles||[]).some(r=>SPECIAL_ROLES.includes(r)))
        .filter(s => !played.has(s.url) && s.url !== currentUrl);
      const combined = new Set([...both, ...groups]);
      let url = "";
      if (combined.size) {
        const pick = await pickWithRecencyPenalty(Array.from(combined));
        if (pick?.url) url = pick.url;
      }
      if (!url) {
        alert("No suggested song found.");
        return;
      }
      cancelRoutine();
      await api("/songs/play", {method:"POST", body:{target: "group", url, context: "battle"}});
      const songs = state.songs || {};
      songs.current = url;
      state.songs = songs;
      playSequence(["bell"], false, () => {
        startAudio(url, {loop:false, onEnd: () => {
          playSequence(["applause"], false, () => {
            const bg = state.songs?.background;
            if (bg) startAudio(bg, {loop:true});
          });
        }});
      });
      refreshState();
    }

    function getAudioPlayer() {
      if (window.top && window.top !== window) {
        const gp = window.top.document.getElementById("globalPlayer");
        if (gp) return gp;
      }
      if (!window._sharedAudio) {
        window._sharedAudio = new Audio();
      }
      return window._sharedAudio;
    }

    function startAudio(url, opts={}) {
      const player = getAudioPlayer();
      if (!player) return;
      if (!audioUnlocked) {
        unlockAudio().then(ok => {
          if (!ok) return;
          startAudio(url, opts);
        });
        return;
      }
      try {
        console.log("[battle-debug] startAudio", {url, opts});
        console.trace("[battle-debug] startAudio trace");
      } catch (e) {}
      const targetVolume = normalizeVolume((typeof opts.volume === "number") ? opts.volume : getSongVolume(url));
      const fadeIn = opts.fade ?? document.getElementById("fadeToggle")?.checked ?? true;
      const fadeOut = opts.fadeOut ?? document.getElementById("fadeOutToggle")?.checked ?? true;
      const doPlay = () => {
        player.loop = !!opts.loop;
        player.onended = () => {
          if (typeof opts.onEnd === "function") {
            opts.onEnd();
            return;
          }
          const bg = state.songs?.background;
          if (bg) {
            startAudio(bg, {loop:true});
          }
        };
        player.src = url;
        if (!opts.isRole) {
          notePlay(url);
        }
        if (fadeIn) {
          let vol = 0.0;
          player.volume = 0;
          player.play();
          const steps = 10;
          const stepMs = 50;
          const inc = targetVolume / steps;
          let count = 0;
          const intv = setInterval(()=>{
            count += 1;
            vol = Math.min(targetVolume, vol + inc);
            player.volume = vol;
            if (count >= steps) clearInterval(intv);
          }, stepMs);
        } else {
          player.volume = targetVolume;
          player.play();
        }
      };
      // only fade out on normal transitions; skip fading when interrupting (opts.skipFadeOut)
      if (fadeOut && !opts.skipFadeOut && !player.paused && player.src) {
        let vol = player.volume;
        const steps = 10;
        const stepMs = 50;
        const dec = vol/steps;
        let count = 0;
        const outv = setInterval(()=>{
          count += 1;
          vol = Math.max(0, vol - dec);
          player.volume = vol;
          if (count >= steps) {
            clearInterval(outv);
            player.pause();
            doPlay();
          }
        }, stepMs);
      } else {
        doPlay();
      }
    }

    function getRoleUrl(role) {
      const lib = state.songs?.library || {};
      for (const key of Object.keys(lib)) {
        const roles = lib[key].roles || [];
        if (roles.includes(role)) return lib[key].url;
      }
      return null;
    }

    function normalizeVolume(val) {
      let v = parseFloat(val);
      if (!Number.isFinite(v)) return 1;
      if (v <= 1) return Math.max(0, Math.min(1, v));
      return Math.max(0, Math.min(1, v / 200));
    }

    function getSongVolume(url) {
      const lib = state.songs?.library || {};
      for (const key of Object.keys(lib)) {
        const song = lib[key] || {};
        if (song.url === url) {
          const v = parseFloat(song.volume);
          if (Number.isFinite(v)) return normalizeVolume(v);
        }
      }
      return 1;
    }

          state.songs = state.songs || {};
          state.songs.background = bg;
          state.songs.current = state.songs.current || bg;
        }
      }
      if (bg) {
        startAudio(bg, {loop:true});
      }
  }

    /**
     * Weight by cooldown factor: w = 1 - exp(-x / tau), where x = plays_after_last.
     * Missing songs are treated as x = infinity (w = 1).
     */
    async function pickWithRecencyPenalty(songs, tau = 20) {
      const list = Array.isArray(songs)
        ? songs.filter(Boolean)
        : Array.from(songs || []).filter(Boolean);
      if (!list.length) return null;
      if (!Number.isFinite(tau) || tau <= 0) tau = 20;
      const pickByWeights = (items, weights) => {
        const total = weights.reduce((sum, w) => sum + (Number.isFinite(w) ? w : 0), 0);
        if (!Number.isFinite(total) || total <= 0) {
          const idx = Math.floor(rand() * items.length);
          return items[idx] ?? null;
        }
        let r = rand() * total;
        for (let i = 0; i < items.length; i++) {
          r -= weights[i];
          if (r <= 0) return items[i];
        }
        return items[items.length - 1] ?? null;
      };
      const client = await ensureSupabaseClient();
      if (!client) {
        return pickByWeights(list, list.map(() => 1));
      }

      const names = Array.from(new Set(list.map(s => s?.name).filter(Boolean)));
      const playsMap = new Map();
      if (names.length) {
        const { data, error } = await client
          .from("play_counts_after_last")
          .select("song_name,plays_after_last")
          .in("song_name", names);
        if (error) {
          console.warn("recencyPenalty query error", error);
        }
        if (!error && Array.isArray(data)) {
          data.forEach(row => {
            if (!row) return;
            const name = row.song_name;
            const val = Number(row.plays_after_last);
            if (name && Number.isFinite(val)) playsMap.set(name, val);
          });
        }
      }

      const weights = list.map(song => {
        const name = song?.name;
        const x = playsMap.has(name) ? playsMap.get(name) : Number.POSITIVE_INFINITY;
        const safeX = Number.isFinite(x) ? Math.max(0, x) : Number.POSITIVE_INFINITY;
        const factor = safeX === Number.POSITIVE_INFINITY ? 1 : (1 - Math.exp(-safeX / tau));
        return Math.max(0, factor);
      });
      return pickByWeights(list, weights);
    }

    function tickPoints() {
      if (!routine.active || !routine.startTime || !routine.endTime) return;
      const now = Date.now();
      const remaining = routine.endTime - now;
      if (remaining <= 0) {
        stopPointsInterval();
        return;
      }
      const scores = state.scores || {slot_one:0, slot_two:0};
      const a = scores.slot_one || 0;
      const b = scores.slot_two || 0;
      const totalPts = Math.max(1, a + b);
      const mean = Math.max(1, Math.round(totalPts * 0.05)); // 5% of current total points
      let amount = Math.max(1, Math.round(Math.random() * mean) + 1);
      let slot = Math.random() < 0.5 ? "slot_one" : "slot_two";
      const diff = (scores.slot_one||0) - (scores.slot_two||0);
      const losing = diff > 0 ? "slot_two" : diff < 0 ? "slot_one" : null;
      if (losing && Math.random() < 0.03) { // comeback chance
        slot = losing;
        amount += Math.round(mean * 25);
      }
      api(`/score/${slot}/add`, {method:"POST", body:{amount}}).then(refreshState);
    }

    function getEnabledDancers() {
      const enabled = state.enabled_dancers || [];
      const set = new Set((enabled || []).map(x => (x || "").toLowerCase()));
      const pool = state.dancers || [];
      if (!enabled.length) return pool;
      return pool.filter(d => set.has((d.name || "").toLowerCase()));
    }

    function chooseTwoDancers() {
      const dancers = getEnabledDancers();
      if (dancers.length < 2) return ["Dancer A", "Dancer B"];
      const names = dancers.map(d => d.name || "").filter(Boolean);
      const nameSet = new Set(names.map(n => n.toLowerCase()));
      const slotOne = (state.slot_one || "").trim();
      const slotTwo = (state.slot_two || "").trim();
      const hasOne = slotOne && nameSet.has(slotOne.toLowerCase());
      const hasTwo = slotTwo && nameSet.has(slotTwo.toLowerCase());
      if (hasOne && hasTwo && slotOne.toLowerCase() !== slotTwo.toLowerCase()) {
        return [slotOne, slotTwo];
      }
      if (hasOne || hasTwo) {
        const fixed = hasOne ? slotOne : slotTwo;
        const pool = dancers.filter(d => (d.name || "").toLowerCase() !== fixed.toLowerCase());
        if (pool.length) {
          const partner = pool[Math.floor(Math.random() * pool.length)];
          return hasOne
            ? [slotOne, partner.name || "Dancer B"]
            : [partner.name || "Dancer A", slotTwo];
        }
      }
      const last = (state.last_winner || "").toLowerCase();
      const match = dancers.find(d => (d.name||"").toLowerCase() === last);
      const others = dancers.filter(d => d !== match);
      const pickOther = others.length ? others[Math.floor(Math.random()*others.length)] : null;
      if (match && pickOther) {
        return [match.name || "Dancer A", pickOther.name || "Dancer B"];
      }
      const shuffled = [...dancers].sort(()=>Math.random()-0.5);
      return [shuffled[0].name || "Dancer A", shuffled[1].name || "Dancer B"];
    }

    function songsForDancer(name) {
      const lib = state.songs?.library || {};
      const target = (name||"").toLowerCase();
      return Object.values(lib).filter(s => {
        const dancers = (s.dancers||[]).map(x=>x.toLowerCase());
        return dancers.includes(target);
      });
    }

    function songsKnownBy(name) {
      const lib = state.songs?.library || {};
      const target = (name||"").toLowerCase();
      return Object.values(lib).filter(s => {
        const knows = (s.knows_song||[]).map(x=>x.toLowerCase());
        return knows.includes(target);
      });
    }

    function intersectSongsFor(a, b) {
      const lib = state.songs?.library || {};
      const mapUrl = {};
      Object.values(lib).forEach(s => { if (s.url) mapUrl[s.url] = s; });

      const assignedA = new Set(songsForDancer(a).map(s => s.url));
      const knowsA = new Set(songsKnownBy(a).map(s => s.url));
      const assignedB = new Set(songsForDancer(b).map(s => s.url));
      const knowsB = new Set(songsKnownBy(b).map(s => s.url));

      // Must be assigned to at least one dancer AND known by both
      const assignedAny = new Set([...assignedA, ...assignedB]);
      const unionA = new Set([...assignedA, ...knowsA]);
      const unionB = new Set([...assignedB, ...knowsB]);
      const shared = new Set([...unionA].filter(u => unionB.has(u) && assignedAny.has(u)));

      const urls = new Set(shared);
      const result = [];
      urls.forEach(u => { if (mapUrl[u]) result.push(mapUrl[u]); });
      return result;
    }

    function markRoutinePlayed(url) {
      if (!url) return;
      if (!routine.playedSongs) routine.playedSongs = new Set();
      routine.playedSongs.add(url);
    }

    function scoresForDancers(a, b) {
      const scores = state.scores || {slot_one:0, slot_two:0};
      const slotOneName = (state.slot_one || "").toLowerCase();
      const slotTwoName = (state.slot_two || "").toLowerCase();
      const aName = (a||"").toLowerCase();
      const bName = (b||"").toLowerCase();
      const scoreA = aName === slotOneName ? scores.slot_one || 0 : aName === slotTwoName ? scores.slot_two || 0 : 0;
      const scoreB = bName === slotOneName ? scores.slot_one || 0 : bName === slotTwoName ? scores.slot_two || 0 : 0;
      if (scoreA === scoreB) {
        return {leader:a, loser:b, leaderScore:scoreA, loserScore:scoreB, tie:true, scoreA, scoreB};
      }
      return scoreA > scoreB
        ? {leader:a, loser:b, leaderScore:scoreA, loserScore:scoreB, tie:false, scoreA, scoreB}
        : {leader:b, loser:a, leaderScore:scoreB, loserScore:scoreA, tie:false, scoreA, scoreB};
    }

    function isGroupSong(url) {
      return groupSongs().some(s => s.url === url);
    }

    async function decideNextSong(currentUrl) {
      const dancers = routine.dancers || [];
      if (dancers.length < 2) return getRoleUrl("background");
      const played = routine.playedSongs || new Set();
      const scoreInfo = scoresForDancers(dancers[0], dancers[1]);
      // First song logic prefers shared/group
      if (!routine.firstSongPlayed) {
        const both = intersectSongsFor(dancers[0], dancers[1])
          .filter(s => !(s.roles||[]).some(r=>SPECIAL_ROLES.includes(r)))
          .filter(s => !played.has(s.url) && s.url !== currentUrl);
        //if (both.length) return pickRandom(both).url;
        const groups = groupSongs()
          .filter(s => !(s.roles||[]).some(r=>SPECIAL_ROLES.includes(r)))
          .filter(s => !played.has(s.url) && s.url !== currentUrl);
        //if (groups.length) return pickRandom(groups).url;
        const combined = new Set([...both, ...groups]);
        if (combined.size) {
          const pick = await pickWithRecencyPenalty(Array.from(combined));
          if (pick?.url) return pick.url;
        }
      }
      if (!scoreInfo) return await nextSongFor(dancers[0], dancers[1], currentUrl) || getRoleUrl("background");
      const {leader, loser, leaderScore, loserScore} = scoreInfo;
      return await pickSongByMargin(leader, loser, leaderScore, loserScore, currentUrl, played);
    }

    async function pickSongByMargin(leader, loser, leaderScore, loserScore, currentUrl=null, played=new Set()) {
      const isTie = Number(leaderScore) === Number(loserScore);
      if (isTie) {
        const shared = intersectSongsFor(leader, loser)
          .filter(s => !(s.roles||[]).some(r=>SPECIAL_ROLES.includes(r)))
          .filter(s => !played.has(s.url) && s.url !== currentUrl);
        const groups = groupSongs()
          .filter(s => !(s.roles||[]).some(r=>SPECIAL_ROLES.includes(r)))
          .filter(s => !played.has(s.url) && s.url !== currentUrl);
        const combined = [...shared, ...groups];
        const pickTie = await pickWithRecencyPenalty(combined);
        return pickTie?.url || null;
      }
      const leaderAssigned = songsForDancer(leader).filter(s => !(s.roles||[]).some(r=>SPECIAL_ROLES.includes(r)));
      const leaderNotCurrent = leaderAssigned.filter(s => s.url !== currentUrl);
      const loserAssigned = new Set(songsForDancer(loser).map(s => s.url));
      const loserKnows = new Set(songsKnownBy(loser).map(s => s.url));
      const isHighMargin = leaderScore > loserScore * 1.2;
      const exclude = (list) => list.filter(s => s.url !== currentUrl && !played.has(s.url));

      if (isHighMargin) {
        const pool = exclude(leaderAssigned);
        const pick = await pickWithRecencyPenalty(pool.length ? pool : leaderNotCurrent);
        return pick?.url || null;
      }
      const shared = exclude(leaderAssigned).filter(s => loserAssigned.has(s.url) || loserKnows.has(s.url));
      if (shared.length) {
        const pick = await pickWithRecencyPenalty(shared);
        return pick?.url || null;
      }
      const sharedAny = leaderNotCurrent.filter(s => loserAssigned.has(s.url) || loserKnows.has(s.url));
      if (sharedAny.length) {
        const pick = await pickWithRecencyPenalty(sharedAny);
        return pick?.url || null;
      }
      const groups = groupSongs()
        .filter(s => !(s.roles||[]).some(r=>SPECIAL_ROLES.includes(r)))
        .filter(s => !played.has(s.url) && s.url !== currentUrl);
      const groupAll = groupSongs()
        .filter(s => !(s.roles||[]).some(r=>SPECIAL_ROLES.includes(r)))
        .filter(s => s.url !== currentUrl);
      const pickGroup = await pickWithRecencyPenalty(groups.length ? groups : groupAll);
      return pickGroup?.url || null;
    }

    function groupSongs() {
      const group = (state.group_name || "").toLowerCase();
      const lib = state.songs?.library || {};
      return Object.values(lib).filter(s => {
        const dancers = (s.dancers||[]).map(x=>x.toLowerCase());
        return group && dancers.includes(group);
      });
    }

    async function pickSongFor(name, excludeUrl=null) {
      const pool = songsForDancer(name).filter(s => !(s.roles||[]).some(r=>SPECIAL_ROLES.includes(r)));
      const filtered = excludeUrl ? pool.filter(s => s.url !== excludeUrl) : pool;
      const chosen = await pickWithRecencyPenalty(filtered.length ? filtered : pool);
      return chosen?.url || null;
    }

    async function nextSongFor(dancerA, dancerB, excludeUrl=null) {
      const pool = [...songsForDancer(dancerA), ...songsForDancer(dancerB), ...groupSongs()]
        .filter(s => !(s.roles||[]).some(r=>SPECIAL_ROLES.includes(r)));
      const filtered = pool.filter(s => s.url !== excludeUrl);
      const chosen = await pickWithRecencyPenalty(filtered.length ? filtered : pool);
      return chosen?.url || null;
    }

    function getLeaderName() {
      const scores = state.scores || {slot_one:0, slot_two:0};
      const a = scores.slot_one || 0;
      const b = scores.slot_two || 0;
      if (a > b) return state.slot_one || "";
      if (b > a) return state.slot_two || "";
      return "";
    }

    function resolveRoutineTiming(durationMs, absoluteEndMs=null) {
      const startTime = Date.now();
      const hasAbsoluteEnd = Number.isFinite(absoluteEndMs) && absoluteEndMs > 0;
      const endTime = hasAbsoluteEnd
        ? Math.floor(absoluteEndMs)
        : (startTime + Math.max(0, Number(durationMs) || 0));
      return { startTime, endTime };
    }

    async function skipSong() {
      const next = await decideNextSong(routine.currentSongUrl);
      if (!next || next === routine.currentSongUrl) return;
      markRoutinePlayed(next);
      routine.currentSongUrl = next;
      api("/songs/play", {method:"POST", body:{target:"group", url: next, context: "battle"}}).catch(()=>{});
      playSequence(["bell"], false, () => {
        startAudio(next, {skipFadeOut:true, loop:false, onEnd: () => {
          playSequence(["bell"], false, () => playRoutineSong(next));
        }});

    async function recordLiveBattleEnd(endMs) {
      if (!routine.startedLive || routine.logged) return;
      routine.logged = true;
      const startMs = routine.startTime || Date.now();
      const payload = { start_ms: Math.floor(startMs), end_ms: Math.floor(endMs || Date.now()) };
      api("/battle/battle_end", {method:"POST", body: payload}).catch(() => {});
    }

    async function playRoutineSong(lastUrl) {
      if (!routine.active) return;
      const now = Date.now();
      const remaining = routine.endTime - now;
      if (remaining <= 0) {
        recordLiveBattleEnd(Date.now());
        playSequence(["applause","win"], true);
        routine.active = false;
        routine.live = false;
        routine.startedLive = false;
        routine.competitionId = "";
        stopPointsInterval();
        stopSwitchInterval();
        stopLiveSubscription();
        evaluateWinner();
        return;
      }
      if (remaining <= 30000) {
        // stop current audio
        const player = document.getElementById("player");
        try { player.pause(); } catch(e){}
        setCenterLine(false);
        stopSwitchInterval();
        playSequence(["applause","attention"], false, () => {
          const wait = Math.max(0, routine.endTime - Date.now());
          const t = setTimeout(() => playRoutineSong(null), wait);
          routine.timers.push(t);
        });
        return;
      }
      let url = (await decideNextSong(lastUrl)) || getRoleUrl("background");
      if (!url) { ensureBackground(); return; }
      const afterDoorbell = () => {
        api("/songs/play", {method:"POST", body:{target:"group", url, context: "battle"}}).catch(()=>{});
        if (!state.songs) state.songs = {};
        state.songs.current = url;
        routine.currentSongOwner = routine.firstSongPlayed ? getLeaderName() : "";
        routine.currentSongUrl = url;
        markRoutinePlayed(url);
        stopSwitchInterval();
        routine.switchInterval = setInterval(() => monitorSongSwitch(), 2000);
        startAudio(url, {loop:false, onEnd: () => {
          playSequence(["bell"], false, () => playRoutineSong(url));
        }});
      };
      if (!routine.firstSongPlayed) {
        routine.firstSongPlayed = true;
        playSequence(["bell"], false, afterDoorbell);
      } else {
        afterDoorbell();
      }
    }

    function playSequence(roleNames, loopLast=false, onDone=null) {
      const [first, ...rest] = roleNames;
      const url = getRoleUrl(first);
      if (!url) { if (rest.length) return playSequence(rest, loopLast, onDone); if (onDone) onDone(); return; }
      startAudio(url, {loop: loopLast && rest.length===0, isRole:true, onEnd: () => {
        if (!rest.length) { if (onDone) onDone(); return; }
        playSequence(rest, loopLast, onDone);
      }});
    }

    function setCenterLine(show) {
      api(`/overlay/${CENTER_LINE}/${show ? "show" : "hide"}`, {method:"POST"}).catch(()=>{});
      if (state.overlay_states) state.overlay_states[CENTER_LINE] = show;
    }

    function playRole(role) {
      const url = getRoleUrl(role);
      if (!url) {
        alert(`No song with role: ${role}`);
        return;
      }
      api("/songs/play", {method:"POST", body:{target:"group", url, context: "battle"}}).catch(()=>{});
      startAudio(url, {loop:false});
    }

    function playRoleHotkey(role) {
      const url = getRoleUrl(role);
      if (!url) return;
      startAudio(url, {loop:false, isRole:true});
    }

    function saveWinnerValue(name) {
      api("/battle/winner", {method:"POST", body:{name}});
    }

    function saveSlotSelects() {
      const selOne = document.getElementById("slotOneSelect");
      const selTwo = document.getElementById("slotTwoSelect");
      if (!selOne || !selTwo) return;
      const slot_one = selOne.value || "";
      const slot_two = selTwo.value || "";
      api("/battle/slots/import", {method:"POST", body:{slot_one, slot_two}}).then(refreshState);
    }

    function saveGroupValue(name) {
      api("/battle/group", {method:"POST", body:{name}});
      const sel = document.getElementById("groupSelect");
      if (sel) sel.value = name;
    }

    function saveGroupSelect() {
      const sel = document.getElementById("groupSelect");
      if (!sel) return;
      saveGroupValue(sel.value);
      renderSongs();
    }

    function toggleEnabledDancer(name, enabled) {
      const list = new Set(state.enabled_dancers || []);
      if (enabled) list.add(name); else list.delete(name);
      const arr = Array.from(list);
      api("/dancers/enabled", {method:"POST", body:{names: arr}});
      state.enabled_dancers = arr;
      renderState();
    }

    function evaluateWinner() {
      const scores = state.scores || {slot_one:0, slot_two:0};
      const a = scores.slot_one || 0;
      const b = scores.slot_two || 0;
      if (a === b) return;
      const winnerName = a > b ? (state.slot_one || "") : (state.slot_two || "");
      const target = winnerName || (a > b ? "slot_one" : "slot_two");
      api("/battle/win", {method:"POST", body:{name: target}});
      if (winnerName) saveWinnerValue(winnerName);
      refreshState();
    }

    async function monitorSongSwitch() {
      if (!routine.active || !routine.currentSongUrl) return;
      if (!routine.dancers || routine.dancers.length < 2) return;
      const [a, b] = routine.dancers;
      const shared = intersectSongsFor(a, b).some(s => s.url === routine.currentSongUrl);
      const isGroup = isGroupSong(routine.currentSongUrl);
      const scoreInfo = scoresForDancers(a, b);
      if (!scoreInfo) return;
      if (scoreInfo.tie) return;
      const {leader, loser, leaderScore, loserScore} = scoreInfo;
      const loserAssigned = songsForDancer(loser).some(s => s.url === routine.currentSongUrl);
      if (shared || isGroup) return;
      // If the current song owner is the leader and leader is ahead, let it keep playing
      if ((routine.currentSongOwner || "").toLowerCase() === (leader || "").toLowerCase()) return;
      // Otherwise (loser overtook or no owner), switch by margin logic
      const newUrl = await pickSongByMargin(leader, loser, leaderScore, loserScore, routine.currentSongUrl);
      if (!newUrl || newUrl === routine.currentSongUrl) return;
      routine.currentSongOwner = leader;
      routine.currentSongUrl = newUrl;
      markRoutinePlayed(newUrl);
      api("/songs/play", {method:"POST", body:{target:"group", url:newUrl, context: "battle"}}).catch(()=>{});
      playSequence(["bell"], false, () => {
        startAudio(newUrl, {skipFadeOut:true, loop:false, onEnd: () => {
          playSequence(["bell"], false, () => playRoutineSong(newUrl));
        }});
      });
    }

    function renderTimer(force=false) {
      const el = document.getElementById("timerDisplay");
      if (!el) return;
      const update = () => {
        if (!routine.active || !routine.endTime) {
          el.textContent = "-";
          el.style.color = "#e2e8f0";
          stopTimerInterval();
          return;
        }
        const remaining = Math.max(0, Math.ceil((routine.endTime - Date.now()) / 1000));
        const mins = String(Math.floor(remaining / 60)).padStart(2,"0");
        const secs = String(remaining % 60).padStart(2,"0");
        el.textContent = `${mins}:${secs}`;
       el.style.color = remaining <= 30 ? "#ef4444" : "#e2e8f0";
       if (remaining <= 30 && remaining > 0 && !routine.warned) {
         // once under 30s, stop current and force applause->attention
         const player = document.getElementById("player");
         try { player.pause(); } catch(e){}
         playSequence(["applause","attention"], false);
         routine.warned = true;
         setCenterLine(false);
         stopSwitchInterval();
       }
       if (remaining <= 0) {
         recordLiveBattleEnd(Date.now());
         routine.active = false;
         routine.live = false;
         routine.startedLive = false;
         routine.competitionId = "";
         routine.warned = false;
         stopTimerInterval();
          stopPointsInterval();
          stopLiveSubscription();
          const player = document.getElementById("player");
          try { player.pause(); } catch(e){}
          evaluateWinner();
          playSequence(["applause","win"], true);
        }
      };
      if (!timerInterval || force) {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(update, 1000);
      }
      update();
    }


    let cameraLabelsReady = false;
    async function ensureCameraLabels() {
      if (cameraLabelsReady) return;
      if (!navigator.mediaDevices?.getUserMedia) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        stream.getTracks().forEach(t => t.stop());
        cameraLabelsReady = true;
      } catch (e) {}
    }

    async function refreshCameras() {
      try {
        await ensureCameraLabels();
        const devices = await navigator.mediaDevices.enumerateDevices();
        // Only list physical/non-virtual cams for feeding into the virtual cam
        const cams = devices.filter(d => d.kind === "videoinput" && !/virtual/i.test(d.label || ""));
        const select = document.getElementById("cameraSelect");
        select.innerHTML = "";
        cams.forEach((cam, idx) => {
          const opt = document.createElement("option");
          opt.value = cam.deviceId || "";
          opt.dataset.idx = idx;
          opt.dataset.label = cam.label || "";
          opt.textContent = cam.label || `Camera ${idx}`;
          select.appendChild(opt);
        });
        if (!select.value && cams[0]) select.value = cams[0].deviceId;
        console.log("[battle-camera] enumerate", cams.map((c, i) => ({
          idx: i,
          label: c.label || "",
          deviceId: c.deviceId || "",
          groupId: c.groupId || ""
        })));
      } catch (e) {
        console.warn("Camera enumeration failed", e);
      }
    }

    function stopPreview() {
      const video = document.getElementById("preview");
      if (!video) return;
      const stream = video.srcObject;
      if (stream && stream.getTracks) {
        stream.getTracks().forEach(t => t.stop());
      }
      video.srcObject = null;
    }

    async function startPreview() {
      const video = document.getElementById("preview");
      if (!navigator.mediaDevices?.getUserMedia) return alert("getUserMedia not supported");
      try {
        stopPreview();
        await applyCamera();
        const refreshed = await navigator.mediaDevices.enumerateDevices();
        const vcams = refreshed.filter(d => d.kind === "videoinput");
        const virtualTarget = vcams.find(c => /virtual/i.test(c.label || "")) || vcams[0];
        const constraints = virtualTarget?.deviceId ? { video: { deviceId: { exact: virtualTarget.deviceId } } } : { video: true };
        const stream = await getSharedCameraStream(constraints);
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        alert("Camera access denied or unavailable: " + err);
      }
    }

    window.addEventListener("pagehide", stopPreview);
    window.addEventListener("beforeunload", stopPreview);
    window.addEventListener("pagehide", stopBattleListener);
    window.addEventListener("beforeunload", stopBattleListener);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stopPreview();
    });

    highlightNav();

    // WebSocket live updates
    function connectWs() {
      const origin = (typeof window !== "undefined" && window.location && window.location.origin)
        ? window.location.origin
        : "";
      if (!origin) return;
      if (!window.StateWsHelper?.connect) return;
      window.StateWsHelper.connect({
        wsUrl: (origin.replace(/^http/,"ws")) + "/ws/state",
        onConnected: () => {
          const d=document.getElementById("wsDot"); const t=document.getElementById("statusText");
          if(d){d.style.background="#22c55e"; d.style.boxShadow="0 0 8px #22c55e";}
          if(t) t.textContent="Live";
        },
        onDisconnected: () => {
          const d=document.getElementById("wsDot"); const t=document.getElementById("statusText");
          if(d){d.style.background="#ef4444"; d.style.boxShadow="0 0 8px #ef4444";}
          if(t) t.textContent="Disconnected";
        },
        onOpen: () => { refreshState(); },
        onWake: () => { refreshState(); },
        onState: (payload) => {
          state = payload;
          renderState();
        },
      });
    }
    connectWs();

    document.addEventListener("pointerdown", () => { unlockAudio(); }, { once: true });
    document.addEventListener("keydown", handleHotkey);
    window.addEventListener("message", (evt) => {
      if (evt?.data?.type === "settings-updated") {
        loadSettings();
      }
    });

    loadSettings();
    setBattleListenerButton();
    refreshState();
    refreshSongs();
  </script>
</body>
</html>
