<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Analytics</title>
  <style>
    body { margin:0; font-family:"Segoe UI", Arial, sans-serif; background:#0f172a; color:#e2e8f0; }
    header { padding:16px 24px; background:#1e293b; box-shadow:0 2px 6px rgba(0,0,0,.3); display:flex; align-items:center; justify-content:space-between; }
    h1 { margin:0; font-size:20px; }
    main { padding:20px; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:8px 10px; border-bottom:1px solid #1f2937; text-align:left; }
    th { background:#111827; }
    button { cursor:pointer; background:#2563eb; color:#fff; border:none; border-radius:6px; padding:8px 12px; font-weight:600; }
  </style>
</head>
<body>
  <header>
    <h1>Analytics</h1>
    <div style="display:flex; gap:10px; align-items:center;">
      <button onclick="loadData()">Refresh</button>
      <button onclick="window.open('/analytics/plays?limit=200','_blank')">View Plays JSON</button>
      <button onclick="window.open('/analytics/plays.csv?limit=1000','_blank')">Download Plays CSV</button>
    </div>
  </header>
  <main>
    <table>
      <thead>
        <tr><th>Song</th><th>Plays</th><th>Points</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script>
    let ws = null;
    let lastState = null;

    function renderFromData(data, state) {
      if (!data) return;
      const lib = (state && state.songs && state.songs.library) || {};
      const rows = document.getElementById("rows");
      rows.innerHTML = "";
      const items = (data.plays || []).map(item => {
        let name = item.name || item.url || "";
        Object.values(lib).forEach(meta => {
          if (meta && meta.url === item.url) {
            name = meta.name || name;
          }
        });
        return { name, plays: item.count || 0, points: item.points || 0 };
      });
      items.sort((a, b) => (b.points || 0) - (a.points || 0));
      items.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${item.name || "-"}</td><td>${item.plays}</td><td>${item.points}</td>`;
        rows.appendChild(tr);
      });
    }

    async function loadData() {
      try {
        const [stateRes, dataRes] = await Promise.all([
          fetch("/state"),
          fetch("/analytics/data"),
        ]);
        lastState = await stateRes.json();
        const data = await dataRes.json();
        renderFromData(data, lastState);
      } catch (e) {
        console.error("Failed to load analytics", e);
      }
    }

    function connectWs() {
      try { if (ws) ws.close(); } catch (e) {}
      ws = new WebSocket((location.origin.replace(/^http/, "ws")) + "/ws/state");
      ws.onmessage = evt => {
        try {
          const data = JSON.parse(evt.data);
          if (data.type === "state") {
            lastState = data.payload;
            fetch("/analytics/data")
              .then(res => res.json())
              .then(payload => renderFromData(payload, lastState))
              .catch(() => {});
          }
        } catch (e) {
          console.error("ws parse error", e);
        }
      };
      ws.onclose = () => setTimeout(connectWs, 2000);
    }

    loadData();
    connectWs();
  </script>
</body>
</html>
