[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:app]
command=/usr/bin/env bash -lc '/usr/bin/env bash /app/scripts/sh/run_supervisor_program.sh app "${APP_MEMORY_LIMIT_MB:-576}" -- /usr/bin/env bash /app/scripts/sh/run_program.sh app'
directory=/app
autostart=true
autorestart=unexpected
startsecs=3
startretries=1000
exitcodes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10

[program:s3-sync]
command=/usr/bin/env bash -lc '/usr/bin/env bash /app/scripts/sh/run_supervisor_program.sh s3-sync "${S3_SYNC_MEMORY_LIMIT_MB:-256}" -- /usr/local/bin/supercronic /app/deploy/cron/s3_sync.cron'
directory=/app
autostart=true
autorestart=unexpected
startsecs=3
startretries=1000
exitcodes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=15
environment=TZ="America/Denver"

[program:listener]
command=/usr/bin/env bash -lc '/usr/bin/env bash /app/scripts/sh/run_supervisor_program.sh listener "${LISTENER_MEMORY_LIMIT_MB:-768}" -- /usr/bin/env bash /app/scripts/sh/run_program.sh listener'
directory=/app
autostart=true
autorestart=unexpected
startsecs=3
startretries=1000
exitcodes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20

[program:discord-verify-bot]
command=/usr/bin/env bash -lc '/usr/bin/env bash /app/scripts/sh/run_supervisor_program.sh discord-verify-bot "${DISCORD_VERIFY_BOT_MEMORY_LIMIT_MB:-192}" -- /usr/bin/env bash /app/scripts/sh/run_program.sh discord-verify-bot'
directory=/app
autostart=true
autorestart=unexpected
startsecs=3
startretries=1000
exitcodes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=30

[program:watchdog]
command=/usr/bin/env bash -lc '/usr/bin/env bash /app/scripts/sh/run_supervisor_program.sh watchdog "${WATCHDOG_MEMORY_LIMIT_MB:-128}" -- /usr/bin/env bash /app/scripts/sh/run_program.sh watchdog'
directory=/app
autostart=true
autorestart=unexpected
startsecs=3
startretries=1000
exitcodes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=40

[eventlistener:watchdog-process-events]
command=/usr/bin/env bash -lc 'limit_mb="${WATCHDOG_PROCESS_EVENTS_MEMORY_LIMIT_MB:-96}"; if [ "${limit_mb}" -gt 0 ]; then limit_kb=$((limit_mb * 1024)); ulimit -S -v "${limit_kb}"; ulimit -H -v "${limit_kb}"; fi; exec python /app/scripts/watchdog.py --mode process-events'
directory=/app
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL,PROCESS_STATE_BACKOFF,PROCESS_STATE_RUNNING
buffer_size=64
autostart=true
autorestart=unexpected
startsecs=3
startretries=1000
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=TZ="America/Denver"

[program:trendbot]
command=/usr/bin/env bash -lc '/usr/bin/env bash /app/scripts/sh/run_supervisor_program.sh trendbot "${TRENDBOT_MEMORY_LIMIT_MB:-384}" -- /usr/local/bin/supercronic /app/deploy/cron/trendbot.cron'
directory=/app
autostart=true
autorestart=unexpected
startsecs=3
startretries=1000
exitcodes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=50
environment=TZ="America/Denver"
