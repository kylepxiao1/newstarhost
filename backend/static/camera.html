<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Camera Manager</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 16px 24px 16px; background: #1e293b; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 20px; }
    main { padding: 20px; display: grid; grid-template-columns: 1fr; gap: 16px; }
    section { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.02); }
    h2 { margin-top: 0; font-size: 16px; letter-spacing: 0.02em; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    button { cursor: pointer; background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px 12px; font-weight: 600; }
    .button-link { display: inline-flex; align-items: center; justify-content: center; background: #2563eb; color: #fff; border-radius: 6px; padding: 8px 12px; font-weight: 600; font-size: 14px; font-family: "Segoe UI", Arial, sans-serif; text-decoration: none; border: none; cursor: pointer; }
    select { padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0b1222; color: #e2e8f0; flex: 1; }
    @media (max-width: 900px) {
      header { padding: 12px 12px 8px; }
      header .status { display: none !important; }
      h1 { font-size: 18px; }
      main { padding: 12px; gap: 12px; }
      section { padding: 12px; }
      .row { flex-wrap: wrap; }
      .row > * { flex: 1 1 220px; }
      #preview { max-height: 55vh; }
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="wsDot" style="display:inline-flex;align-items:center;justify-content:center;width:10px;height:10px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444;"></span>
      <h1>Virtual Camera Management</h1>
    </div>
    <div class="status" style="display:flex;align-items:center;gap:6px;font-weight:700;text-transform:uppercase;">
      <span id="statusText">Connecting</span>
    </div>
  </header>
  <main>
    <section>
      <h2>Cameras</h2>
      <div class="row">
        <select id="cameraSelect" style="flex:1;"></select>
        <button class="secondary" onclick="refreshCameras(true)">Refresh Cameras</button>
        <button class="secondary" onclick="window.open('/camera/manage','_blank')">Open in New Tab</button>
      </div>
      <div class="row">
        <button class="secondary" onclick="applyCamera()">Use Camera</button>
        <button class="secondary" onclick="startPreview()">Start Preview</button>
        <a class="button-link" href="/dist/virtual_cam_compositor.exe" download>Download Virtual Cam Compositor</a>
      </div>
      <video id="preview" autoplay playsinline style="width:100%;height:auto;object-fit:contain;background:#0b1222;border:1px solid #1f2937;border-radius:8px;"></video>
      <div id="previewResolution" style="margin-top:8px;color:#94a3b8;font-size:13px;">Preview resolution: -</div>
    </section>
    <section>
      <h2>Overlays</h2>
      <div id="overlays"></div>
    </section>
  </main>

  <script src="/static/state_ws_helper.js"></script>
  <script src="/static/page_shared.js"></script>
  <script>
    const api = (p,o={})=>fetch(p,{method:o.method||"GET",headers:{"Content-Type":"application/json"},body:o.body?JSON.stringify(o.body):undefined});
    let state = {};
    let ws;

    let cameraLabelsReady = false;
    let cameraPermissionGranted = false;
    let previewStream = null;
    let previewDeviceId = null;
    let previewDeviceLabel = null;
    const MAX_PREVIEW_WIDTH = 7680;
    const MAX_PREVIEW_HEIGHT = 4320;
    const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    async function ensureCameraLabels() {
      if (cameraLabelsReady) return;
      if (!cameraPermissionGranted) return;
      if (!navigator.mediaDevices?.getUserMedia) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        stream.getTracks().forEach(t => t.stop());
        cameraLabelsReady = true;
      } catch (e) {
        // If permission is denied, labels may remain blank.
      }
    }

    async function refreshCameras(userInitiated=false) {
      try {
        const backendList = await api("/camera/devices").then(r => r.json()).catch(() => ({devices: []}));
        const dshow = Array.isArray(backendList.devices) ? backendList.devices : [];
        if (userInitiated && !cameraPermissionGranted && navigator.mediaDevices?.getUserMedia) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            stream.getTracks().forEach(t => t.stop());
            cameraPermissionGranted = true;
            cameraLabelsReady = true;
          } catch (e) {
            // permission denied; continue with whatever labels we can get
          }
        }
        await ensureCameraLabels();
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === "videoinput");
        const select = document.getElementById("cameraSelect");
        const prevSelection = {
          value: select.value,
          idx: select.selectedOptions[0]?.dataset?.idx,
          label: select.selectedOptions[0]?.dataset?.label
        };
        select.innerHTML = "";
        if (dshow.length) {
          dshow.forEach((cam) => {
            const opt = document.createElement("option");
            opt.value = cam.label || "";
            opt.dataset.idx = cam.index;
            opt.dataset.label = cam.label || "";
            opt.textContent = cam.label || `Camera ${cam.index}`;
            select.appendChild(opt);
          });
          if (!select.value && dshow[0]) select.value = dshow[0].label || "";
        } else {
          cams.forEach((cam, idx) => {
            const opt = document.createElement("option");
            opt.value = cam.deviceId || "";
            opt.dataset.idx = idx;
            opt.dataset.label = cam.label || "";
            opt.textContent = cam.label || `Camera ${idx}`;
            select.appendChild(opt);
          });
          if (!select.value && cams[0]) select.value = cams[0].deviceId;
        }
        if (prevSelection.idx || prevSelection.label) {
          const opts = Array.from(select.options);
          let matched = null;
          if (prevSelection.idx != null && prevSelection.idx !== "") {
            matched = opts.find(o => o.dataset?.idx === String(prevSelection.idx));
          }
          if (!matched && prevSelection.label) {
            matched = opts.find(o => (o.dataset?.label || "") === prevSelection.label);
          }
          if (matched) {
            matched.selected = true;
            select.value = matched.value;
          }
        }
      } catch (e) {
        console.warn("Camera enumeration failed", e);
      }
    }

    function applyCamera() {
      const select = document.getElementById("cameraSelect");
      const idx = Number(select.selectedOptions[0]?.dataset.idx ?? -1);
      const label = select.selectedOptions[0]?.dataset.label || "";
      const labelBase = label.replace(/\s*\([^)]*\)\s*$/, "");
      const payload = {index: idx, label};
      return api("/camera/select", {method:"POST", body: payload}).catch(()=>{});
    }

    function stopPreview() {
      const video = document.getElementById("preview");
      const meta = document.getElementById("previewResolution");
      if (!video) return;
      const stream = previewStream || video.srcObject;
      if (stream && stream.getTracks) {
        stream.getTracks().forEach(t => t.stop());
      }
      video.srcObject = null;
      previewStream = null;
      if (meta) meta.textContent = "Preview resolution: -";
    }

    async function startPreview() {
      const video = document.getElementById("preview");
      if (!navigator.mediaDevices?.getUserMedia) return alert("getUserMedia not supported");
      try {
        stopPreview();
        await applyCamera();
        await delay(300);
        const refreshed = await navigator.mediaDevices.enumerateDevices();
        const vcams = refreshed.filter(d => d.kind === "videoinput");
        const virtuals = vcams.filter(c => /virtual/i.test(c.label || ""));
        let target = null;
        if (previewDeviceId) {
          target = virtuals.find(c => c.deviceId === previewDeviceId);
          if (!target && previewDeviceLabel) {
            const needle = previewDeviceLabel.toLowerCase();
            target = virtuals.find(c => (c.label || "").toLowerCase() === needle)
              || virtuals.find(c => (c.label || "").toLowerCase().includes(needle));
          }
          if (!target) {
            return alert("Previous virtual camera not available. Not switching previews.");
          }
        } else {
          target = virtuals.find(c => /obs/i.test(c.label || "")) || virtuals[0];
          if (!target) {
            return alert("No virtual camera found for preview. Start the virtual cam compositor and click Refresh Cameras.");
          }
        }
        const baseConstraints = target.deviceId
          ? {
              deviceId: { exact: target.deviceId },
              width: { ideal: MAX_PREVIEW_WIDTH },
              height: { ideal: MAX_PREVIEW_HEIGHT },
            }
          : {
              width: { ideal: MAX_PREVIEW_WIDTH },
              height: { ideal: MAX_PREVIEW_HEIGHT },
            };
        const openStream = async (videoConstraints) => {
          const stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints });
          previewStream = stream;
          video.srcObject = stream;
          await video.play();
        };
        stopPreview();
        await delay(150);
        await openStream(baseConstraints);
        let track = previewStream?.getVideoTracks?.()[0] || null;
        let settings = track?.getSettings?.() || {};
        const caps = track?.getCapabilities?.() || {};
        const maxWidth = Number(caps?.width?.max || 0);
        const maxHeight = Number(caps?.height?.max || 0);
        const currWidth = Number(settings.width || video.videoWidth || 0);
        const currHeight = Number(settings.height || video.videoHeight || 0);
        if (
          maxWidth > 0 && maxHeight > 0 &&
          (maxWidth > currWidth || maxHeight > currHeight)
        ) {
          try {
            stopPreview();
            await delay(100);
            await openStream({
              ...baseConstraints,
              width: { ideal: maxWidth, max: maxWidth },
              height: { ideal: maxHeight, max: maxHeight },
            });
            track = previewStream?.getVideoTracks?.()[0] || track;
            settings = track?.getSettings?.() || settings;
          } catch (e) {
            // keep first opened stream if hard max request fails
          }
        }
        const width = Number(settings.width || video.videoWidth || 0);
        const height = Number(settings.height || video.videoHeight || 0);
        const meta = document.getElementById("previewResolution");
        if (meta) {
          meta.textContent = (width > 0 && height > 0)
            ? `Preview resolution: ${width} x ${height}`
            : "Preview resolution: unknown";
        }
        if (width > 0 && height > 0) {
          video.style.aspectRatio = `${width} / ${height}`;
        }
        previewDeviceId = target.deviceId || null;
        previewDeviceLabel = target.label || null;
        cameraPermissionGranted = true;
        cameraLabelsReady = true;
        refreshCameras(true);
      } catch (err) {
        if (err?.name === "NotReadableError") {
          const label = previewDeviceLabel || "virtual camera";
          return alert(
            "Camera access denied or unavailable for " + label + ".\n" +
            "Not switching previews. Close other apps or restart the virtual cam compositor and try again."
          );
        }
        alert("Camera access denied or unavailable: " + err);
      }
    }

    function renderOverlays() {
      const wrap = document.getElementById("overlays");
      wrap.innerHTML = "";
      const overlays = state.overlay_states || {};
      const fallback = Object.keys(overlays).length ? overlays : {CenterDottedLine:false, BurstOverlay:false, BattleScore:true};
      Object.keys(fallback).forEach(name => {
        const row = document.createElement("div");
        row.className = "row";
        const label = document.createElement("span");
        label.textContent = name;
        const btn = document.createElement("button");
        btn.textContent = fallback[name] ? "Hide" : "Show";
        btn.onclick = () => toggleOverlay(name, !fallback[name]);
        row.appendChild(label);
        row.appendChild(btn);
        wrap.appendChild(row);
      });
    }

    function toggleOverlay(name, show) {
      if (!state.overlay_states) state.overlay_states = {};
      state.overlay_states[name] = show;
      renderOverlays();
      api(`/overlay/${name}/${show ? "show" : "hide"}`, {method:"POST"}).catch(()=>{});
    }

    function refreshState() {
      api("/state").then(r=>r.json()).then(s => { state = s; renderOverlays(); }).catch(()=>{});
    }

    function connectWs() {
      if (!window.PageShared?.connectWsStatus) return;
      try { ws?.close(); } catch (e) {}
      ws = window.PageShared.connectWsStatus({
        connectedText: "Live",
        disconnectedText: "Disconnected",
        onOpen: () => { refreshState(); },
        onWake: () => { refreshState(); },
        onState: (payload) => {
          state = payload;
          renderOverlays();
        },
      });
    }

    refreshState();
    connectWs();
    window.PageShared.initPracticeModeHeader({apiFn: api});
    refreshCameras(false);
    window.addEventListener("pagehide", stopPreview);
    window.addEventListener("beforeunload", stopPreview);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stopPreview();
    });
  </script>
</body>
</html>
