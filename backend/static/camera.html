<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Camera Manager</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 16px 24px 16px; background: #1e293b; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 20px; }
    main { padding: 20px; display: grid; grid-template-columns: 1fr; gap: 16px; }
    section { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.02); }
    h2 { margin-top: 0; font-size: 16px; letter-spacing: 0.02em; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    button { cursor: pointer; background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px 12px; font-weight: 600; }
    .button-link { display: inline-flex; align-items: center; justify-content: center; background: #2563eb; color: #fff; border-radius: 6px; padding: 8px 12px; font-weight: 600; font-size: 14px; font-family: "Segoe UI", Arial, sans-serif; text-decoration: none; border: none; cursor: pointer; }
    select, input[type="text"] { padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0b1222; color: #e2e8f0; flex: 1; }
    .hint { color: #94a3b8; font-size: 12px; margin-top: -4px; margin-bottom: 8px; }
    .likes-progress-wrap { position: relative; width: 100%; height: 24px; border: 1px solid #334155; border-radius: 999px; background: #0b1222; overflow: hidden; }
    .likes-progress-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(90deg,#22c55e,#84cc16); transition: width 220ms ease; }
    .likes-progress-label { position: relative; z-index: 1; width: 100%; height: 100%; display: inline-flex; align-items: center; justify-content: center; color: #e2e8f0; font-size: 12px; font-weight: 600; }
    .overlay-name { font-size: 16px; font-weight: 400; color: inherit; letter-spacing: 0; }
    .overlay-row { align-items: center; justify-content: space-between; background: #0b1222; border: 1px solid #1f2937; border-radius: 8px; padding: 8px; }
    .overlay-controls { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .overlay-controls label { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #cbd5e1; }
    .overlay-controls input[type="number"] { width: 84px; padding: 6px 8px; border-radius: 6px; border: 1px solid #334155; background: #0b1222; color: #e2e8f0; }
    .overlay-controls select { flex: 0 0 210px; min-width: 170px; padding: 6px 8px; }
    .likes-layout-controls .likes-group-label { min-width: 210px; }
    .likes-overlay-config { margin-top: 8px; padding-top: 12px; border-top: 1px solid #1f2937; }
    .likes-overlay-config h3 { margin: 0 0 8px 0; }
    @media (max-width: 900px) {
      header { padding: 12px 12px 8px; }
      header .status { display: none !important; }
      h1 { font-size: 18px; }
      main { padding: 12px; gap: 12px; }
      section { padding: 12px; }
      .row { flex-wrap: wrap; }
      .row > * { flex: 1 1 220px; }
      .overlay-row { align-items: flex-start; }
      .overlay-controls { justify-content: flex-start; }
      .likes-layout-controls .likes-group-label {
        flex-basis: 100%;
      }
      #preview { max-height: 55vh; }
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="wsDot" style="display:inline-flex;align-items:center;justify-content:center;width:10px;height:10px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444;"></span>
      <h1>Virtual Camera Management</h1>
    </div>
    <div class="status" style="display:flex;align-items:center;gap:6px;font-weight:700;text-transform:uppercase;">
      <span id="statusText">Connecting</span>
    </div>
  </header>
  <main>
    <section>
      <h2>Cameras</h2>
      <div class="row">
        <select id="cameraSelect" style="flex:1;"></select>
        <button class="secondary" onclick="refreshCameras(true)">Refresh Cameras</button>
        <button class="secondary" onclick="window.open('/camera/manage','_blank')">Open in New Tab</button>
      </div>
      <div class="row">
        <button class="secondary" onclick="applyCamera()">Use Camera</button>
        <button class="secondary" onclick="startPreview()">Start Preview</button>
        <a class="button-link" href="/dist/virtual_cam_compositor.exe" download>Download Virtual Cam Compositor</a>
      </div>
      <video id="preview" autoplay playsinline style="width:100%;height:auto;object-fit:contain;background:#0b1222;border:1px solid #1f2937;border-radius:8px;"></video>
      <div id="previewResolution" style="margin-top:8px;color:#94a3b8;font-size:13px;">Preview resolution: -</div>
    </section>
    <section>
      <h2>Overlays</h2>
      <div id="overlays"></div>
      <div class="likes-overlay-config">
        <h3 class="overlay-name">Total Likes Overlay</h3>
        <div class="row">
          <input id="likeGoalInput" type="text" placeholder="Like Goal (optional, e.g. 250000)">
          <input id="prizeInput" type="text" placeholder="Prize (optional, e.g. Group Dance)">
          <button type="button" onclick="saveLikesOverlaySettings()">Save</button>
          <button id="likeOverlayToggleBtn" type="button" onclick="toggleLikesOverlay()">Hide</button>
        </div>
        <div class="row overlay-row" style="padding:6px 8px;">
          <div class="overlay-controls likes-layout-controls">
            <label class="likes-group-label">Group <select id="likeTargetGroupSelect" title="Target group for total likes overlay"></select></label>
            <label>X <input id="overlay-TotalLikesOverlay-x_offset" type="number" step="1" min="-10000" max="10000"></label>
            <label>Y <input id="overlay-TotalLikesOverlay-y_offset" type="number" step="1" min="-10000" max="10000"></label>
            <label>Scale <input id="overlay-TotalLikesOverlay-scale" type="number" step="0.1" min="0.1" max="8"></label>
            <button type="button" id="applyTotalLikesLayoutBtn">Apply</button>
          </div>
        </div>
        <div id="likesProgressWrap" class="likes-progress-wrap" style="display:none;">
          <div id="likesProgressFill" class="likes-progress-fill"></div>
          <div id="likesProgressLabel" class="likes-progress-label">0 / 0</div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/static/state_ws_helper.js"></script>
  <script src="/static/page_shared.js"></script>
  <script>
    const api = (p,o={})=>fetch(p,{method:o.method||"GET",headers:{"Content-Type":"application/json"},body:o.body?JSON.stringify(o.body):undefined});
    let state = {};
    let ws;
    let supabaseClient = null;
    let likeEventsChannel = null;
    let subscribedLikeHandle = "";
    let subscribedDayStart = 0;
    let subscribedDayEnd = 0;
    let latestTotalLikes = 0;

    let cameraLabelsReady = false;
    let cameraPermissionGranted = false;
    let previewStream = null;
    let previewDeviceId = null;
    let previewDeviceLabel = null;
    const MAX_PREVIEW_WIDTH = 7680;
    const MAX_PREVIEW_HEIGHT = 4320;
    const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    const COOKIE_PREFIX = "camera_manage_";

    async function getSupabaseConfig() {
      return api("/config").then(r => r.json()).catch(() => ({}));
    }

    async function ensureSupabaseClient() {
      if (supabaseClient) return supabaseClient;
      if (!window.supabase || !window.supabase.createClient) return null;
      const cfg = await getSupabaseConfig();
      if (!cfg.supabase_url || !cfg.supabase_key) return null;
      supabaseClient = window.supabase.createClient(cfg.supabase_url, cfg.supabase_key);
      return supabaseClient;
    }

    function setCookie(name, value, days = 365) {
      const key = encodeURIComponent(COOKIE_PREFIX + String(name || ""));
      const val = encodeURIComponent(String(value ?? ""));
      const maxAge = Math.max(1, Math.floor(days * 24 * 60 * 60));
      document.cookie = `${key}=${val}; Max-Age=${maxAge}; Path=/; SameSite=Lax`;
    }

    function getCookie(name) {
      const key = encodeURIComponent(COOKIE_PREFIX + String(name || "")) + "=";
      const parts = (document.cookie || "").split(";");
      for (const part of parts) {
        const entry = part.trim();
        if (entry.startsWith(key)) {
          return decodeURIComponent(entry.slice(key.length));
        }
      }
      return "";
    }

    function persistFieldValue(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const write = () => setCookie(id, el.value ?? "");
      el.addEventListener("input", write);
      el.addEventListener("change", write);
    }

    function restoreFieldValue(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const val = getCookie(id);
      if (val !== "") el.value = val;
    }
    async function ensureCameraLabels() {
      if (cameraLabelsReady) return;
      if (!cameraPermissionGranted) return;
      if (!navigator.mediaDevices?.getUserMedia) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        stream.getTracks().forEach(t => t.stop());
        cameraLabelsReady = true;
      } catch (e) {
        // If permission is denied, labels may remain blank.
      }
    }

    async function refreshCameras(userInitiated=false) {
      try {
        const backendList = await api("/camera/devices").then(r => r.json()).catch(() => ({devices: []}));
        const dshow = Array.isArray(backendList.devices) ? backendList.devices : [];
        if (userInitiated && !cameraPermissionGranted && navigator.mediaDevices?.getUserMedia) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            stream.getTracks().forEach(t => t.stop());
            cameraPermissionGranted = true;
            cameraLabelsReady = true;
          } catch (e) {
            // permission denied; continue with whatever labels we can get
          }
        }
        await ensureCameraLabels();
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === "videoinput");
        const select = document.getElementById("cameraSelect");
        const cookieCameraIdx = getCookie("cameraSelect_idx");
        const cookieCameraLabel = getCookie("cameraSelect_label");
        const prevSelection = {
          value: select.value,
          idx: select.selectedOptions[0]?.dataset?.idx || cookieCameraIdx,
          label: select.selectedOptions[0]?.dataset?.label || cookieCameraLabel
        };
        select.innerHTML = "";
        if (dshow.length) {
          dshow.forEach((cam) => {
            const opt = document.createElement("option");
            opt.value = cam.label || "";
            opt.dataset.idx = cam.index;
            opt.dataset.label = cam.label || "";
            opt.textContent = cam.label || `Camera ${cam.index}`;
            select.appendChild(opt);
          });
          if (!select.value && dshow[0]) select.value = dshow[0].label || "";
        } else {
          cams.forEach((cam, idx) => {
            const opt = document.createElement("option");
            opt.value = cam.deviceId || "";
            opt.dataset.idx = idx;
            opt.dataset.label = cam.label || "";
            opt.textContent = cam.label || `Camera ${idx}`;
            select.appendChild(opt);
          });
          if (!select.value && cams[0]) select.value = cams[0].deviceId;
        }
        if (prevSelection.idx || prevSelection.label) {
          const opts = Array.from(select.options);
          let matched = null;
          if (prevSelection.idx != null && prevSelection.idx !== "") {
            matched = opts.find(o => o.dataset?.idx === String(prevSelection.idx));
          }
          if (!matched && prevSelection.label) {
            matched = opts.find(o => (o.dataset?.label || "") === prevSelection.label);
          }
          if (matched) {
            matched.selected = true;
            select.value = matched.value;
          }
        }
        const activeOpt = select.selectedOptions?.[0];
        if (activeOpt) {
          setCookie("cameraSelect_idx", activeOpt.dataset?.idx || "");
          setCookie("cameraSelect_label", activeOpt.dataset?.label || "");
        }
      } catch (e) {
        console.warn("Camera enumeration failed", e);
      }
    }

    function applyCamera() {
      const select = document.getElementById("cameraSelect");
      const idx = Number(select.selectedOptions[0]?.dataset.idx ?? -1);
      const label = select.selectedOptions[0]?.dataset.label || "";
      const labelBase = label.replace(/\s*\([^)]*\)\s*$/, "");
      const payload = {index: idx, label};
      setCookie("cameraSelect_idx", String(idx));
      setCookie("cameraSelect_label", label);
      return api("/camera/select", {method:"POST", body: payload}).catch(()=>{});
    }

    function fmtNum(value) {
      const n = Number(value || 0);
      if (!Number.isFinite(n)) return "0";
      return Math.max(0, Math.trunc(n)).toLocaleString();
    }

    function isGroupName(name) {
      const text = String(name || "").toLowerCase();
      return text.includes("boys") || text.includes("girls");
    }

    function groupRowsFromState() {
      const dancers = Array.isArray(state?.dancers) ? state.dancers : [];
      return dancers
        .map((d) => ({
          name: String(d?.name || "").trim(),
          handle: String(d?.handle || "").trim().replace(/^@/, ""),
        }))
        .filter((d) => d.name && isGroupName(d.name))
        .sort((a, b) => a.name.localeCompare(b.name));
    }

    function normalizeHandle(value) {
      return String(value || "").trim().replace(/^@/, "").toLowerCase();
    }

    function dayBoundsUnix() {
      const startDate = new Date();
      startDate.setHours(0, 0, 0, 0);
      const start = startDate.getTime();
      const end = start + (24 * 60 * 60 * 1000);
      return {
        startUnix: Math.floor(start / 1000),
        endUnix: Math.floor(end / 1000),
      };
    }

    function resolveTargetHandleFromState() {
      const selectedOpt = document.getElementById("likeTargetGroupSelect")?.selectedOptions?.[0];
      const selectedHandle = normalizeHandle(selectedOpt?.dataset?.handle || "");
      if (selectedHandle) return selectedHandle;
      const configuredHandle = normalizeHandle(state.like_target_group_handle);
      if (configuredHandle) return configuredHandle;
      const configuredName = String(state.like_target_group_name || "").trim().toLowerCase();
      const dancers = Array.isArray(state?.dancers) ? state.dancers : [];
      if (configuredName) {
        const byName = dancers.find((d) => String(d?.name || "").trim().toLowerCase() === configuredName);
        if (byName) return normalizeHandle(byName.handle);
      }
      const activeGroup = String(state.group_name || "").trim().toLowerCase();
      if (activeGroup) {
        const byGroup = dancers.find((d) => String(d?.name || "").trim().toLowerCase() === activeGroup);
        if (byGroup) return normalizeHandle(byGroup.handle);
      }
      return "";
    }

    function parseLikeGoalFromState() {
      const raw = String(state.like_goal || "").trim();
      const digits = raw.replace(/[^\d]/g, "");
      if (!digits) return 0;
      const n = Number(digits);
      return Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
    }

    function renderLikeTargetGroupOptions() {
      const select = document.getElementById("likeTargetGroupSelect");
      if (!select) return;
      select.onchange = () => {
        const opt = select.selectedOptions?.[0];
        setCookie("likeTargetGroupName", opt?.dataset?.name || "");
        setCookie("likeTargetGroupHandle", opt?.dataset?.handle || "");
        startLikeEventsSubscription().catch(()=>{});
      };
      const focused = document.activeElement === select;
      const configuredHandle = String(state.like_target_group_handle || "").trim().replace(/^@/, "");
      const configuredName = String(state.like_target_group_name || "").trim();
      const cookieHandle = String(getCookie("likeTargetGroupHandle") || "").trim().replace(/^@/, "");
      const cookieName = String(getCookie("likeTargetGroupName") || "").trim();
      const groups = groupRowsFromState();
      select.innerHTML = "";
      if (!groups.length) {
        const emptyOpt = document.createElement("option");
        emptyOpt.value = "";
        emptyOpt.dataset.name = "";
        emptyOpt.dataset.handle = "";
        emptyOpt.textContent = "No groups found";
        emptyOpt.disabled = true;
        emptyOpt.selected = true;
        select.appendChild(emptyOpt);
        return;
      }

      groups.forEach((group) => {
        const opt = document.createElement("option");
        const value = group.handle || `name:${group.name}`;
        opt.value = value;
        opt.dataset.name = group.name;
        opt.dataset.handle = group.handle || "";
        opt.textContent = group.handle ? `${group.name} (@${group.handle})` : group.name;
        select.appendChild(opt);
      });

      if (focused) return;
      let chosen = select.options[0];
      if (configuredHandle) {
        chosen =
          Array.from(select.options).find(
            (o) => String(o.dataset?.handle || "").toLowerCase() === configuredHandle.toLowerCase()
          ) || chosen;
      } else if (configuredName) {
        chosen =
          Array.from(select.options).find(
            (o) => String(o.dataset?.name || "").toLowerCase() === configuredName.toLowerCase()
          ) || chosen;
      } else if (cookieHandle) {
        chosen =
          Array.from(select.options).find(
            (o) => String(o.dataset?.handle || "").toLowerCase() === cookieHandle.toLowerCase()
          ) || chosen;
      } else if (cookieName) {
        chosen =
          Array.from(select.options).find(
            (o) => String(o.dataset?.name || "").toLowerCase() === cookieName.toLowerCase()
          ) || chosen;
      }
      select.value = chosen.value;
      const activeOpt = select.selectedOptions?.[0];
      if (activeOpt) {
        setCookie("likeTargetGroupName", activeOpt.dataset?.name || "");
        setCookie("likeTargetGroupHandle", activeOpt.dataset?.handle || "");
      }
    }

    function renderLikesSettingsFromState() {
      renderLikeTargetGroupOptions();
      const goalInput = document.getElementById("likeGoalInput");
      const prizeInput = document.getElementById("prizeInput");
      const goalValue = (state.like_goal || getCookie("likeGoalInput") || "");
      const prizeValue = (state.prize || getCookie("prizeInput") || "");
      if (goalInput && document.activeElement !== goalInput) {
        goalInput.value = goalValue;
        setCookie("likeGoalInput", goalValue);
      }
      if (prizeInput && document.activeElement !== prizeInput) {
        prizeInput.value = prizeValue;
        setCookie("prizeInput", prizeValue);
      }
      renderTotalLikesLayoutControls();
      renderLikesSummary();
    }

    function renderTotalLikesLayoutControls() {
      const name = "TotalLikesOverlay";
      const xInput = document.getElementById("overlay-TotalLikesOverlay-x_offset");
      const yInput = document.getElementById("overlay-TotalLikesOverlay-y_offset");
      const sInput = document.getElementById("overlay-TotalLikesOverlay-scale");
      const applyBtn = document.getElementById("applyTotalLikesLayoutBtn");
      if (!xInput || !yInput || !sInput || !applyBtn) return;
      const { layout, fromCookie } = getOverlayLayoutForRender(name);
      if (document.activeElement !== xInput) xInput.value = String(layout.x_offset);
      if (document.activeElement !== yInput) yInput.value = String(layout.y_offset);
      if (document.activeElement !== sInput) sInput.value = String(layout.scale);
      const apply = () => applyOverlayLayout(name, readOverlayLayoutFromInputs(name));
      applyBtn.onclick = apply;
      [xInput, yInput, sInput].forEach((input) => {
        input.oninput = () => persistOverlayLayoutCookies(name, readOverlayLayoutFromInputs(name));
        input.onchange = apply;
      });
      if (fromCookie) {
        applyOverlayLayout(name, layout, true);
      }
    }

    function renderLikesSummary() {
      const progressWrap = document.getElementById("likesProgressWrap");
      const progressFill = document.getElementById("likesProgressFill");
      const progressLabel = document.getElementById("likesProgressLabel");

      const totalLikesRaw = Number(latestTotalLikes || 0);
      const totalLikes = Number.isFinite(totalLikesRaw) ? Math.max(0, Math.floor(totalLikesRaw)) : 0;
      const goalValue = parseLikeGoalFromState();
      const hasGoal = Number.isFinite(goalValue) && goalValue > 0;

      if (progressWrap && progressFill && progressLabel) {
        if (hasGoal) {
          const ratio = Math.max(0, Math.min(1, totalLikes / goalValue));
          progressWrap.style.display = "";
          progressFill.style.width = `${Math.round(ratio * 100)}%`;
          progressLabel.textContent = `${fmtNum(totalLikes)} / ${fmtNum(goalValue)} (${Math.round(ratio * 100)}%)`;
        } else {
          progressWrap.style.display = "none";
          progressFill.style.width = "0%";
          progressLabel.textContent = "0 / 0";
        }
      }
    }

    async function stopLikeEventsSubscription() {
      if (!likeEventsChannel || !supabaseClient) return;
      try {
        await supabaseClient.removeChannel(likeEventsChannel);
      } catch (e) {
        // ignore cleanup failures
      } finally {
        likeEventsChannel = null;
      }
    }

    async function startLikeEventsSubscription() {
      const targetHandle = resolveTargetHandleFromState();
      const { startUnix, endUnix } = dayBoundsUnix();
      const sameSubscription =
        likeEventsChannel &&
        targetHandle === subscribedLikeHandle &&
        startUnix === subscribedDayStart &&
        endUnix === subscribedDayEnd;
      if (sameSubscription) return;

      await stopLikeEventsSubscription();
      subscribedLikeHandle = targetHandle;
      subscribedDayStart = startUnix;
      subscribedDayEnd = endUnix;
      latestTotalLikes = 0;
      renderLikesSummary();

      if (!targetHandle) return;
      const client = await ensureSupabaseClient();
      if (!client) return;

      try {
        const { data } = await client
          .from("like_events")
          .select("total_like_count, unix_ts, tiktok_username")
          .eq("tiktok_username", targetHandle)
          .gte("unix_ts", startUnix)
          .lt("unix_ts", endUnix)
          .order("unix_ts", { ascending: false })
          .limit(1);
        const row = Array.isArray(data) && data.length ? data[0] : null;
        const initialTotal = Number(row?.total_like_count || 0);
        latestTotalLikes = Number.isFinite(initialTotal) ? Math.max(0, Math.floor(initialTotal)) : 0;
        renderLikesSummary();
      } catch (e) {
        latestTotalLikes = 0;
        renderLikesSummary();
      }

      const channelName = `like-events-${targetHandle}-${startUnix}`;
      likeEventsChannel = client
        .channel(channelName)
        .on(
          "postgres_changes",
          { event: "INSERT", schema: "public", table: "like_events", filter: `tiktok_username=eq.${targetHandle}` },
          async (payload) => {
            const row = payload?.new || {};
            const rowHandle = normalizeHandle(row.tiktok_username);
            if (!rowHandle || rowHandle !== normalizeHandle(subscribedLikeHandle)) return;
            const unixTs = Number(row.unix_ts || 0);
            if (!Number.isFinite(unixTs)) return;
            if (unixTs >= subscribedDayEnd) {
              try {
                await startLikeEventsSubscription();
              } catch (e) {
                // ignore transient subscription resets
              }
              return;
            }
            if (unixTs < subscribedDayStart) return;
            const nextTotal = Number(row.total_like_count || 0);
            if (!Number.isFinite(nextTotal)) return;
            latestTotalLikes = Math.max(0, Math.floor(nextTotal));
            renderLikesSummary();
          }
        )
        .subscribe();
    }

    async function saveLikesOverlaySettings() {
      const likeGoal = document.getElementById("likeGoalInput")?.value || "";
      const prize = document.getElementById("prizeInput")?.value || "";
      const targetSelect = document.getElementById("likeTargetGroupSelect");
      const selectedOpt = targetSelect?.selectedOptions?.[0] || null;
      const targetGroupName = String(selectedOpt?.dataset?.name || "").trim();
      const targetGroupHandle = String(selectedOpt?.dataset?.handle || "").trim().replace(/^@/, "");
      setCookie("likeGoalInput", likeGoal);
      setCookie("prizeInput", prize);
      setCookie("likeTargetGroupName", targetGroupName);
      setCookie("likeTargetGroupHandle", targetGroupHandle);
      try {
        const res = await api("/camera/likes/settings", {
          method: "POST",
          body: {
            like_goal: likeGoal,
            prize,
            target_group_name: targetGroupName,
            target_group_handle: targetGroupHandle,
          }
        });
        if (!res.ok) return;
        state = await res.json();
        renderLikesSettingsFromState();
        await startLikeEventsSubscription();
        renderLikesSummary();
      } catch (e) {
        // no-op
      }
    }

    function isLikesOverlayVisible() {
      const overlays = state.overlay_states || {};
      if (Object.prototype.hasOwnProperty.call(overlays, "TotalLikesOverlay")) {
        return !!overlays.TotalLikesOverlay;
      }
      return true;
    }

    function updateLikesOverlayToggleButton() {
      const btn = document.getElementById("likeOverlayToggleBtn");
      if (!btn) return;
      btn.textContent = isLikesOverlayVisible() ? "Hide" : "Show";
    }

    function toggleLikesOverlay() {
      const next = !isLikesOverlayVisible();
      toggleOverlay("TotalLikesOverlay", next);
      updateLikesOverlayToggleButton();
    }

    function stopPreview() {
      const video = document.getElementById("preview");
      const meta = document.getElementById("previewResolution");
      if (!video) return;
      const stream = previewStream || video.srcObject;
      if (stream && stream.getTracks) {
        stream.getTracks().forEach(t => t.stop());
      }
      video.srcObject = null;
      previewStream = null;
      if (meta) meta.textContent = "Preview resolution: -";
    }

    async function startPreview() {
      const video = document.getElementById("preview");
      if (!navigator.mediaDevices?.getUserMedia) return alert("getUserMedia not supported");
      try {
        stopPreview();
        await applyCamera();
        await delay(300);
        const refreshed = await navigator.mediaDevices.enumerateDevices();
        const vcams = refreshed.filter(d => d.kind === "videoinput");
        const virtuals = vcams.filter(c => /virtual/i.test(c.label || ""));
        let target = null;
        if (previewDeviceId) {
          target = virtuals.find(c => c.deviceId === previewDeviceId);
          if (!target && previewDeviceLabel) {
            const needle = previewDeviceLabel.toLowerCase();
            target = virtuals.find(c => (c.label || "").toLowerCase() === needle)
              || virtuals.find(c => (c.label || "").toLowerCase().includes(needle));
          }
          if (!target) {
            return alert("Previous virtual camera not available. Not switching previews.");
          }
        } else {
          target = virtuals.find(c => /obs/i.test(c.label || "")) || virtuals[0];
          if (!target) {
            return alert("No virtual camera found for preview. Start the virtual cam compositor and click Refresh Cameras.");
          }
        }
        const baseConstraints = target.deviceId
          ? {
              deviceId: { exact: target.deviceId },
              width: { ideal: MAX_PREVIEW_WIDTH },
              height: { ideal: MAX_PREVIEW_HEIGHT },
            }
          : {
              width: { ideal: MAX_PREVIEW_WIDTH },
              height: { ideal: MAX_PREVIEW_HEIGHT },
            };
        const openStream = async (videoConstraints) => {
          const stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints });
          previewStream = stream;
          video.srcObject = stream;
          await video.play();
        };
        stopPreview();
        await delay(150);
        await openStream(baseConstraints);
        let track = previewStream?.getVideoTracks?.()[0] || null;
        let settings = track?.getSettings?.() || {};
        const caps = track?.getCapabilities?.() || {};
        const maxWidth = Number(caps?.width?.max || 0);
        const maxHeight = Number(caps?.height?.max || 0);
        const currWidth = Number(settings.width || video.videoWidth || 0);
        const currHeight = Number(settings.height || video.videoHeight || 0);
        if (
          maxWidth > 0 && maxHeight > 0 &&
          (maxWidth > currWidth || maxHeight > currHeight)
        ) {
          try {
            stopPreview();
            await delay(100);
            await openStream({
              ...baseConstraints,
              width: { ideal: maxWidth, max: maxWidth },
              height: { ideal: maxHeight, max: maxHeight },
            });
            track = previewStream?.getVideoTracks?.()[0] || track;
            settings = track?.getSettings?.() || settings;
          } catch (e) {
            // keep first opened stream if hard max request fails
          }
        }
        const width = Number(settings.width || video.videoWidth || 0);
        const height = Number(settings.height || video.videoHeight || 0);
        const meta = document.getElementById("previewResolution");
        if (meta) {
          meta.textContent = (width > 0 && height > 0)
            ? `Preview resolution: ${width} x ${height}`
            : "Preview resolution: unknown";
        }
        if (width > 0 && height > 0) {
          video.style.aspectRatio = `${width} / ${height}`;
        }
        previewDeviceId = target.deviceId || null;
        previewDeviceLabel = target.label || null;
        cameraPermissionGranted = true;
        cameraLabelsReady = true;
        refreshCameras(true);
      } catch (err) {
        if (err?.name === "NotReadableError") {
          const label = previewDeviceLabel || "virtual camera";
          return alert(
            "Camera access denied or unavailable for " + label + ".\n" +
            "Not switching previews. Close other apps or restart the virtual cam compositor and try again."
          );
        }
        alert("Camera access denied or unavailable: " + err);
      }
    }

    function _layoutCookieKey(name, key) {
      return `overlay_${name}_${key}`;
    }

    function _numOr(value, fallback) {
      if (value === null || value === undefined) return fallback;
      if (typeof value === "string" && value.trim() === "") return fallback;
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }

    function getOverlayLayoutFromState(name) {
      const raw = state?.overlay_layouts?.[name] || {};
      return {
        x_offset: _numOr(raw.x_offset, 0),
        y_offset: _numOr(raw.y_offset, 0),
        scale: Math.max(0.1, _numOr(raw.scale, 1)),
      };
    }

    function getOverlayLayoutFromCookies(name) {
      return {
        x_offset: _numOr(getCookie(_layoutCookieKey(name, "x_offset")), 0),
        y_offset: _numOr(getCookie(_layoutCookieKey(name, "y_offset")), 0),
        scale: Math.max(0.1, _numOr(getCookie(_layoutCookieKey(name, "scale")), 1)),
      };
    }

    function persistOverlayLayoutCookies(name, layout) {
      setCookie(_layoutCookieKey(name, "x_offset"), String(_numOr(layout?.x_offset, 0)));
      setCookie(_layoutCookieKey(name, "y_offset"), String(_numOr(layout?.y_offset, 0)));
      setCookie(_layoutCookieKey(name, "scale"), String(Math.max(0.1, _numOr(layout?.scale, 1))));
    }

    async function applyOverlayLayout(name, layout, optimistic = true) {
      const payload = {
        x_offset: _numOr(layout?.x_offset, 0),
        y_offset: _numOr(layout?.y_offset, 0),
        scale: Math.max(0.1, _numOr(layout?.scale, 1)),
      };
      persistOverlayLayoutCookies(name, payload);
      if (optimistic) {
        if (!state.overlay_layouts) state.overlay_layouts = {};
        state.overlay_layouts[name] = payload;
      }
      try {
        const res = await api(`/overlay/${name}/layout`, { method: "POST", body: payload });
        if (res.ok) {
          const next = await res.json();
          state = next;
        }
      } catch (e) {
        // ignore transient failures
      }
    }

    function getOverlayLayoutForRender(name) {
      const stateLayout = getOverlayLayoutFromState(name);
      const hasStateLayout = !!(state?.overlay_layouts && Object.prototype.hasOwnProperty.call(state.overlay_layouts, name));
      if (hasStateLayout) return { layout: stateLayout, fromCookie: false };
      const cookieLayout = getOverlayLayoutFromCookies(name);
      const cookieIsNonDefault =
        cookieLayout.x_offset !== 0 || cookieLayout.y_offset !== 0 || Math.abs(cookieLayout.scale - 1) > 1e-9;
      if (cookieIsNonDefault) return { layout: cookieLayout, fromCookie: true };
      return { layout: stateLayout, fromCookie: false };
    }

    function createOverlayLayoutNumberInput(name, key, value) {
      const input = document.createElement("input");
      input.type = "number";
      input.step = key === "scale" ? "0.1" : "1";
      input.min = key === "scale" ? "0.1" : "-10000";
      input.max = key === "scale" ? "8" : "10000";
      input.value = String(value);
      input.id = `overlay-${name}-${key}`;
      return input;
    }

    function readOverlayLayoutFromInputs(name) {
      const x = _numOr(document.getElementById(`overlay-${name}-x_offset`)?.value, 0);
      const y = _numOr(document.getElementById(`overlay-${name}-y_offset`)?.value, 0);
      const s = Math.max(0.1, _numOr(document.getElementById(`overlay-${name}-scale`)?.value, 1));
      return { x_offset: x, y_offset: y, scale: s };
    }

    function renderOverlays() {
      const wrap = document.getElementById("overlays");
      wrap.innerHTML = "";
      const overlays = state.overlay_states || {};
      const fallback = Object.keys(overlays).length ? overlays : {CenterDottedLine:false, BurstOverlay:false, BattleScore:true, TotalLikesOverlay:true};
      Object.keys(fallback).filter(name => name !== "TotalLikesOverlay").forEach(name => {
        const row = document.createElement("div");
        row.className = "row overlay-row";
        const label = document.createElement("span");
        label.className = "overlay-name";
        label.textContent = name;

        const controls = document.createElement("div");
        controls.className = "overlay-controls";

        const { layout, fromCookie } = getOverlayLayoutForRender(name);
        const xInput = createOverlayLayoutNumberInput(name, "x_offset", layout.x_offset);
        const yInput = createOverlayLayoutNumberInput(name, "y_offset", layout.y_offset);
        const sInput = createOverlayLayoutNumberInput(name, "scale", layout.scale);

        const xLabel = document.createElement("label");
        xLabel.textContent = "X";
        xLabel.appendChild(xInput);
        const yLabel = document.createElement("label");
        yLabel.textContent = "Y";
        yLabel.appendChild(yInput);
        const sLabel = document.createElement("label");
        sLabel.textContent = "Scale";
        sLabel.appendChild(sInput);

        const applyBtn = document.createElement("button");
        applyBtn.textContent = "Apply";
        applyBtn.onclick = () => applyOverlayLayout(name, readOverlayLayoutFromInputs(name));

        [xInput, yInput, sInput].forEach((input) => {
          input.addEventListener("input", () => persistOverlayLayoutCookies(name, readOverlayLayoutFromInputs(name)));
          input.addEventListener("change", () => applyOverlayLayout(name, readOverlayLayoutFromInputs(name)));
        });

        const btn = document.createElement("button");
        btn.textContent = fallback[name] ? "Hide" : "Show";
        btn.onclick = () => toggleOverlay(name, !fallback[name]);

        controls.appendChild(xLabel);
        controls.appendChild(yLabel);
        controls.appendChild(sLabel);
        controls.appendChild(applyBtn);
        controls.appendChild(btn);
        row.appendChild(label);
        row.appendChild(controls);
        wrap.appendChild(row);

        if (fromCookie) {
          applyOverlayLayout(name, layout, true);
        }
      });
      updateLikesOverlayToggleButton();
    }

    function toggleOverlay(name, show) {
      if (!state.overlay_states) state.overlay_states = {};
      state.overlay_states[name] = show;
      renderOverlays();
      updateLikesOverlayToggleButton();
      api(`/overlay/${name}/${show ? "show" : "hide"}`, {method:"POST"}).catch(()=>{});
    }

    function refreshState() {
      api("/state").then(r=>r.json()).then(s => {
        state = s;
        renderOverlays();
        renderLikesSettingsFromState();
        startLikeEventsSubscription().catch(()=>{});
      }).catch(()=>{});
    }

    function connectWs() {
      if (!window.PageShared?.connectWsStatus) return;
      try { ws?.close(); } catch (e) {}
      ws = window.PageShared.connectWsStatus({
        connectedText: "Live",
        disconnectedText: "Disconnected",
        onOpen: () => { refreshState(); },
        onWake: () => { refreshState(); },
        onState: (payload) => {
          state = payload;
          renderOverlays();
          renderLikesSettingsFromState();
          startLikeEventsSubscription().catch(()=>{});
        },
      });
    }

    function initFieldPersistence() {
      ["likeGoalInput", "prizeInput"].forEach((id) => {
        restoreFieldValue(id);
        persistFieldValue(id);
      });
    }

    refreshState();
    connectWs();
    window.PageShared.initPracticeModeHeader({apiFn: api});
    initFieldPersistence();
    refreshCameras(false);
    window.addEventListener("pagehide", () => {
      stopPreview();
      stopLikeEventsSubscription().catch(()=>{});
    });
    window.addEventListener("beforeunload", stopPreview);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stopPreview();
    });
  </script>
</body>
</html>
