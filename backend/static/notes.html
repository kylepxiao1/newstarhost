<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notes</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 16px 24px 16px; background: #1e293b; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 20px; }
    main { padding: 20px 24px; }
    section { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.02); max-width: 980px; }
    h2 { margin-top: 0; font-size: 16px; letter-spacing: 0.02em; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-weight: 600; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0b1222;
      color: #e2e8f0;
      font: inherit;
    }
    textarea { min-height: 110px; resize: vertical; }
    .stream-format-grid {
      display: grid;
      grid-template-columns: 44px 1fr 160px 90px;
      gap: 8px;
      align-items: center;
    }
    .stream-header {
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .stream-rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stream-row {
      padding: 8px;
      border: 1px solid #1f2937;
      border-radius: 8px;
      background: #0b1222;
      transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease, background-color 140ms ease, opacity 140ms ease;
    }
    .stream-row.dragging {
      opacity: 0.72;
      border-color: #2563eb;
      background: #0f172a;
      transform: scale(0.995);
      box-shadow: 0 8px 24px rgba(37,99,235,.28);
    }
    .stream-row.drag-over {
      border-color: #60a5fa;
      background: #111b33;
      transform: translateY(-1px);
      box-shadow: inset 0 0 0 1px rgba(96,165,250,.35);
    }
    .drag-handle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 36px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #111827;
      color: #cbd5e1;
      cursor: grab;
      user-select: none;
    }
    .drag-handle:active { cursor: grabbing; }
    .drag-handle:hover { border-color: #475569; background: #0f172a; color: #e2e8f0; }
    .drag-handle:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 1px;
    }
    .drag-handle svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .stream-row input {
      width: 100%;
    }
    .remove-segment-btn {
      background: #ef4444;
      width: 100%;
    }
    .add-segment-row {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .stream-total {
      color: #93c5fd;
      font-weight: 600;
      font-size: 13px;
      margin-left: auto;
      text-align: right;
    }
    .members-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      padding: 10px;
      border: 1px solid #1f2937;
      border-radius: 8px;
      background: #0b1222;
      max-height: 220px;
      overflow: auto;
    }
    .member-item { display: inline-flex; align-items: center; gap: 6px; min-width: 180px; }
    .member-item input { width: auto; }
    button {
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: 600;
    }
    button.secondary { background: #334155; }
    .status { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; text-transform: uppercase; }
    .status-text { margin-top: 10px; min-height: 22px; color: #93c5fd; }
    .status-text.error { color: #fca5a5; }
    .status-text.success { color: #86efac; }
    .past-notes-wrap {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #1f2937;
    }
    .past-notes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }
    .past-note-card {
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 10px;
      background: #0b1222;
    }
    .past-note-title {
      font-weight: 700;
      margin-bottom: 8px;
      color: #bfdbfe;
    }
    .past-note-field {
      margin: 4px 0;
      color: #cbd5e1;
    }
    .past-note-label {
      color: #93c5fd;
      font-weight: 600;
      margin-right: 6px;
    }
    .past-note-pre {
      white-space: pre-wrap;
      margin: 0;
      font: inherit;
      color: #e2e8f0;
    }
    .past-note-format-list {
      margin: 4px 0 0 0;
      padding-left: 18px;
      color: #e2e8f0;
    }
    .past-notes-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    @media (max-width: 900px) {
      header { padding: 12px 12px 8px; }
      header .status { display: none !important; }
      h1 { font-size: 18px; }
      main { padding: 12px; }
      section { padding: 12px; }
      .member-item { min-width: 140px; }
      .stream-format-grid {
        grid-template-columns: 40px 1fr 100px 76px;
        gap: 6px;
      }
      .drag-handle { height: 34px; }
      .remove-segment-btn { padding: 8px 6px; }
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="wsDot" style="display:inline-flex;align-items:center;justify-content:center;width:10px;height:10px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444;"></span>
      <h1>Notes</h1>
    </div>
    <div class="status" style="display:flex;align-items:center;gap:6px;font-weight:700;text-transform:uppercase;">
      <span id="statusText">Connecting</span>
    </div>
  </header>
  <main>
    <section>
      <h2>Stream Notes</h2>
      <form id="notesForm">
        <div class="field">
          <label for="hostInput">Host</label>
          <input id="hostInput" type="text" placeholder="Host name">
        </div>

        <div class="field">
          <label for="streamDateInput">Stream Date</label>
          <input id="streamDateInput" type="date">
        </div>

        <div class="field">
          <label for="groupSelect">Group</label>
          <select id="groupSelect"></select>
        </div>

        <div class="field">
          <label for="outfitThemeInput">Outfit Theme</label>
          <input id="outfitThemeInput" type="text" placeholder="e.g. Neon streetwear">
        </div>

        <div class="field">
          <label>Members Present</label>
          <div id="membersWrap" class="members-wrap"></div>
        </div>

        <div class="field">
          <label for="mvpSelect">MVP</label>
          <select id="mvpSelect"></select>
        </div>

        <div class="field">
          <label>Stream Format</label>
          <div class="stream-format-grid stream-header">
            <div></div>
            <div>Segment</div>
            <div>Duration (min)</div>
            <div></div>
          </div>
          <div id="streamRows" class="stream-rows"></div>
          <div class="add-segment-row">
            <button type="button" id="addSegmentBtn">Add Segment</button>
            <div id="streamDurationTotal" class="stream-total">Total Duration: 0h 0m</div>
          </div>
        </div>

        <div class="field">
          <label for="additionalNotesInput">Additional Notes</label>
          <textarea id="additionalNotesInput" placeholder="Any notes about this stream"></textarea>
        </div>

        <button id="submitBtn" type="submit">Submit</button>
        <button id="cancelEditBtn" class="secondary" type="button" style="display:none;">Cancel Edit</button>
        <div id="formStatus" class="status-text"></div>

        <div class="past-notes-wrap">
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button id="togglePastNotesBtn" class="secondary" type="button">View Past Notes</button>
            <a href="/notes/attendance" target="_blank"><button type="button" class="secondary">Attendance Spreadsheet</button></a>
          </div>
          <div id="pastNotesPanel" hidden>
            <div id="pastNotesStatus" class="status-text"></div>
            <div id="pastNotesList" class="past-notes-list"></div>
            <div class="past-notes-actions">
              <button id="loadMoreNotesBtn" class="secondary" type="button" style="display:none;">Load More</button>
            </div>
          </div>
        </div>
      </form>
    </section>
  </main>

  <script src="/static/state_ws_helper.js"></script>
  <script src="/static/page_shared.js"></script>
  <script>
    const api = window.PageShared.api;
    let dancers = [];
    let selectedMemberSet = new Set();
    let streamSegments = [];
    let draggedSegmentId = null;
    let dragOverSegmentId = null;
    let nextSegmentId = 1;
    const NOTES_PAGE_SIZE = 10;
    let pastNotesVisible = false;
    let pastNotesLoading = false;
    let pastNotesOffset = 0;
    let pastNotesHasMore = true;
    let pastNotesItems = [];
    let editingNoteId = null;
    const HOST_COOKIE_KEY = "notes_host";
    const STREAM_FORMAT_COOKIE_KEY = "notes_stream_format";
    const DEFAULT_STREAM_SEGMENTS = [
      {segment: "Group Block", duration: "30"},
      {segment: "Battles", duration: "80"},
      {segment: "MVP Ceremony", duration: "9"},
      {segment: "Closing Song", duration: "1"},
    ];

    function sortedNames(list) {
      return (list || [])
        .map(d => (d && d.name ? String(d.name).trim() : ""))
        .filter(Boolean)
        .sort((a, b) => b.localeCompare(a));
    }

    function setCookie(name, value, days = 365) {
      const safeName = encodeURIComponent(String(name || ""));
      const safeValue = encodeURIComponent(String(value || ""));
      const maxAge = Math.max(1, Math.floor(days * 24 * 60 * 60));
      document.cookie = `${safeName}=${safeValue}; Max-Age=${maxAge}; Path=/; SameSite=Lax`;
    }

    function getCookie(name) {
      const safeName = encodeURIComponent(String(name || "")) + "=";
      const parts = (document.cookie || "").split(";");
      for (const part of parts) {
        const p = part.trim();
        if (!p.startsWith(safeName)) continue;
        return decodeURIComponent(p.slice(safeName.length));
      }
      return "";
    }

    function todayYmd() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function restorePersistedDefaults() {
      const host = getCookie(HOST_COOKIE_KEY);
      const streamFormat = getCookie(STREAM_FORMAT_COOKIE_KEY);
      if (host) document.getElementById("hostInput").value = host;
      const streamDateInput = document.getElementById("streamDateInput");
      if (streamDateInput && !streamDateInput.value) {
        streamDateInput.value = todayYmd();
      }
      loadStreamSegmentsFromCookie(streamFormat);
      renderStreamSegments();
    }

    function wirePersistedDefaults() {
      const hostInput = document.getElementById("hostInput");
      hostInput.addEventListener("input", () => setCookie(HOST_COOKIE_KEY, hostInput.value.trim()));
      document.getElementById("addSegmentBtn").addEventListener("click", () => {
        addStreamSegment();
      });
    }

    function sanitizeStreamSegments(items) {
      const cleaned = [];
      (items || []).forEach(item => {
        if (!item || typeof item !== "object") return;
        const segment = String(item.segment || "").trim();
        let duration = String(item.duration || "").trim();
        duration = duration.replace(/\s*min$/i, "").trim();
        const digitsOnly = duration.replace(/[^\d]/g, "");
        if (digitsOnly) duration = digitsOnly;
        if (!segment && !duration) return;
        cleaned.push({segment, duration});
      });
      return cleaned;
    }

    function loadStreamSegmentsFromCookie(rawCookie) {
      let parsed = [];
      const raw = String(rawCookie || "").trim();
      if (raw) {
        try {
          const asJson = JSON.parse(raw);
          if (Array.isArray(asJson)) {
            parsed = sanitizeStreamSegments(asJson);
          }
        } catch (e) {
          parsed = [];
        }
      }
      if (!parsed.length) {
        parsed = sanitizeStreamSegments(DEFAULT_STREAM_SEGMENTS);
      }
      streamSegments = parsed.map((row) => ({
        id: nextSegmentId++,
        segment: row.segment,
        duration: row.duration,
      }));
    }

    function serializeStreamSegmentsForCookie() {
      const rows = streamSegments.map(row => ({
        segment: String(row.segment || "").trim(),
        duration: String(row.duration || "").trim(),
      }));
      return JSON.stringify(rows);
    }

    function validateStreamSegments() {
      const rows = [];
      for (let i = 0; i < streamSegments.length; i++) {
        const row = streamSegments[i] || {};
        const segment = String(row.segment || "").trim();
        const durationText = String(row.duration || "").trim();
        if (!segment && !durationText) continue;
        if (!segment) {
          return {ok: false, error: `Segment name is required for row ${i + 1}.`};
        }
        const durationInt = Number.parseInt(durationText, 10);
        if (!Number.isInteger(durationInt) || durationInt <= 0) {
          return {ok: false, error: `Duration must be a positive integer for \"${segment}\".`};
        }
        rows.push({segment, duration_min: durationInt});
      }
      if (!rows.length) {
        return {ok: false, error: "Add at least one stream format segment."};
      }
      return {ok: true, rows};
    }

    function streamFormatJsonlValue() {
      const check = validateStreamSegments();
      if (!check.ok) return check;
      const text = check.rows.map(row => JSON.stringify(row)).join("\n");
      return {ok: true, text, rows: check.rows};
    }

    function persistStreamSegmentsCookie() {
      setCookie(STREAM_FORMAT_COOKIE_KEY, serializeStreamSegmentsForCookie());
    }

    function updateStreamDurationTotal() {
      const total = streamSegments.reduce((acc, row) => {
        const val = Number.parseInt(String(row?.duration || "").trim(), 10);
        return Number.isInteger(val) && val > 0 ? acc + val : acc;
      }, 0);
      const hours = Math.floor(total / 60);
      const minutes = total % 60;
      const el = document.getElementById("streamDurationTotal");
      if (el) el.textContent = `Total Duration: ${hours}h ${minutes}m`;
    }

    function moveStreamSegment(fromId, toId) {
      if (fromId === toId) return;
      const fromIndex = streamSegments.findIndex(row => row.id === fromId);
      const toIndex = streamSegments.findIndex(row => row.id === toId);
      if (fromIndex < 0 || toIndex < 0) return;
      const [moved] = streamSegments.splice(fromIndex, 1);
      streamSegments.splice(toIndex, 0, moved);
      renderStreamSegments();
      persistStreamSegmentsCookie();
    }

    function clearStreamDragOverState() {
      dragOverSegmentId = null;
      document.querySelectorAll("#streamRows .stream-row.drag-over").forEach((rowEl) => {
        rowEl.classList.remove("drag-over");
      });
    }

    function addStreamSegment(segment = "", duration = "") {
      streamSegments.push({
        id: nextSegmentId++,
        segment: String(segment || "").trim(),
        duration: String(duration || "").trim(),
      });
      renderStreamSegments();
      persistStreamSegmentsCookie();
    }

    function removeStreamSegment(id) {
      streamSegments = streamSegments.filter(row => row.id !== id);
      renderStreamSegments();
      persistStreamSegmentsCookie();
    }

    function updateStreamSegment(id, key, value) {
      const row = streamSegments.find(item => item.id === id);
      if (!row) return;
      row[key] = value;
      persistStreamSegmentsCookie();
      updateStreamDurationTotal();
    }

    function renderStreamSegments() {
      const wrap = document.getElementById("streamRows");
      wrap.innerHTML = "";
      streamSegments.forEach(row => {
        const item = document.createElement("div");
        item.className = "stream-row";
        item.draggable = true;
        item.dataset.id = String(row.id);

        item.addEventListener("dragstart", () => {
          draggedSegmentId = row.id;
          requestAnimationFrame(() => item.classList.add("dragging"));
        });
        item.addEventListener("dragend", () => {
          draggedSegmentId = null;
          clearStreamDragOverState();
          item.classList.remove("dragging");
        });
        item.addEventListener("dragover", (evt) => {
          evt.preventDefault();
          if (draggedSegmentId == null || draggedSegmentId === row.id) return;
          if (dragOverSegmentId !== row.id) {
            clearStreamDragOverState();
            item.classList.add("drag-over");
            dragOverSegmentId = row.id;
          }
        });
        item.addEventListener("drop", (evt) => {
          evt.preventDefault();
          if (draggedSegmentId == null) return;
          clearStreamDragOverState();
          moveStreamSegment(draggedSegmentId, row.id);
        });

        const grid = document.createElement("div");
        grid.className = "stream-format-grid";

        const handleBtn = document.createElement("button");
        handleBtn.type = "button";
        handleBtn.className = "drag-handle";
        handleBtn.title = "Drag to reorder";
        handleBtn.setAttribute("aria-label", "Drag to reorder");
        handleBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 7h14M5 12h14M5 17h14"/></svg>';

        const segInput = document.createElement("input");
        segInput.type = "text";
        segInput.value = row.segment || "";
        segInput.placeholder = "Segment";
        segInput.addEventListener("input", () => {
          updateStreamSegment(row.id, "segment", segInput.value);
        });

        const durInput = document.createElement("input");
        durInput.type = "number";
        durInput.min = "1";
        durInput.step = "1";
        durInput.inputMode = "numeric";
        durInput.value = row.duration || "";
        durInput.placeholder = "Duration";
        durInput.addEventListener("input", () => {
          const nextVal = String(durInput.value || "").replace(/[^\d]/g, "");
          if (durInput.value !== nextVal) durInput.value = nextVal;
          updateStreamSegment(row.id, "duration", nextVal);
        });

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "remove-segment-btn";
        removeBtn.textContent = "Remove";
        removeBtn.addEventListener("click", () => removeStreamSegment(row.id));

        grid.appendChild(handleBtn);
        grid.appendChild(segInput);
        grid.appendChild(durInput);
        grid.appendChild(removeBtn);
        item.appendChild(grid);
        wrap.appendChild(item);
      });
      updateStreamDurationTotal();
    }

    function selectedMembers() {
      return Array.from(document.querySelectorAll("input[name='memberPresent']:checked")).map(cb => cb.value);
    }

    function isGroupName(name) {
      const text = String(name || "").toLowerCase();
      return text.includes("boys") || text.includes("girls");
    }

    function renderGroupOptions(groupNames, fallbackNames) {
      const select = document.getElementById("groupSelect");
      const previous = select.value || "";
      const names = (groupNames && groupNames.length) ? groupNames : (fallbackNames || []);
      select.innerHTML = "";
      const empty = document.createElement("option");
      empty.value = "";
      empty.textContent = "(none)";
      select.appendChild(empty);
      names.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
      if (previous && names.includes(previous)) {
        select.value = previous;
      } else if (groupNames && groupNames.length) {
        select.value = groupNames[0];
      }
    }

    function renderMembers(names) {
      const wrap = document.getElementById("membersWrap");
      wrap.innerHTML = "";
      if (!names.length) {
        const empty = document.createElement("span");
        empty.textContent = "No dancers found.";
        empty.style.color = "#94a3b8";
        wrap.appendChild(empty);
        selectedMemberSet = new Set();
        return;
      }
      const next = new Set();
      names.forEach(name => {
        if (selectedMemberSet.has(name)) next.add(name);
      });
      selectedMemberSet = next;
      names.forEach(name => {
        const label = document.createElement("label");
        label.className = "member-item";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.name = "memberPresent";
        cb.value = name;
        cb.checked = selectedMemberSet.has(name);
        cb.addEventListener("change", () => {
          if (!selectedMemberSet) selectedMemberSet = new Set();
          if (cb.checked) selectedMemberSet.add(name);
          else selectedMemberSet.delete(name);
        });
        const text = document.createElement("span");
        text.textContent = name;
        label.appendChild(cb);
        label.appendChild(text);
        wrap.appendChild(label);
      });
    }

    function renderMvpOptions(names) {
      const select = document.getElementById("mvpSelect");
      if (!select) return;
      const previous = select.value || "";
      select.innerHTML = "";
      const empty = document.createElement("option");
      empty.value = "";
      empty.textContent = "(none)";
      select.appendChild(empty);
      (names || []).forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
      if (previous && (names || []).includes(previous)) {
        select.value = previous;
      }
    }

    function renderDancers() {
      const names = sortedNames(dancers);
      const groupNames = names.filter(isGroupName);
      const memberNames = names.filter(name => !isGroupName(name));
      renderGroupOptions(groupNames, names);
      renderMembers(memberNames);
      renderMvpOptions(memberNames);
    }

    async function refreshDancers() {
      try {
        const res = await api("/dancers");
        const data = await res.json();
        dancers = Array.isArray(data) ? data : [];
        renderDancers();
      } catch (e) {
        dancers = [];
        renderDancers();
      }
    }

    function setFormStatus(message, kind = "") {
      const el = document.getElementById("formStatus");
      el.textContent = message || "";
      el.className = "status-text";
      if (kind) el.classList.add(kind);
    }

    function setPastNotesStatus(message, kind = "") {
      const el = document.getElementById("pastNotesStatus");
      if (!el) return;
      el.textContent = message || "";
      el.className = "status-text";
      if (kind) el.classList.add(kind);
    }

    function formatPastNoteDate(note) {
      const iso = String(note?.iso_ts || "").trim();
      if (iso) {
        const dt = new Date(iso);
        if (Number.isFinite(dt.getTime())) return dt.toLocaleString();
      }
      const day = String(note?.stream_date || "").trim();
      return day || "(no date)";
    }

    function normalizeStreamFormatRows(raw) {
      let rows = [];
      if (Array.isArray(raw)) {
        rows = raw;
      } else if (raw && typeof raw === "object") {
        rows = [raw];
      } else if (typeof raw === "string") {
        const text = raw.trim();
        if (!text) return [];
        try {
          const parsed = JSON.parse(text);
          return normalizeStreamFormatRows(parsed);
        } catch (e) {}
        const jsonl = [];
        text.split(/\r?\n/).forEach(line => {
          const trimmed = String(line || "").trim();
          if (!trimmed) return;
          try {
            const obj = JSON.parse(trimmed);
            if (obj && typeof obj === "object") jsonl.push(obj);
          } catch (e) {}
        });
        rows = jsonl;
      }
      return rows
        .map((row) => {
          const segment = String(row?.segment ?? row?.name ?? "").trim();
          const durationRaw = row?.duration_min ?? row?.duration;
          const durationNum = Number.parseInt(String(durationRaw ?? "").trim(), 10);
          const durationMin = Number.isInteger(durationNum) && durationNum > 0 ? durationNum : null;
          return { segment, duration_min: durationMin };
        })
        .filter((row) => row.segment || row.duration_min != null);
    }

    function appendPastNoteField(container, label, value) {
      const text = String(value || "").trim();
      if (!text) return;
      const row = document.createElement("div");
      row.className = "past-note-field";
      const labelEl = document.createElement("span");
      labelEl.className = "past-note-label";
      labelEl.textContent = `${label}:`;
      const valueEl = document.createElement("span");
      valueEl.textContent = text;
      row.appendChild(labelEl);
      row.appendChild(valueEl);
      container.appendChild(row);
    }

    function buildPastNoteCard(note) {
      const card = document.createElement("div");
      card.className = "past-note-card";

      const group = String(note?.group_name || "").trim();
      const header = document.createElement("div");
      header.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:8px;";
      const title = document.createElement("div");
      title.className = "past-note-title";
      title.textContent = group ? `${formatPastNoteDate(note)} - ${group}` : formatPastNoteDate(note);
      header.appendChild(title);
      const noteId = String(note?.id ?? "").trim();
      if (noteId) {
        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "secondary";
        editBtn.textContent = "Edit";
        editBtn.addEventListener("click", () => beginEditNote(note));
        header.appendChild(editBtn);
      }
      card.appendChild(header);

      appendPastNoteField(card, "Host", note?.host);
      appendPastNoteField(card, "Group", note?.group_name);
      appendPastNoteField(card, "Outfit Theme", note?.outfit_theme);
      appendPastNoteField(card, "MVP", note?.mvp);

      const members = Array.isArray(note?.members_present)
        ? note.members_present.map((v) => String(v || "").trim()).filter(Boolean)
        : [];
      if (members.length) {
        appendPastNoteField(card, "Members Present", members.join(", "));
      }

      const formatRows = normalizeStreamFormatRows(note?.stream_format);
      if (formatRows.length) {
        const row = document.createElement("div");
        row.className = "past-note-field";
        const labelEl = document.createElement("span");
        labelEl.className = "past-note-label";
        labelEl.textContent = "Stream Format:";
        row.appendChild(labelEl);
        const list = document.createElement("ul");
        list.className = "past-note-format-list";
        formatRows.forEach((item) => {
          const li = document.createElement("li");
          const dur = item.duration_min != null ? `${item.duration_min} min` : "";
          li.textContent = item.segment && dur ? `${item.segment} (${dur})` : (item.segment || dur);
          list.appendChild(li);
        });
        row.appendChild(list);
        card.appendChild(row);
      }

      const notesText = String(note?.additional_notes || "").trim();
      if (notesText) {
        const row = document.createElement("div");
        row.className = "past-note-field";
        const labelEl = document.createElement("span");
        labelEl.className = "past-note-label";
        labelEl.textContent = "Additional Notes:";
        const pre = document.createElement("pre");
        pre.className = "past-note-pre";
        pre.textContent = notesText;
        row.appendChild(labelEl);
        row.appendChild(pre);
        card.appendChild(row);
      }

      return card;
    }

    function renderPastNotes() {
      const panel = document.getElementById("pastNotesPanel");
      const list = document.getElementById("pastNotesList");
      const loadMoreBtn = document.getElementById("loadMoreNotesBtn");
      if (!panel || !list || !loadMoreBtn) return;

      panel.hidden = !pastNotesVisible;
      if (!pastNotesVisible) return;

      list.innerHTML = "";
      if (!pastNotesItems.length && !pastNotesLoading) {
        const empty = document.createElement("div");
        empty.className = "past-note-card";
        empty.textContent = "No past notes yet.";
        list.appendChild(empty);
      } else {
        pastNotesItems.forEach((note) => {
          list.appendChild(buildPastNoteCard(note));
        });
      }

      loadMoreBtn.style.display = pastNotesHasMore ? "" : "none";
      loadMoreBtn.disabled = pastNotesLoading;
      loadMoreBtn.textContent = pastNotesLoading ? "Loading..." : "Load More";
    }

    async function loadPastNotes(reset = false) {
      if (pastNotesLoading) return;
      if (reset) {
        pastNotesOffset = 0;
        pastNotesHasMore = true;
        pastNotesItems = [];
      } else if (!pastNotesHasMore) {
        return;
      }

      pastNotesLoading = true;
      setPastNotesStatus("Loading...");
      renderPastNotes();

      try {
        const qs = new URLSearchParams({
          limit: String(NOTES_PAGE_SIZE),
          offset: String(pastNotesOffset),
        });
        const res = await api(`/notes/stream/history?${qs.toString()}`);
        let payload = {};
        try { payload = await res.json(); } catch (e) {}
        if (!res.ok || payload?.ok === false) {
          throw new Error(payload?.error || `Request failed (${res.status})`);
        }
        const rows = Array.isArray(payload?.notes) ? payload.notes : [];
        if (reset) pastNotesItems = rows;
        else pastNotesItems = pastNotesItems.concat(rows);
        const nextOffset = Number(payload?.next_offset);
        if (Number.isFinite(nextOffset) && nextOffset >= 0) {
          pastNotesOffset = Math.floor(nextOffset);
        } else {
          pastNotesOffset += rows.length;
        }
        pastNotesHasMore = Boolean(payload?.has_more);
        if (!pastNotesItems.length) {
          setPastNotesStatus("No past notes yet.");
        } else {
          setPastNotesStatus("");
        }
      } catch (e) {
        setPastNotesStatus(`Failed to load past notes: ${e}`, "error");
      } finally {
        pastNotesLoading = false;
        renderPastNotes();
      }
    }

    function wirePastNotes() {
      const toggleBtn = document.getElementById("togglePastNotesBtn");
      const loadMoreBtn = document.getElementById("loadMoreNotesBtn");
      if (!toggleBtn || !loadMoreBtn) return;

      toggleBtn.addEventListener("click", async () => {
        pastNotesVisible = !pastNotesVisible;
        toggleBtn.textContent = pastNotesVisible ? "Hide Past Notes" : "View Past Notes";
        if (pastNotesVisible && !pastNotesItems.length) {
          await loadPastNotes(true);
        } else {
          renderPastNotes();
        }
      });

      loadMoreBtn.addEventListener("click", async () => {
        await loadPastNotes(false);
      });

      renderPastNotes();
    }

    function populateStreamSegmentsFromNote(note) {
      const rows = normalizeStreamFormatRows(note?.stream_format);
      if (rows.length) {
        streamSegments = rows.map((row) => ({
          id: nextSegmentId++,
          segment: row.segment || "",
          duration: row.duration_min != null ? String(row.duration_min) : "",
        }));
      } else {
        loadStreamSegmentsFromCookie("");
      }
      renderStreamSegments();
    }

    function beginEditNote(note) {
      const noteId = String(note?.id ?? "").trim();
      if (!noteId) return;
      editingNoteId = noteId;

      document.getElementById("hostInput").value = String(note?.host || "");
      document.getElementById("streamDateInput").value = String(note?.stream_date || "");
      document.getElementById("outfitThemeInput").value = String(note?.outfit_theme || "");
      document.getElementById("additionalNotesInput").value = String(note?.additional_notes || "");

      const members = Array.isArray(note?.members_present)
        ? note.members_present.map((v) => String(v || "").trim()).filter(Boolean)
        : [];
      selectedMemberSet = new Set(members);
      renderDancers();

      // Set these after renderDancers(), which rebuilds both <select> option lists
      // and would otherwise clobber the values assigned here.
      const groupSelect = document.getElementById("groupSelect");
      const groupName = String(note?.group_name || "");
      if (groupSelect) {
        groupSelect.value = Array.from(groupSelect.options).some((opt) => opt.value === groupName) ? groupName : "";
      }

      const mvpSelect = document.getElementById("mvpSelect");
      const mvpName = String(note?.mvp || "");
      if (mvpSelect) {
        mvpSelect.value = Array.from(mvpSelect.options).some((opt) => opt.value === mvpName) ? mvpName : "";
      }

      populateStreamSegmentsFromNote(note);

      const submitBtn = document.getElementById("submitBtn");
      const cancelBtn = document.getElementById("cancelEditBtn");
      if (submitBtn) submitBtn.textContent = "Update Note";
      if (cancelBtn) cancelBtn.style.display = "";
      setFormStatus(`Editing note from ${formatPastNoteDate(note)}.`);

      document.getElementById("notesForm").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function cancelEditNote() {
      editingNoteId = null;
      const submitBtn = document.getElementById("submitBtn");
      const cancelBtn = document.getElementById("cancelEditBtn");
      if (submitBtn) submitBtn.textContent = "Submit";
      if (cancelBtn) cancelBtn.style.display = "none";
      setFormStatus("");

      document.getElementById("streamDateInput").value = todayYmd();
      document.getElementById("groupSelect").value = "";
      document.getElementById("outfitThemeInput").value = "";
      document.getElementById("mvpSelect").value = "";
      document.getElementById("additionalNotesInput").value = "";
      selectedMemberSet = new Set();
      renderDancers();
      loadStreamSegmentsFromCookie(getCookie(STREAM_FORMAT_COOKIE_KEY));
      renderStreamSegments();
    }

    async function submitForm(evt) {
      evt.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      const isEditing = !!editingNoteId;
      setFormStatus(isEditing ? "Updating..." : "Submitting...");
      const streamFormat = streamFormatJsonlValue();
      if (!streamFormat.ok) {
        setFormStatus(streamFormat.error || "Invalid stream format.", "error");
        submitBtn.disabled = false;
        return;
      }
      const body = {
        host: document.getElementById("hostInput").value.trim(),
        stream_date: document.getElementById("streamDateInput").value.trim(),
        group: document.getElementById("groupSelect").value.trim(),
        outfit_theme: document.getElementById("outfitThemeInput").value.trim(),
        mvp: document.getElementById("mvpSelect").value.trim(),
        members_present: selectedMembers(),
        stream_format: streamFormat.text,
        additional_notes: document.getElementById("additionalNotesInput").value.trim(),
      };
      if (isEditing) body.id = editingNoteId;
      setCookie(HOST_COOKIE_KEY, body.host);
      persistStreamSegmentsCookie();
      try {
        const endpoint = isEditing ? "/notes/stream/update" : "/notes/stream";
        const res = await api(endpoint, {method: "POST", body});
        let payload = {};
        try { payload = await res.json(); } catch (e) {}
        if (!res.ok || payload.ok === false) {
          const err = payload.error || `Request failed (${res.status})`;
          setFormStatus(err, "error");
          return;
        }
        if (isEditing) cancelEditNote();
        setFormStatus(isEditing ? "Updated stream note." : "Saved stream note.", "success");
        if (pastNotesVisible) {
          await loadPastNotes(true);
        }
      } catch (err) {
        setFormStatus(`Request failed: ${err}`, "error");
      } finally {
        submitBtn.disabled = false;
      }
    }

    function connectWs() {
      if (!window.PageShared?.connectWsStatus) return;
      const origin = (window.location && window.location.origin) ? window.location.origin : "";
      window.PageShared.connectWsStatus({
        wsUrl: origin ? (origin.replace(/^http/, "ws")) + "/ws/state" : undefined,
        connectedText: "Live",
        disconnectedText: "Disconnected",
        onState: (payload) => {
          if (Array.isArray(payload?.dancers)) {
            dancers = payload.dancers;
            renderDancers();
          }
        },
      });
    }

    document.getElementById("notesForm").addEventListener("submit", submitForm);
    document.getElementById("cancelEditBtn").addEventListener("click", cancelEditNote);
    restorePersistedDefaults();
    wirePersistedDefaults();
    wirePastNotes();
    window.PageShared.initPracticeModeHeader({apiFn: api});
    refreshDancers();
    connectWs();
    window.PageShared.initHotkeys(api);
  </script>
</body>
</html>
