# fly.toml app configuration file generated for newstarhost on 2026-01-20T18:30:46-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'newstarhost'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  APP_MEMORY_LIMIT_MB = '768'
  LISTENER_MEMORY_LIMIT_MB = '1024'
  DISCORD_MEMORY_LIMIT_MB = '768'

[[mounts]]
  source = 'media'
  destination = '/app/media'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '2gb'
  cpus = 2
  memory_mb = 2048
