<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Settings</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 16px 24px 16px; background: #1e293b; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 20px; }
    main { padding: 20px; }
    section { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.02); }
    h2 { margin-top: 0; font-size: 16px; }
    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    label { display: inline-flex; align-items: center; gap: 6px; }
    select, input { padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0b1222; color: #e2e8f0; }
    button { cursor: pointer; background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px 12px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    .table-wrap { width: 100%; overflow-x: auto; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #1f2937; }
    th { font-size: 12px; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.05em; }
    .status { font-weight: 600; color: #94a3b8; }
    .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      padding: 0;
      margin: 0;
      border: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #334155;
      transition: .2s;
      border-radius: 999px;
      border: 1px solid #475569;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 2px;
      top: 2px;
      background-color: #e2e8f0;
      transition: .2s;
      border-radius: 50%;
    }
    .switch input:checked + .slider { background-color: #22c55e; border-color: #16a34a; }
    .switch input:checked + .slider:before { transform: translateX(22px); }
    @media (max-width: 900px) {
      header { padding: 12px 12px 8px; }
      header .status { display: none !important; }
      h1 { font-size: 18px; }
      main { padding: 12px; }
      section { padding: 12px; }
      .row { gap: 8px; }
      .table-wrap table { min-width: 440px; }
      #hotkeyRows select, #hotkeyRows button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="wsDot" style="display:inline-flex;align-items:center;justify-content:center;width:10px;height:10px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444;"></span>
      <h1>Settings</h1>
    </div>
    <div class="status" style="display:flex;align-items:center;gap:6px;font-weight:700;text-transform:uppercase;">
      <span id="statusText">Connecting</span>
    </div>
  </header>
  <main>
    <section>
      <h2>Audio Fade</h2>
      <div class="row">
        <label><input type="checkbox" id="fadeInToggle"> Fade in 0.5s</label>
        <label><input type="checkbox" id="fadeOutToggle"> Fade out 0.5s</label>
      </div>
    </section>

    <section>
      <h2>Practice Mode</h2>
      <div class="row">
        <label class="switch">
          <input type="checkbox" id="practiceModeToggle">
          <span class="slider"></span>
        </label>
        <span>Enabled</span>
      </div>
      <div class="row">
        <span class="status">When enabled, song end rewinds the same song and leaves it paused.</span>
      </div>
    </section>

    <section>
      <h2>Bind Hotkeys</h2>
      <div class="row" style="margin-bottom:12px;">
        <span class="status">Map number keys to role SFX.</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Key</th><th>Role</th><th>Preview</th></tr>
          </thead>
          <tbody id="hotkeyRows"></tbody>
        </table>
      </div>
    </section>

    <div class="row">
      <button onclick="saveSettings()">Save Settings</button>
      <span id="saveStatusText" class="status"></span>
    </div>
  </main>

  <script src="/static/state_ws_helper.js"></script>
  <script src="/static/page_shared.js"></script>
  <script>
    const api = window.PageShared.api;
    const ROLE_OPTIONS = ["", "bell", "applause", "attention", "background", "win", "mvp", "closing"];
    const DIGITS = ["1","2","3","4","5","6","7","8","9","0"];
    let settings = { fade_in: true, fade_out: true, loop_same_song_after_finish: false, hotkeys: {} };
    let hotkeyMap = {};

    function getRoleUrl(role) {
      const entry = Object.values(songsLibrary || {}).find(s => (s.roles || []).includes(role));
      return entry?.url || "";
    }

    function playRole(role) {
      const url = getRoleUrl(role);
      if (!url) return;
      if (window.top && window.top !== window) {
        window.top.postMessage({type:"play-audio", url}, "*");
      } else {
        const audio = new Audio(url);
        audio.play().catch(()=>{});
      }
    }

    function handleHotkey(evt) {
      if (evt.defaultPrevented) return;
      if (evt.metaKey || evt.ctrlKey || evt.altKey) return;
      if (window.PageShared.isTypingTarget(evt.target)) return;
      const key = evt.key;
      if (!/^\d$/.test(key)) return;
      const role = hotkeyMap[key];
      if (!role) return;
      evt.preventDefault();
      playRole(role);
    }

    let songsLibrary = {};

    async function loadLibrary() {
      try {
        const res = await api("/songs");
        const data = await res.json();
        songsLibrary = data?.library || {};
      } catch (e) {}
    }

    function renderHotkeys() {
      const tbody = document.getElementById("hotkeyRows");
      tbody.innerHTML = "";
      DIGITS.forEach(key => {
        const tr = document.createElement("tr");
        const tdKey = document.createElement("td");
        tdKey.textContent = key;
        const tdSelect = document.createElement("td");
        const sel = document.createElement("select");
        sel.dataset.key = key;
        ROLE_OPTIONS.forEach(role => {
          const opt = document.createElement("option");
          opt.value = role;
          opt.textContent = role ? role : "(none)";
          sel.appendChild(opt);
        });
        sel.value = settings.hotkeys?.[key] || "";
        tdSelect.appendChild(sel);
        const tdPreview = document.createElement("td");
        const btn = document.createElement("button");
        btn.textContent = "Preview";
        btn.onclick = () => {
          const role = sel.value;
          if (role) playRole(role);
        };
        tdPreview.appendChild(btn);
        tr.appendChild(tdKey);
        tr.appendChild(tdSelect);
        tr.appendChild(tdPreview);
        tbody.appendChild(tr);
      });
    }

    async function loadSettings() {
      settings = await window.PageShared.fetchAppSettings(api);
      hotkeyMap = settings.hotkeys || {};
      window.PageShared.setPracticeModeHeader(settings.loop_same_song_after_finish === true);
      const fadeIn = document.getElementById("fadeInToggle");
      const fadeOut = document.getElementById("fadeOutToggle");
      const practiceMode = document.getElementById("practiceModeToggle");
      if (fadeIn) fadeIn.checked = !!settings.fade_in;
      if (fadeOut) fadeOut.checked = !!settings.fade_out;
      if (practiceMode) practiceMode.checked = !!settings.loop_same_song_after_finish;
      renderHotkeys();
    }

    async function saveSettings() {
      const fadeIn = document.getElementById("fadeInToggle")?.checked ?? true;
      const fadeOut = document.getElementById("fadeOutToggle")?.checked ?? true;
      const practiceMode = document.getElementById("practiceModeToggle")?.checked === true;
      const hotkeys = {};
      document.querySelectorAll("#hotkeyRows select").forEach(sel => {
        const key = sel.dataset.key;
        const role = sel.value;
        if (key && role) hotkeys[key] = role;
      });
      const payload = {
        fade_in: fadeIn,
        fade_out: fadeOut,
        loop_same_song_after_finish: practiceMode,
        hotkeys,
      };
      const status = document.getElementById("saveStatusText");
      if (status) status.textContent = "Saving...";
      try {
        const res = await api("/settings/data", {method:"POST", body: payload});
        await res.json();
        window.PageShared.writePracticeModeLocal(practiceMode);
        if (status) status.textContent = "Saved";
        if (window.top && window.top !== window) {
          window.top.postMessage({type:"settings-updated"}, "*");
        }
        setTimeout(() => {
          window.location.reload();
        }, 200);
      } catch (e) {
        if (status) status.textContent = "Save failed";
      }
    }

    window.PageShared?.connectWsStatus?.({
      connectedText: "Live",
      disconnectedText: "Disconnected",
    });
    window.PageShared.initPracticeModeHeader({apiFn: api});
    loadLibrary();
    loadSettings();
    document.addEventListener("keydown", handleHotkey);
  </script>
</body>
</html>
