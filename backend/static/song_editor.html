<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Song Editor</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 16px 24px 16px; background: #1e293b; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 20px; }
    main { padding: 20px; }
    section { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.02); }
    h2 { margin-top: 0; font-size: 16px; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    .roles-wrap { flex-wrap: wrap; gap: 12px; align-items: center; }
    .check-opt { display: inline-flex; align-items: center; gap: 6px; line-height: 1.15; }
    select, input:not([type="checkbox"]) { padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0b1222; color: #e2e8f0; flex: 1; }
    input[type="checkbox"] { flex: 0 0 auto; width: 16px; height: 16px; padding: 0; margin: 0; accent-color: #2563eb; }
    button { cursor: pointer; background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px 12px; font-weight: 600; }
    @media (max-width: 900px) {
      header { padding: 12px 12px 8px; }
      header .status { display: none !important; }
      h1 { font-size: 18px; }
      main { padding: 12px; }
      section { padding: 12px; }
      .row { flex-wrap: wrap; }
      .row > * { flex: 1 1 220px; }
      .roles-wrap { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
      .roles-wrap > * { flex: 0 0 auto !important; }
      .roles-wrap .check-opt { width: auto; min-width: 0; margin: 0; padding: 0; }
      #volumeValue { min-width: 0 !important; text-align: left !important; }
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="wsDot" style="display:inline-flex;align-items:center;justify-content:center;width:10px;height:10px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444;"></span>
      <h1>Song Editor</h1>
    </div>
    <div class="status" style="display:flex;align-items:center;gap:6px;font-weight:700;text-transform:uppercase;">
      <span id="statusText">Connecting</span>
    </div>
  </header>
  <main>
    <section>
      <h2>Select Song</h2>
      <div class="row">
        <input id="songSearch" placeholder="Search song name or dancer" style="flex:1;" oninput="renderSongsList()">
        <select id="songList" style="flex:2;" onchange="loadSong()"></select>
        <button class="secondary" onclick="loadSongs()">Refresh</button>
        <button onclick="playSelected()">Play</button>
      </div>
      <div class="row">
        <input id="renameInput" placeholder="Rename song" style="flex:2;">
        <button onclick="renameSong()">Rename</button>
      </div>
      <div class="row">
        <label style="min-width:140px;">Volume</label>
        <input id="volumeInput" type="range" min="0" max="200" step="1" value="100" oninput="onVolumeInput()" onchange="onVolumeChange()" style="flex:2;">
        <span id="volumeValue" style="min-width:64px;text-align:right;">100</span>
      </div>
    </section>
  <section>
    <h2>Roles</h2>
    <div class="row roles-wrap" id="rolesContainer"></div>
  </section>
  <section>
    <h2>Edit Dancers</h2>
    <div class="row">
      <label style="width:100%;">Add dancer</label>
    </div>
    <div class="row">
      <input id="dancerSearch" list="dancerSuggestions" placeholder="Search dancer name" style="flex:1;">
      <datalist id="dancerSuggestions"></datalist>
      <button onclick="addTo('dancers')">Add</button>
    </div>
    <div id="dancersList"></div>

    <div class="row" style="margin-top:10px;">
      <label style="width:100%;">Add front dancer</label>
    </div>
    <div class="row">
      <input id="frontSearch" list="frontSuggestions" placeholder="Search dancer name" style="flex:1;">
      <datalist id="frontSuggestions"></datalist>
      <button onclick="addTo('front_dancers')">Add</button>
    </div>
    <div id="frontList"></div>

    <div class="row" style="margin-top:10px;">
      <label style="width:100%;">Add who knows this song</label>
    </div>
    <div class="row">
      <input id="knowsSearch" list="knowsSuggestions" placeholder="Search dancer name" style="flex:1;">
      <datalist id="knowsSuggestions"></datalist>
      <button onclick="addTo('knows_song')">Add</button>
    </div>
    <div id="knowsList"></div>

    <div class="row" style="margin-top:10px;">
      <label style="width:100%;">Exclusive MVP for (one dancer max)</label>
    </div>
    <div class="row">
      <select id="exclusiveMvpSelect" style="flex:1;" onchange="exclusiveMvpFor=this.value; save();"></select>
    </div>

    <div class="row" style="margin-top:10px;">
      <label style="width:100%;">Difficulty</label>
    </div>
    <div class="row">
      <select id="difficultySelect" style="flex:1;" onchange="difficultyValue=this.value; save();">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>

    <div class="row" style="margin-top:10px;">
      <button class="danger" onclick="removeSong()">Delete Song</button>
    </div>
  </section>
  </main>

  <script src="/static/state_ws_helper.js"></script>
  <script src="/static/page_shared.js"></script>
  <script>
  const api = (p,o={})=>fetch(p,{method:o.method||"GET",headers:{"Content-Type":"application/json"},body:o.body?JSON.stringify(o.body):undefined});
  let songs = {};
  let dancers = [];
  let currentSongId = "";
  let dancersAssigned = [];
  let frontsAssigned = [];
  let mvpsAssigned = [];
  let rolesAssigned = [];
  let knowsAssigned = [];
  let exclusiveMvpFor = "";
  let cameraDance = false;
  let volumeValue = 100;
  let difficultyValue = "medium";
  let volumeSaveInFlight = false;
  let volumeQueued = null;
  const ROLE_OPTIONS = ["bell","applause","mvp","attention","background","win","closing"];

    function renderSongsList() {
      const list = document.getElementById("songList");
      const search = (document.getElementById("songSearch").value || "").toLowerCase();
      list.innerHTML = "";
      const noneOpt = document.createElement("option");
      noneOpt.value = "";
      noneOpt.textContent = "None";
      list.appendChild(noneOpt);
      Object.keys(songs).forEach(id => {
        const song = songs[id] || {};
        const name = song.name || id;
        const dancersStr = (song.dancers || []).join(" ").toLowerCase() + " " + (song.front_dancers || []).join(" ").toLowerCase();
        if (search && !name.toLowerCase().includes(search) && !dancersStr.includes(search)) return;
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = name;
        list.appendChild(opt);
      });
      if (currentSongId) {
        const idx = Array.from(list.options).findIndex(o => o.value === currentSongId);
        list.selectedIndex = idx >= 0 ? idx : 0;
      } else if (search && list.options.length > 1) {
        // If filtering, auto-select first matching song (skip "None")
        list.selectedIndex = 1;
      } else {
        list.selectedIndex = 0;
      }
      if (list.value) {
        loadSong();
      } else {
        loadSong();
      }
    }

    function loadSongs() {
      api("/songs").then(r=>r.json()).then(s => {
        songs = s.library || {};
        renderSongsList();
      });
    }

    function loadSong() {
      const list = document.getElementById("songList");
      const id = list.value;
      if (!id) {
        currentSongId = "";
        dancersAssigned = [];
        frontsAssigned = [];
        mvpsAssigned = [];
      rolesAssigned = [];
      knowsAssigned = [];
      exclusiveMvpFor = "";
      cameraDance = false;
      volumeValue = 100;
      difficultyValue = "medium";
      document.getElementById("renameInput").value = "";
      const cameraToggle = document.getElementById("cameraDanceToggle");
      if (cameraToggle) cameraToggle.checked = false;
        setVolumeUi(volumeValue);
        const diffSel = document.getElementById("difficultySelect");
        if (diffSel) diffSel.value = difficultyValue;
        renderLists();
        renderPreview();
        renderRoles();
        return;
      }
      currentSongId = id;
      const song = songs[id] || {};
      dancersAssigned = [...(song.dancers || [])];
      frontsAssigned = [...(song.front_dancers || [])];
      mvpsAssigned = [...(song.mvp_dancers || [])];
      rolesAssigned = [...(song.roles || [])];
      knowsAssigned = [...(song.knows_song || [])];
      exclusiveMvpFor = song.exclusive_mvp_for || "";
      cameraDance = !!song.camera_dance;
      volumeValue = parseFloat(song.volume);
      if (!Number.isFinite(volumeValue)) volumeValue = 100;
      if (volumeValue <= 1) volumeValue = Math.round(volumeValue * 200);
      difficultyValue = song.difficulty || "medium";
      document.getElementById("renameInput").value = song.name || id || "";
      setVolumeUi(volumeValue);
      const exSel = document.getElementById("exclusiveMvpSelect");
      if (exSel) exSel.value = exclusiveMvpFor || "";
      const diffSel = document.getElementById("difficultySelect");
      if (diffSel) diffSel.value = difficultyValue;
      const cameraToggle = document.getElementById("cameraDanceToggle");
      if (cameraToggle) cameraToggle.checked = cameraDance;
      renderLists();
      renderPreview();
      renderRoles();
    }

  function save() {
      const btns = document.querySelectorAll("button");
      btns.forEach(b=>b.disabled=true);
      if (!currentSongId) { btns.forEach(b=>b.disabled=false); return; }
      const newName = document.getElementById("renameInput").value.trim();
      const volume = getVolumeValue();
      const difficulty = document.getElementById("difficultySelect")?.value || "medium";
      const cameraToggle = document.getElementById("cameraDanceToggle");
      cameraDance = !!cameraToggle?.checked;
      const doRename = newName && (!songs[currentSongId] || songs[currentSongId].name !== newName);
      const renamePromise = doRename
        ? api("/songs/rename", {method:"POST", body:{song_id: currentSongId, name: newName}}).then(r=>r.json())
        : Promise.resolve(null);
      renamePromise
        .then(state => {
          if (state && state.library) {
            songs = state.library;
          }
          return api("/songs/update_dancers", {method:"POST", body:{song_id: currentSongId, dancers: dancersAssigned, front_dancers: frontsAssigned, mvp_dancers: mvpsAssigned, roles: rolesAssigned, knows_song: knowsAssigned, exclusive_mvp_for: exclusiveMvpFor, volume, difficulty, camera_dance: cameraDance}});
        })
        .then(()=>loadSongs())
        .finally(()=>btns.forEach(b=>b.disabled=false));
    }

    function renameSong() {
      if (!currentSongId) return;
      const newName = document.getElementById("renameInput").value.trim();
      if (!newName) return;
      api("/songs/rename", {method:"POST", body:{song_id: currentSongId, name: newName}})
        .then(r=>r.json())
        .then(state => {
          if (state && state.library) songs = state.library;
          renderSongsList();
        });
    }

    function removeSong() {
      if (!currentSongId) return;
      if (!confirm("Are you sure you want to delete this song?")) return;
      const btns = document.querySelectorAll("button");
      btns.forEach(b=>b.disabled=true);
      api("/songs/delete", {method:"POST", body:{song_id: currentSongId}})
        .then(()=>{currentSongId=""; dancersAssigned=[]; frontsAssigned=[]; mvpsAssigned=[]; renderLists(); loadSongs();})
        .finally(()=>btns.forEach(b=>b.disabled=false));
    }

  function renderPreview() {
    // Preview removed; no-op to keep compatibility
  }

  function getAudioPlayer() {
    if (window.top && window.top !== window) {
      const gp = window.top.document.getElementById("globalPlayer");
      if (gp) return gp;
    }
    if (!window._sharedAudio) window._sharedAudio = new Audio();
    return window._sharedAudio;
  }

  function playSelected() {
    const id = document.getElementById("songList").value;
    if (!id) return;
    const song = songs[id] || {};
    if (!song.url) return;
    const audio = getAudioPlayer();
    audio.src = song.url;
    audio.volume = volumeToScalar(song.volume);
    audio.loop = false;
    audio.play().catch(()=>{});
  }

  function volumeToScalar(val) {
    let v = parseFloat(val);
    if (!Number.isFinite(v)) return 1;
    if (v <= 1) return Math.max(0, Math.min(1, v));
    return Math.max(0, Math.min(1, v / 200));
  }

  function getVolumeValue() {
    const input = document.getElementById("volumeInput");
    if (!input) return 100;
    let val = parseFloat(input.value);
    if (!Number.isFinite(val)) val = 100;
    return Math.max(0, Math.min(200, Math.round(val)));
  }

  function setVolumeUi(val) {
    const v = Math.max(0, Math.min(200, Math.round(val)));
    const input = document.getElementById("volumeInput");
    const label = document.getElementById("volumeValue");
    if (input) input.value = String(v);
    if (label) label.textContent = String(v);
  }

  function onVolumeInput() {
    const v = getVolumeValue();
    setVolumeUi(v);
    volumeValue = v;
    updateLocalVolume(v);
    queueVolumeSave(v);
  }

  function onVolumeChange() {
    volumeValue = getVolumeValue();
    setVolumeUi(volumeValue);
    updateLocalVolume(volumeValue);
    queueVolumeSave(volumeValue);
  }

  function queueVolumeSave(volume) {
    if (!currentSongId) return;
    volumeQueued = volume;
    if (!volumeSaveInFlight) flushVolumeSave();
  }

  function flushVolumeSave() {
    if (!currentSongId || volumeQueued === null) return;
    const volume = volumeQueued;
    volumeQueued = null;
    volumeSaveInFlight = true;
    api("/songs/update_dancers", {method:"POST", body:{
      song_id: currentSongId,
      dancers: dancersAssigned,
      front_dancers: frontsAssigned,
      mvp_dancers: mvpsAssigned,
      roles: rolesAssigned,
      knows_song: knowsAssigned,
      exclusive_mvp_for: exclusiveMvpFor,
      difficulty: difficultyValue || "medium",
      volume,
    }}).then(r=>r.json()).then(state => {
      if (state && state.songs && state.songs.library) {
        songs = state.songs.library;
      }
    }).catch(()=>{}).finally(() => {
      volumeSaveInFlight = false;
      if (volumeQueued !== null) flushVolumeSave();
    });
  }

  function updateLocalVolume(volume) {
    if (currentSongId && songs[currentSongId]) {
      songs[currentSongId].volume = volume;
    }
  }

    function loadDancers() {
      api("/dancers").then(r=>r.json()).then(d => {
        dancers = d || [];
        loadSongs();
      });
    }

    function addTo(field) {
      const inputId = field === "dancers" ? "dancerSearch" : field === "front_dancers" ? "frontSearch" : "knowsSearch";
      const val = document.getElementById(inputId).value.trim();
      if (!val) return;
      if (field === "dancers" && !dancersAssigned.includes(val)) dancersAssigned.push(val);
      if (field === "front_dancers" && !frontsAssigned.includes(val)) frontsAssigned.push(val);
      if (field === "knows_song" && !knowsAssigned.includes(val)) knowsAssigned.push(val);
      renderLists();
      save();
    }

    function removeFrom(field, name) {
      if (field === "dancers") dancersAssigned = dancersAssigned.filter(x=>x!==name);
      if (field === "front_dancers") frontsAssigned = frontsAssigned.filter(x=>x!==name);
      if (field === "knows_song") knowsAssigned = knowsAssigned.filter(x=>x!==name);
      renderLists();
      save();
    }

    function renderLists() {
      populateList("dancersList", dancersAssigned, "dancers");
      populateList("frontList", frontsAssigned, "front_dancers");
      populateList("knowsList", knowsAssigned, "knows_song");
      populateSuggestions();
      renderRoles();
      renderExclusive();
    }

    function renderRoles() {
      const c = document.getElementById("rolesContainer");
      c.innerHTML = "";
      ROLE_OPTIONS.forEach(role => {
        const wrap = document.createElement("label");
        wrap.className = "check-opt";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = rolesAssigned.includes(role);
        cb.onchange = () => toggleRole(role, cb.checked);
        const span = document.createElement("span");
        span.textContent = role;
        wrap.appendChild(cb);
        wrap.appendChild(span);
        c.appendChild(wrap);
      });
      const camWrap = document.createElement("label");
      camWrap.className = "check-opt";
      const camCb = document.createElement("input");
      camCb.type = "checkbox";
      camCb.id = "cameraDanceToggle";
      camCb.checked = !!cameraDance;
      camCb.onchange = () => {
        cameraDance = !!camCb.checked;
        save();
      };
      const camSpan = document.createElement("span");
      camSpan.textContent = "moving camera";
      camWrap.appendChild(camCb);
      camWrap.appendChild(camSpan);
      c.appendChild(camWrap);
    }

    function toggleRole(role, checked) {
      const set = new Set(rolesAssigned);
      if (checked) set.add(role); else set.delete(role);
      rolesAssigned = Array.from(set);
      save();
    }

    function populateList(containerId, arr, field) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      arr.forEach(name => {
        const div = document.createElement("div");
        div.className = "row";
        div.innerHTML = `<span>${name}</span><button onclick="removeFrom('${field}','${name}')">Remove</button>`;
        container.appendChild(div);
      });
    }

    function populateSuggestions() {
      ["dancerSuggestions","frontSuggestions","knowsSuggestions"].forEach(id=>{
        const dl = document.getElementById(id);
        dl.innerHTML = "";
        dancers.forEach(d=>{
          const opt = document.createElement("option");
          opt.value = d.name;
          opt.label = `${d.name} (${d.handle})`;
          dl.appendChild(opt);
        });
      });
    }

    function renderExclusive() {
      const sel = document.getElementById("exclusiveMvpSelect");
      if (!sel) return;
      sel.innerHTML = "";
      const blank = document.createElement("option");
      blank.value = "";
      blank.textContent = "(none)";
      sel.appendChild(blank);
      dancers.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d.name;
        opt.textContent = d.name;
        sel.appendChild(opt);
      });
      sel.value = exclusiveMvpFor || "";
    }

    function highlightNav() {
      let here = location.pathname.replace(/\/+$/,"");
      if (!here) here = "/";
      const links = Array.from(document.querySelectorAll(".nav-bar a"));
      let best = null;
      links.forEach(a => {
        let link = (a.getAttribute("href") || "").replace(/\/+$/,"");
        if (!link) link = "/";
        if (here === link || here.startsWith(link)) {
          if (!best || link.length > best.href.length) best = {el:a, href:link};
        }
      });
      links.forEach(a => a.classList.remove("active"));
      if (best) best.el.classList.add("active");
    }

    window.PageShared?.connectWsStatus?.({
      connectedText: "Live",
      disconnectedText: "Disconnected",
    });
    window.PageShared.initPracticeModeHeader({apiFn: api});
    loadDancers();
    highlightNav();
  </script>
</body>
</html>
