<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Group Dances</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 16px 24px 16px; background: #1e293b; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 20px; }
    main { padding: 20px; display: grid; gap: 16px; }
    section { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.02); }
    h2 { margin: 0 0 10px 0; font-size: 16px; letter-spacing: 0.02em; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    button { cursor: pointer; background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px 12px; font-weight: 600; }
    select, input { padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0b1222; color: #e2e8f0; flex: 1; width: 100%; box-sizing: border-box; }
    .filter-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; width: 100%; }
    .filter-pair .field { min-width: 0; }
    .songs { display: flex; gap: 8px; flex-wrap: wrap; }
    .card { position: relative; background: #0b1222; border: 1px solid #1f2937; border-radius: 8px; padding: 10px; width: 220px; min-height: 90px; display: flex; flex-direction: column; }
    .corner-flags { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; align-items: center; }
    .corner-flag { width: 18px; height: 18px; opacity: 0.92; object-fit: contain; }
    .card h3 { margin: 0 0 6px 0; font-size: 14px; word-break: break-word; }
    .card .duration { color: #94a3b8; font-weight: 600; }
    .card div { word-break: break-word; }
    .card button { margin-top: 6px; }
    .card button:first-of-type { margin-top: auto; }
    .formation-wrap { display: grid; grid-template-columns: 1fr 260px; gap: 12px; align-items: start; }
    .formation-canvas { background:#0b1222; border:1px solid #1f2937; border-radius:8px; }
    .formation-list { font-size: 13px; line-height: 1.5; }
    .formation-enabled { display:flex; flex-wrap:wrap; gap:10px 14px; }
    .bg-timer-box {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 40;
      min-width: 136px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: rgba(11, 18, 34, 0.94);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      cursor: grab;
      user-select: none;
      touch-action: none;
      display: none;
    }
    .bg-timer-box.dragging { cursor: grabbing; }
    .bg-timer-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.04em; }
    .bg-timer-value { margin-top: 2px; font-size: 20px; font-weight: 800; color: #e2e8f0; font-variant-numeric: tabular-nums; }
    @media (max-width: 900px) {
      header { padding: 12px 12px 0px; flex-direction: column; align-items: flex-start; gap: 8px; }
      h1 { font-size: 18px; }
      #statusText { display: none; }
      main { padding: 12px !important; gap: 12px; }
      section { padding: 12px; }
      .row { flex-wrap: wrap; }
      .row > * { flex: 1 1 220px; }
      .filter-pair { grid-template-columns: 1fr; }
      .card { width: 100%; }
      .formation-wrap { grid-template-columns: 1fr; }
      #formationCanvas { width: 100%; max-width: 360px; height: auto; }
      .bg-timer-box { left: 12px; bottom: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="wsDot" style="display:inline-flex;align-items:center;justify-content:center;width:10px;height:10px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444;"></span>
      <h1>Group Dances Control</h1>
    </div>
    <div class="status" style="display:flex;align-items:center;gap:6px;font-weight:700;text-transform:uppercase;">
      <span id="statusText">Connecting</span>
    </div>
  </header>
  <div id="backgroundTimerBox" class="bg-timer-box" aria-live="polite">
    <div class="bg-timer-label">Background Timer</div>
    <div id="backgroundTimerValue" class="bg-timer-value">00:00</div>
  </div>
  <main>
  <section>
    <h2>Select Front Dancer</h2>
    <div class="filter-pair">
      <div class="field">
        <label for="frontSelect" style="display:block;margin-bottom:6px;">Front Dancer</label>
        <select id="frontSelect" onchange="renderSongs()"></select>
      </div>
      <div class="field">
        <label for="groupSelect" style="display:block;margin-bottom:6px;">Group</label>
        <select id="groupSelect" onchange="renderSongs()"></select>
      </div>
    </div>
  </section>

  <section>
    <h2>Group Songs</h2>
    <div class="row">
      <input id="songSearch" placeholder="Search song or artist" oninput="renderSongs()">
    </div>
    <div id="songsContainer" class="songs"></div>
  </section>

  <section>
    <h2>Formations</h2>
    <div class="formation-wrap">
      <div>
        <div id="formationTitle" style="font-weight:700;margin-bottom:8px;">Select a song to view formation</div>
        <div id="formationEnabled" class="formation-enabled" style="margin-bottom:8px;"></div>
        <div id="formationList" class="formation-list"></div>
      </div>
      <canvas id="formationCanvas" class="formation-canvas" width="240" height="200"></canvas>
    </div>
  </section>


  </main>

  <script src="/static/state_ws_helper.js"></script>
  <script src="/static/page_shared.js"></script>
  <script>
    const api = window.PageShared.api;
    let library = {};
    let songsState = {};
    let state = {};
    let currentTab = "group";
    let currentUrl = "";
    let backgroundStarted = false;
    let playCounts = loadPlayCounts();
    let lastSongUrl = loadLastSong();
    let formationEnabledMap = {};
    let lastFormationSong = null;
    let hotkeyMap = {};
    let settingsFadeIn = true;
    let settingsFadeOut = true;
    let settingsLoopSameSongAfterFinish = false;
    let settingsDisplayBackgroundTimer = false;
    let backgroundTimerTickHandle = null;
    const PRACTICE_ROLE = "practice_song";

    function normalizeRoleToken(role) {
      return String(role || "").trim().toLowerCase().replace(/\s+/g, "_");
    }

    function isPracticeSong(song) {
      return (song?.roles || []).some((r) => normalizeRoleToken(r) === PRACTICE_ROLE);
    }

    function shouldDisplayForPracticeMode(song) {
      return !isPracticeSong(song) || settingsLoopSameSongAfterFinish;
    }

    async function loadSettings() {
      const data = await window.PageShared.fetchAppSettings(api);
      settingsFadeIn = data.fade_in !== false;
      settingsFadeOut = data.fade_out !== false;
      settingsLoopSameSongAfterFinish = data.loop_same_song_after_finish === true;
      settingsDisplayBackgroundTimer = data.display_background_timer === true;
      hotkeyMap = data.hotkeys || {};
      window.PageShared.setPracticeModeHeader(settingsLoopSameSongAfterFinish);
      renderSongs();
      updateBackgroundTimerOverlay();
    }

    function handleHotkey(evt) {
      if (evt.defaultPrevented) return;
      if (evt.metaKey || evt.ctrlKey || evt.altKey) return;
      if (window.PageShared.isTypingTarget(evt.target)) return;
      const key = evt.key;
      if (!/^\d$/.test(key)) return;
      const role = hotkeyMap[key];
      if (!role) return;
      evt.preventDefault();
      playRoleHotkey(role);
    }

    async function refreshData() {
      const songs = await api("/songs").then(r=>r.json());
      songsState = songs || {};
      library = songs.library || {};
      renderFronts();
      renderGroups();
      renderSongs();
      ensureBackground();
    }

    function renderFronts() {
      const sel = document.getElementById("frontSelect");
      if (!sel) return;
      const fronts = new Set();
      Object.values(library).forEach(s => (s.front_dancers||[]).forEach(f => fronts.add(f)));
      sel.innerHTML = "";
      const any = document.createElement("option");
      any.value = "";
      any.textContent = "All fronts";
      sel.appendChild(any);
      Array.from(fronts).sort((a,b)=>a.localeCompare(b)).forEach(f => {
        const opt = document.createElement("option");
        opt.value = f;
        opt.textContent = f;
        sel.appendChild(opt);
      });
    }

    function renderGroups() {
      const sel = document.getElementById("groupSelect");
      if (!sel) return;
      const current = (sel.value || "").toLowerCase();
      const stateGroup = (state.group_name || "").trim();
      const groups = new Set();
      Object.values(library).forEach(s => {
        const all = [...(s.dancers||[]), ...(s.front_dancers||[]), ...(s.knows_song||[])];
        all.forEach(name => {
          const text = String(name || "").trim();
          const low = text.toLowerCase();
          if (text && (low.includes("boys") || low.includes("girls"))) groups.add(text);
        });
      });
      if (stateGroup) {
        const low = stateGroup.toLowerCase();
        if (low.includes("boys") || low.includes("girls")) groups.add(stateGroup);
      }
      sel.innerHTML = "";
      Array.from(groups).sort((a,b)=>a.localeCompare(b)).forEach(groupName => {
        const opt = document.createElement("option");
        opt.value = groupName;
        opt.textContent = groupName;
        sel.appendChild(opt);
      });
      if (current && Array.from(sel.options).some(o => o.value.toLowerCase() === current)) {
        const match = Array.from(sel.options).find(o => o.value.toLowerCase() === current);
        if (match) sel.value = match.value;
        return;
      }
      if (stateGroup && Array.from(sel.options).some(o => o.value.toLowerCase() === stateGroup.toLowerCase())) {
        const match = Array.from(sel.options).find(o => o.value.toLowerCase() === stateGroup.toLowerCase());
        if (match) sel.value = match.value;
        return;
      }
      if (sel.options.length) {
        sel.selectedIndex = 0;
      } else {
        sel.value = "";
      }
    }

    function renderSongs() {
      const container = document.getElementById("songsContainer");
      if (container) {
        container.innerHTML = "";
        const selectedFront = (document.getElementById("frontSelect")?.value || "").toLowerCase();
        const selectedGroup = (document.getElementById("groupSelect")?.value || "").toLowerCase().trim();
        const songSearch = (document.getElementById("songSearch")?.value || "").toLowerCase().trim();
        const durationLabel = (song) => {
          const d = parseInt(song.duration_sec, 10);
          return Number.isFinite(d) && d > 0 ? ` <span class="duration">(${d}s)</span>` : "";
        };
        Object.values(library)
          .filter(shouldDisplayForPracticeMode)
          .filter(s => {
            if (!songSearch) return true;
            const name = (s.name || "").toLowerCase();
            const artist = (s.artist || "").toLowerCase();
            return name.includes(songSearch) || artist.includes(songSearch);
          })
          .filter(s => {
            if (!selectedFront) return true;
            return (s.front_dancers||[]).map(x=>x.toLowerCase()).includes(selectedFront);
          })
          .filter(s => {
            const all = [...(s.dancers||[]), ...(s.front_dancers||[]), ...(s.knows_song||[])];
            const songGroups = all
              .map(n => String(n || "").trim())
              .filter(n => {
                const low = n.toLowerCase();
                return low.includes("boys") || low.includes("girls");
              });
            if (!songGroups.length) return false;
            if (!selectedGroup) return true;
            return songGroups.some(n => n.toLowerCase() === selectedGroup);
          })
          .sort((a,b)=> (a.name||"").localeCompare(b.name||""))
          .forEach(song => {
            const card = document.createElement("div");
            card.className = "card";
            const frontList = (song.front_dancers || []).filter(Boolean);
            const artistLine = song.artist ? `Artist: ${song.artist}` : "";
            const frontLine = frontList.length ? `Front: ${frontList[0]}` : "";
            const details = [artistLine, frontLine].filter(Boolean).join("<br>");
            card.innerHTML = `<h3>${song.name||"Unnamed"}${durationLabel(song)}</h3>${details ? `<div>${details}</div>` : ""}`;
            const hasClosingRole = (song.roles || []).some(r => String(r || "").toLowerCase() === "closing");
            const hasPracticeRole = isPracticeSong(song);
            if (song.camera_dance || hasClosingRole || hasPracticeRole) {
              const flags = document.createElement("div");
              flags.className = "corner-flags";
              if (song.camera_dance) {
                const cam = document.createElement("img");
                cam.src = "/media/video-camera.svg";
                cam.alt = "Camera dance";
                cam.className = "corner-flag";
                flags.appendChild(cam);
              }
              if (hasClosingRole) {
                const closing = document.createElement("img");
                closing.src = "/media/closing.svg";
                closing.alt = "Closing dance";
                closing.className = "corner-flag";
                flags.appendChild(closing);
              }
              if (hasPracticeRole) {
                const practice = document.createElement("img");
                practice.src = "/media/practice-song.svg";
                practice.alt = "Practice song";
                practice.className = "corner-flag";
                flags.appendChild(practice);
              }
              card.appendChild(flags);
            }
            const playBtn = document.createElement("button");
            playBtn.textContent = "Play Song";
            playBtn.onclick = () => playSongWithUrl(song.url);
            const formBtn = document.createElement("button");
            formBtn.textContent = "View Formation";
            formBtn.onclick = () => showFormation(song);
            card.appendChild(playBtn);
            card.appendChild(formBtn);
            container.appendChild(card);
          });
      }

      const songs = songsState || {};
      const lib = songs.library || {};
      const currentUrlLocal = songs.current || "";
      const backgroundUrlLocal = songs.background || "";
      const filter = (document.getElementById("songFilter")?.value || "").toLowerCase();
      const tabFilter = currentTab === "slot_one" ? (state.slot_one || "").toLowerCase()
                     : currentTab === "slot_two" ? (state.slot_two || "").toLowerCase()
                     : currentTab === "group" ? (state.group_name || "").toLowerCase()
                     : "";
      const datalist = document.getElementById("songSuggestions");
      if (datalist) datalist.innerHTML = "";
      let currentName = "None";
      const tryResolve = (url) => {
        let name = "None";
        Object.values(lib).forEach(item => {
          if (item.url === url) {
            name = item.name || url;
          }
        });
        if (name === "None" && url && url === backgroundUrlLocal) {
          name = "Background";
        }
        if (name === "None" && url) name = url;
        return name;
      };
      if (currentUrlLocal) {
        currentName = tryResolve(currentUrlLocal);
      } else if (backgroundUrlLocal) {
        currentName = tryResolve(backgroundUrlLocal);
      }
      const currentLabel = document.getElementById("currentSongLabel");
      if (currentLabel) currentLabel.textContent = currentName;
      const select = document.getElementById("songSelect");
      if (select) {
        select.innerHTML = "";
        Object.keys(lib).forEach(key => {
          const opt = document.createElement("option");
          opt.value = lib[key].url;
          let label = lib[key].name || key;
          const artist = lib[key].artist || "";
          const fronts = (lib[key].front_dancers || []).join(", ");
          if (fronts) {
            label += ` (Front: ${fronts})`;
          }
          opt.textContent = label;
          const dancerMatch = tabFilter
            ? (lib[key].dancers || []).some(d => (d || "").toLowerCase().includes(tabFilter))
            : true;
          const matches = (
            !filter ||
            label.toLowerCase().includes(filter) ||
            artist.toLowerCase().includes(filter)
          ) && dancerMatch;
          if (matches) {
            select.appendChild(opt);
          }
          if (matches && datalist) {
            const dOpt = document.createElement("option");
            dOpt.value = label;
            datalist.appendChild(dOpt);
          }
        });
        if (!select.value && select.options.length) select.selectedIndex = 0;
      }
    }

    function filterSelected() {
      const filterVal = (document.getElementById("songFilter")?.value || "").toLowerCase();
      const select = document.getElementById("songSelect");
      if (!select) return;
      for (let i = 0; i < select.options.length; i++) {
        if (select.options[i].textContent.toLowerCase() === filterVal) {
          select.selectedIndex = i;
          playSong(true);
          break;
        }
      }
    }

    function renderState() {
      renderGroups();
      renderSongs();
    }

    function showFormation(song) {
      const list = document.getElementById("formationList");
      const title = document.getElementById("formationTitle");
      const enabledWrap = document.getElementById("formationEnabled");
      if (!song) {
        if (list) list.textContent = "";
        if (title) title.textContent = "Select a song to view formation";
        if (enabledWrap) enabledWrap.innerHTML = "";
        drawFormation([]);
        return;
      }
      const names = (song.front_dancers || []).filter(Boolean);
      lastFormationSong = song;
      if (title) title.textContent = `${song.name || "Formation"}`;
      renderFormationEnabled();
      const enabledNames = names.filter(n => formationEnabledMap[n] !== false);
      if (list) {
        if (!enabledNames.length) {
          list.textContent = "No front dancer list set.";
        } else {
          list.innerHTML = enabledNames.map((n, i) => `${i + 1}. ${n}`).join("<br>");
        }
      }
      drawFormation(enabledNames);
    }

    function renderFormationEnabled() {
      const enabledWrap = document.getElementById("formationEnabled");
      if (!enabledWrap) return;
      enabledWrap.innerHTML = "";
      const dancers = state.dancers || [];
      dancers.forEach(d => {
        const name = d.name || "";
        if (!name) return;
        const low = name.toLowerCase();
        if (low.includes("boys") || low.includes("girls")) return;
        const label = document.createElement("label");
        label.style.display = "flex";
        label.style.gap = "6px";
        label.style.alignItems = "center";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = formationEnabledMap[name] !== false;
        cb.dataset.name = name;
        cb.onchange = () => {
          formationEnabledMap[name] = cb.checked;
          if (lastFormationSong) showFormation(lastFormationSong);
        };
        label.appendChild(cb);
        const span = document.createElement("span");
        span.textContent = name;
        label.appendChild(span);
        enabledWrap.appendChild(label);
      });
    }

    function drawFormation(names) {
      const canvas = document.getElementById("formationCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!names || !names.length) return;
      const radius = 8;
      const rows = [];
      if (names.length % 2 === 0 && names.length >= 2) {
        rows.push(names.slice(0, 2));
      } else {
        rows.push([names[0]]);
      }
      let idx = rows[0].length;
      while (idx < names.length) {
        rows.push(names.slice(idx, idx + 2));
        idx += 2;
      }
      const rowCount = rows.length;
      const vGap = (canvas.height - radius * 2) / Math.max(1, rowCount);
      const font = "bold 12px Segoe UI, Arial, sans-serif";
      const padX = 8;
      const padY = 6;

      function roundRect(x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.lineTo(x + w - rr, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
        ctx.lineTo(x + w, y + h - rr);
        ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
        ctx.lineTo(x + rr, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
        ctx.lineTo(x, y + rr);
        ctx.quadraticCurveTo(x, y, x + rr, y);
        ctx.closePath();
      }

      rows.forEach((row, rowIdx) => {
        const y = vGap * rowIdx + radius + 16;
        const colCount = row.length;
        const hGap = canvas.width / (colCount + 1);
        row.forEach((_, colIdx) => {
          const x = hGap * (colIdx + 1);
          const name = row[colIdx] || "";
          const label = name.length > 14 ? name.slice(0, 14) + "…" : name;
          ctx.font = font;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const textWidth = ctx.measureText(label).width;
          const rectW = textWidth + padX * 2;
          const rectH = 18 + padY;
          const rectX = x - rectW / 2;
          const rectY = y - rectH / 2;
          ctx.fillStyle = "#1e293b";
          ctx.strokeStyle = "#94a3b8";
          ctx.lineWidth = 2;
          roundRect(rectX, rectY, rectW, rectH, 8);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#fbbf24";
          ctx.fillText(label, x, y);
        });
      });
    }

    function refreshState() {
      api("/state").then(r=>r.json()).then(s => { state = s; renderState(); renderFormationEnabled(); ensureBackground(); });
    }

    function refreshSongs() {
      api("/songs").then(r => r.json()).then(s => {
        songsState = s || {};
        renderSongs();
      });
    }

    function selectTab(tab) {
      currentTab = tab;
      ["tabGroup","tabOne","tabTwo"].forEach(id=>{
        const el = document.getElementById(id);
        if (!el) return;
        const isActive = (id==="tabGroup" && tab==="group") || (id==="tabOne" && tab==="slot_one") || (id==="tabTwo" && tab==="slot_two");
        el.className = isActive ? "secondary active" : "secondary";
      });
      renderSongs();
    }

    async function playSong(fromSelect=false) {
      const select = document.getElementById("songSelect");
      const url = select ? select.value : "";
      playSongWithUrl(url, fromSelect);
    }

    async function playSongWithUrl(url, fromSelect=false) {
      if (!url) {
        if (fromSelect) return;
        return alert("Select a song");
      }
      await loadSettings();
      const bellUrl = getRoleUrl("bell");
      const applauseUrl = getRoleUrl("applause");
      const backgroundUrl = getRoleUrl("background");
      // Prime local cache up-front so playback can survive transient network loss.
      window.PageShared?.primeAudioCache?.(url);
      if (bellUrl) window.PageShared?.primeAudioCache?.(bellUrl);
      if (applauseUrl) window.PageShared?.primeAudioCache?.(applauseUrl);
      if (backgroundUrl) window.PageShared?.primeAudioCache?.(backgroundUrl);
      api("/songs/play", {method:"POST", body:{target: currentTab, url, context: "group dances"}}).catch(()=>{});
      if (!songsState) songsState = {};
      songsState.current = url;
      if (settingsLoopSameSongAfterFinish) {
        // Practice mode: bell -> selected song.
        const steps = [];
        if (bellUrl) steps.push(bellUrl);
        steps.push(url);
        playSequence(steps, () => runPracticeRepeatCues(url));
      } else {
        // bell -> song -> applause -> background (if any)
        const steps = [];
        if (bellUrl) steps.push(bellUrl);
        steps.push(url);
        steps.push("applause_role");
        steps.push("background_role");
        playSequence(steps);
      }
      refreshState();
    }

    function getAudioPlayer() {
      return window.PageShared.getGlobalAudioPlayer();
    }

    function startAudio(url, opts={}) {
      const player = getAudioPlayer();
      if (!player) return;
      window.PageShared.startAudio({
        player,
        url,
        opts,
        getRoleUrl,
        getSongVolume,
        settingsFadeIn,
        settingsFadeOut,
        onTrackPlay: () => { notePlay(url); },
      });
      updateBackgroundTimerOverlay();
    }

    function normalizeAudioUrl(url) {
      if (!url) return "";
      try { return new URL(String(url), window.location.href).toString(); }
      catch (e) { return String(url); }
    }

    function formatBackgroundTime(seconds) {
      const total = Math.max(0, Math.floor(Number(seconds) || 0));
      const mm = String(Math.floor(total / 60)).padStart(2, "0");
      const ss = String(total % 60).padStart(2, "0");
      return `${mm}:${ss}`;
    }

    function isBackgroundPlaybackActive() {
      const player = getAudioPlayer();
      const bgUrl = getRoleUrl("background");
      if (!player || !bgUrl) return false;
      const currentSrc = player.dataset?.originalSrc || player.currentSrc || player.src || "";
      return !player.paused && normalizeAudioUrl(currentSrc) === normalizeAudioUrl(bgUrl);
    }

    function updateBackgroundTimerOverlay() {
      const box = document.getElementById("backgroundTimerBox");
      const value = document.getElementById("backgroundTimerValue");
      const player = getAudioPlayer();
      if (!box || !value || !player) return;
      const shouldShow = settingsDisplayBackgroundTimer && isBackgroundPlaybackActive();
      if (!shouldShow) {
        box.style.display = "none";
        return;
      }
      value.textContent = formatBackgroundTime(player.currentTime || 0);
      box.style.display = "block";
    }

    function startBackgroundTimerTick() {
      if (backgroundTimerTickHandle) return;
      backgroundTimerTickHandle = setInterval(updateBackgroundTimerOverlay, 250);
    }

    function initBackgroundTimerOverlay() {
      const box = document.getElementById("backgroundTimerBox");
      const storageKey = "background_timer_pos_group";
      if (!box) return;
      try {
        const raw = localStorage.getItem(storageKey);
        const pos = raw ? JSON.parse(raw) : null;
        if (pos && Number.isFinite(pos.x) && Number.isFinite(pos.y)) {
          box.style.left = `${Math.max(0, pos.x)}px`;
          box.style.top = `${Math.max(0, pos.y)}px`;
          box.style.bottom = "auto";
        }
      } catch (e) {}

      let drag = null;
      box.addEventListener("pointerdown", (evt) => {
        if (evt.button !== undefined && evt.button !== 0) return;
        const rect = box.getBoundingClientRect();
        drag = {
          id: evt.pointerId,
          dx: evt.clientX - rect.left,
          dy: evt.clientY - rect.top,
        };
        box.classList.add("dragging");
        try { box.setPointerCapture(evt.pointerId); } catch (e) {}
        evt.preventDefault();
      });

      box.addEventListener("pointermove", (evt) => {
        if (!drag || evt.pointerId !== drag.id) return;
        const maxX = Math.max(0, window.innerWidth - box.offsetWidth);
        const maxY = Math.max(0, window.innerHeight - box.offsetHeight);
        const x = Math.min(maxX, Math.max(0, evt.clientX - drag.dx));
        const y = Math.min(maxY, Math.max(0, evt.clientY - drag.dy));
        box.style.left = `${x}px`;
        box.style.top = `${y}px`;
        box.style.bottom = "auto";
      });

      const finishDrag = (evt) => {
        if (!drag || evt.pointerId !== drag.id) return;
        box.classList.remove("dragging");
        try { box.releasePointerCapture(evt.pointerId); } catch (e) {}
        try {
          const left = parseFloat(box.style.left || "0");
          const top = parseFloat(box.style.top || "0");
          localStorage.setItem(storageKey, JSON.stringify({x: left, y: top}));
        } catch (e) {}
        drag = null;
      };
      box.addEventListener("pointerup", finishDrag);
      box.addEventListener("pointercancel", finishDrag);

      const player = getAudioPlayer();
      if (player) {
        ["play", "pause", "ended", "timeupdate", "loadedmetadata", "seeked", "ratechange"].forEach((eventName) => {
          player.addEventListener(eventName, updateBackgroundTimerOverlay);
        });
      }
      startBackgroundTimerTick();
      updateBackgroundTimerOverlay();
    }

    function getRoleUrl(role) {
      return Object.values(library).find(s => (s.roles||[]).includes(role))?.url || "";
    }

    function queueSongPaused(url) {
      window.PageShared.queueSongPaused({url, getSongVolume, setCurrent});
    }

    function runPracticeRepeatCues(url) {
      queueSongPaused(url);
    }

    function normalizeVolume(val) {
      return window.PageShared.normalizeVolume(val);
    }

    function getSongVolume(url) {
      const song = Object.values(library).find(s => s.url === url);
      const v = song ? parseFloat(song.volume) : NaN;
      if (Number.isFinite(v)) return normalizeVolume(v);
      return 1;
    }

    function playRole(role) {
      const url = getRoleUrl(role);
      if (!url) {
        alert(`No song with role: ${role}`);
        return;
      }
      playSongWithUrl(url, true);
    }

    function playRoleHotkey(role) {
      const url = getRoleUrl(role);
      if (!url) return;
      const bg = getRoleUrl("background");
      startAudio(url, {
        loop: false,
        isRole: true,
        onEnd: () => {
          if (bg) {
            startAudio(bg, {loop:true, fade:false, fadeOut:false, skipFadeOut:true, isRole:true});
          }
        }
      });
    }

    function setCurrent(url) {
      currentUrl = url;
      const label = document.getElementById("currentSongLabel");
      let name = "None";
      Object.values(library).forEach(s => { if (s.url === url) name = s.name || url; });
      if (!url) name = "None";
      if (label) label.textContent = name;
    }

    function playSequence(steps, onDone=null) {
      if (!steps || !steps.length) return;
      const [first, ...rest] = steps.filter(Boolean);
      if (!first) {
        if (onDone) onDone();
        return;
      }
      let url = first;
      let isRole = false;
      if (first === "applause_role") {
        url = getRoleUrl("applause");
        if (!url) { playSequence(rest, onDone); return; }
        isRole = true;
      } else if (first === "background_role") {
        url = getRoleUrl("background");
        if (!url) { playSequence(rest, onDone); return; }
        songsState.background = url;
        setCurrent(url);
        startAudio(url, {loop:true, fade:false, fadeOut:false, skipFadeOut:true, isRole:true});
        return;
      }
      // normal audio
      setCurrent(url);
      startAudio(url, {loop:false, fade:true, fadeOut:false, skipFadeOut:true, isRole, onEnd: () => playSequence(rest, onDone)});
    }

    function ensureBackground() {
      if (backgroundStarted) return;
      const bg = getRoleUrl("background");
      if (!bg) return;
      backgroundStarted = true;
      setCurrent(bg);
      startAudio(bg, {loop:true, fade:false, fadeOut:false, skipFadeOut:true, isRole:true});
    }

    function loadPlayCounts() {
      try {
        const raw = localStorage.getItem("playCounts");
        return raw ? JSON.parse(raw) : {};
      } catch (e) { return {}; }
    }
    function savePlayCounts() {
      try { localStorage.setItem("playCounts", JSON.stringify(playCounts)); } catch (e) {}
    }
    function loadLastSong() {
      try { return localStorage.getItem("lastSongUrl") || ""; } catch (e) { return ""; }
    }
    function saveLastSong(url) {
      lastSongUrl = url || "";
      try { localStorage.setItem("lastSongUrl", lastSongUrl); } catch (e) {}
    }
    function notePlay(url) {
      if (!url) return;
      playCounts[url] = (playCounts[url] || 0) + 1;
      savePlayCounts();
      saveLastSong(url);
    }

    function highlightNav() {
      const here = location.pathname.replace(/\/+$/,"") || "/";
      document.querySelectorAll(".nav-bar a").forEach(a => {
        const link = (a.getAttribute("href") || "").replace(/\/+$/,"") || "/";
        if (link === here) a.classList.add("active"); else a.classList.remove("active");
      });
    }

    window.PageShared.initPracticeModeHeader({apiFn: api});
    initBackgroundTimerOverlay();
    loadSettings();
    refreshData();
    refreshState();
    refreshSongs();
    function connectWs() {
      if (!window.PageShared?.connectWsStatus) return;
      window.PageShared.connectWsStatus({
        connectedText: "Live",
        disconnectedText: "Disconnected",
        onOpen: () => { refreshState(); },
        onWake: () => { refreshState(); },
        onState: (payload) => {
          state = payload;
          renderState();
          renderFormationEnabled();
        },
      });
    }
    connectWs();
    highlightNav();
    document.addEventListener("keydown", handleHotkey);
    window.addEventListener("message", (evt) => {
      if (evt?.data?.type === "settings-updated") {
        loadSettings();
      }
    });

    function stopPreview() {
      const video = document.getElementById("preview");
      if (!video) return;
      const stream = video.srcObject;
      if (stream && stream.getTracks) {
        stream.getTracks().forEach(t => t.stop());
      }
      video.srcObject = null;
    }

    async function startPreview() {
      const video = document.getElementById("preview");
      if (!navigator.mediaDevices?.getUserMedia || !video) return;
      try {
        stopPreview();
        const refreshed = await navigator.mediaDevices.enumerateDevices();
        const vcams = refreshed.filter(d => d.kind === "videoinput");
        const target = vcams.find(c => /virtual/i.test(c.label || "")) || vcams[0];
        if (!target) return;
        const constraints = target.deviceId ? { deviceId: { exact: target.deviceId } } : true;
        const stream = await navigator.mediaDevices.getUserMedia({ video: constraints });
        video.srcObject = stream;
        await video.play();
      } catch (e) {
        // ignore preview errors
      }
    }
    window.addEventListener("pagehide", stopPreview);
    window.addEventListener("beforeunload", stopPreview);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stopPreview();
    });
  </script>
</body>
</html>
