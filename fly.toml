# fly.toml app configuration file generated for newstarhost on 2026-01-20T18:30:46-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'newstarhost'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[[mounts]]
  source = 'media'
  destination = '/app/media'
  processes = ['app']

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[processes]
  app = 'bash -lc "bash /app/scripts/s3_sync.sh & exec python -m uvicorn backend.main:app --host 0.0.0.0 --port 8080"'
  listener = 'python scripts/tiktok_listener.py'
  discord = 'bash /app/scripts/discord_worker.sh'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
