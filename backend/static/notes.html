<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notes</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 16px 24px 16px; background: #1e293b; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 20px; }
    main { padding: 20px 24px; }
    section { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.02); max-width: 980px; }
    h2 { margin-top: 0; font-size: 16px; letter-spacing: 0.02em; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-weight: 600; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0b1222;
      color: #e2e8f0;
      font: inherit;
    }
    textarea { min-height: 110px; resize: vertical; }
    .stream-format-grid {
      display: grid;
      grid-template-columns: 44px 1fr 160px 90px;
      gap: 8px;
      align-items: center;
    }
    .stream-header {
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .stream-rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stream-row {
      padding: 8px;
      border: 1px solid #1f2937;
      border-radius: 8px;
      background: #0b1222;
      transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease, background-color 140ms ease, opacity 140ms ease;
    }
    .stream-row.dragging {
      opacity: 0.72;
      border-color: #2563eb;
      background: #0f172a;
      transform: scale(0.995);
      box-shadow: 0 8px 24px rgba(37,99,235,.28);
    }
    .stream-row.drag-over {
      border-color: #60a5fa;
      background: #111b33;
      transform: translateY(-1px);
      box-shadow: inset 0 0 0 1px rgba(96,165,250,.35);
    }
    .drag-handle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 36px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #111827;
      color: #cbd5e1;
      cursor: grab;
      user-select: none;
    }
    .drag-handle:active { cursor: grabbing; }
    .drag-handle:hover { border-color: #475569; background: #0f172a; color: #e2e8f0; }
    .drag-handle:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 1px;
    }
    .drag-handle svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .stream-row input {
      width: 100%;
    }
    .remove-segment-btn {
      background: #ef4444;
      width: 100%;
    }
    .add-segment-row {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .stream-total {
      color: #93c5fd;
      font-weight: 600;
      font-size: 13px;
      margin-left: auto;
      text-align: right;
    }
    .members-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      padding: 10px;
      border: 1px solid #1f2937;
      border-radius: 8px;
      background: #0b1222;
      max-height: 220px;
      overflow: auto;
    }
    .member-item { display: inline-flex; align-items: center; gap: 6px; min-width: 180px; }
    .member-item input { width: auto; }
    button {
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: 600;
    }
    .status { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; text-transform: uppercase; }
    .status-text { margin-top: 10px; min-height: 22px; color: #93c5fd; }
    .status-text.error { color: #fca5a5; }
    .status-text.success { color: #86efac; }
    @media (max-width: 900px) {
      header { padding: 12px 12px 8px; }
      header .status { display: none !important; }
      h1 { font-size: 18px; }
      main { padding: 12px; }
      section { padding: 12px; }
      .member-item { min-width: 140px; }
      .stream-format-grid {
        grid-template-columns: 40px 1fr 100px 76px;
        gap: 6px;
      }
      .drag-handle { height: 34px; }
      .remove-segment-btn { padding: 8px 6px; }
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="wsDot" style="display:inline-flex;align-items:center;justify-content:center;width:10px;height:10px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444;"></span>
      <h1>Notes</h1>
    </div>
    <div class="status" style="display:flex;align-items:center;gap:6px;font-weight:700;text-transform:uppercase;">
      <span id="statusText">Connecting</span>
    </div>
  </header>
  <main>
    <section>
      <h2>Stream Notes</h2>
      <form id="notesForm">
        <div class="field">
          <label for="hostInput">Host</label>
          <input id="hostInput" type="text" placeholder="Host name">
        </div>

        <div class="field">
          <label for="groupSelect">Group</label>
          <select id="groupSelect"></select>
        </div>

        <div class="field">
          <label for="outfitThemeInput">Outfit Theme</label>
          <input id="outfitThemeInput" type="text" placeholder="e.g. Neon streetwear">
        </div>

        <div class="field">
          <label>Members Present</label>
          <div id="membersWrap" class="members-wrap"></div>
        </div>

        <div class="field">
          <label>Stream Format</label>
          <div class="stream-format-grid stream-header">
            <div></div>
            <div>Segment</div>
            <div>Duration (min)</div>
            <div></div>
          </div>
          <div id="streamRows" class="stream-rows"></div>
          <div class="add-segment-row">
            <button type="button" id="addSegmentBtn">Add Segment</button>
            <div id="streamDurationTotal" class="stream-total">Total Duration: 0h 0m</div>
          </div>
        </div>

        <div class="field">
          <label for="additionalNotesInput">Additional Notes</label>
          <textarea id="additionalNotesInput" placeholder="Any notes about this stream"></textarea>
        </div>

        <button id="submitBtn" type="submit">Submit</button>
        <div id="formStatus" class="status-text"></div>
      </form>
    </section>
  </main>

  <script src="/static/state_ws_helper.js"></script>
  <script src="/static/page_shared.js"></script>
  <script>
    const api = window.PageShared.api;
    let dancers = [];
    let selectedMemberSet = null;
    let streamSegments = [];
    let draggedSegmentId = null;
    let dragOverSegmentId = null;
    let nextSegmentId = 1;
    const HOST_COOKIE_KEY = "notes_host";
    const STREAM_FORMAT_COOKIE_KEY = "notes_stream_format";
    const DEFAULT_STREAM_SEGMENTS = [
      {segment: "Group Block", duration: "30"},
      {segment: "Battles", duration: "80"},
      {segment: "MVP Ceremony", duration: "9"},
      {segment: "Closing Song", duration: "1"},
    ];

    function sortedNames(list) {
      return (list || [])
        .map(d => (d && d.name ? String(d.name).trim() : ""))
        .filter(Boolean)
        .sort((a, b) => a.localeCompare(b));
    }

    function setCookie(name, value, days = 365) {
      const safeName = encodeURIComponent(String(name || ""));
      const safeValue = encodeURIComponent(String(value || ""));
      const maxAge = Math.max(1, Math.floor(days * 24 * 60 * 60));
      document.cookie = `${safeName}=${safeValue}; Max-Age=${maxAge}; Path=/; SameSite=Lax`;
    }

    function getCookie(name) {
      const safeName = encodeURIComponent(String(name || "")) + "=";
      const parts = (document.cookie || "").split(";");
      for (const part of parts) {
        const p = part.trim();
        if (!p.startsWith(safeName)) continue;
        return decodeURIComponent(p.slice(safeName.length));
      }
      return "";
    }

    function restorePersistedDefaults() {
      const host = getCookie(HOST_COOKIE_KEY);
      const streamFormat = getCookie(STREAM_FORMAT_COOKIE_KEY);
      if (host) document.getElementById("hostInput").value = host;
      loadStreamSegmentsFromCookie(streamFormat);
      renderStreamSegments();
    }

    function wirePersistedDefaults() {
      const hostInput = document.getElementById("hostInput");
      hostInput.addEventListener("input", () => setCookie(HOST_COOKIE_KEY, hostInput.value.trim()));
      document.getElementById("addSegmentBtn").addEventListener("click", () => {
        addStreamSegment();
      });
    }

    function sanitizeStreamSegments(items) {
      const cleaned = [];
      (items || []).forEach(item => {
        if (!item || typeof item !== "object") return;
        const segment = String(item.segment || "").trim();
        let duration = String(item.duration || "").trim();
        duration = duration.replace(/\s*min$/i, "").trim();
        const digitsOnly = duration.replace(/[^\d]/g, "");
        if (digitsOnly) duration = digitsOnly;
        if (!segment && !duration) return;
        cleaned.push({segment, duration});
      });
      return cleaned;
    }

    function loadStreamSegmentsFromCookie(rawCookie) {
      let parsed = [];
      const raw = String(rawCookie || "").trim();
      if (raw) {
        try {
          const asJson = JSON.parse(raw);
          if (Array.isArray(asJson)) {
            parsed = sanitizeStreamSegments(asJson);
          }
        } catch (e) {
          parsed = [];
        }
      }
      if (!parsed.length) {
        parsed = sanitizeStreamSegments(DEFAULT_STREAM_SEGMENTS);
      }
      streamSegments = parsed.map((row) => ({
        id: nextSegmentId++,
        segment: row.segment,
        duration: row.duration,
      }));
    }

    function serializeStreamSegmentsForCookie() {
      const rows = streamSegments.map(row => ({
        segment: String(row.segment || "").trim(),
        duration: String(row.duration || "").trim(),
      }));
      return JSON.stringify(rows);
    }

    function validateStreamSegments() {
      const rows = [];
      for (let i = 0; i < streamSegments.length; i++) {
        const row = streamSegments[i] || {};
        const segment = String(row.segment || "").trim();
        const durationText = String(row.duration || "").trim();
        if (!segment && !durationText) continue;
        if (!segment) {
          return {ok: false, error: `Segment name is required for row ${i + 1}.`};
        }
        const durationInt = Number.parseInt(durationText, 10);
        if (!Number.isInteger(durationInt) || durationInt <= 0) {
          return {ok: false, error: `Duration must be a positive integer for \"${segment}\".`};
        }
        rows.push({segment, duration_min: durationInt});
      }
      if (!rows.length) {
        return {ok: false, error: "Add at least one stream format segment."};
      }
      return {ok: true, rows};
    }

    function streamFormatJsonlValue() {
      const check = validateStreamSegments();
      if (!check.ok) return check;
      const text = check.rows.map(row => JSON.stringify(row)).join("\n");
      return {ok: true, text, rows: check.rows};
    }

    function persistStreamSegmentsCookie() {
      setCookie(STREAM_FORMAT_COOKIE_KEY, serializeStreamSegmentsForCookie());
    }

    function updateStreamDurationTotal() {
      const total = streamSegments.reduce((acc, row) => {
        const val = Number.parseInt(String(row?.duration || "").trim(), 10);
        return Number.isInteger(val) && val > 0 ? acc + val : acc;
      }, 0);
      const hours = Math.floor(total / 60);
      const minutes = total % 60;
      const el = document.getElementById("streamDurationTotal");
      if (el) el.textContent = `Total Duration: ${hours}h ${minutes}m`;
    }

    function moveStreamSegment(fromId, toId) {
      if (fromId === toId) return;
      const fromIndex = streamSegments.findIndex(row => row.id === fromId);
      const toIndex = streamSegments.findIndex(row => row.id === toId);
      if (fromIndex < 0 || toIndex < 0) return;
      const [moved] = streamSegments.splice(fromIndex, 1);
      streamSegments.splice(toIndex, 0, moved);
      renderStreamSegments();
      persistStreamSegmentsCookie();
    }

    function clearStreamDragOverState() {
      dragOverSegmentId = null;
      document.querySelectorAll("#streamRows .stream-row.drag-over").forEach((rowEl) => {
        rowEl.classList.remove("drag-over");
      });
    }

    function addStreamSegment(segment = "", duration = "") {
      streamSegments.push({
        id: nextSegmentId++,
        segment: String(segment || "").trim(),
        duration: String(duration || "").trim(),
      });
      renderStreamSegments();
      persistStreamSegmentsCookie();
    }

    function removeStreamSegment(id) {
      streamSegments = streamSegments.filter(row => row.id !== id);
      renderStreamSegments();
      persistStreamSegmentsCookie();
    }

    function updateStreamSegment(id, key, value) {
      const row = streamSegments.find(item => item.id === id);
      if (!row) return;
      row[key] = value;
      persistStreamSegmentsCookie();
      updateStreamDurationTotal();
    }

    function renderStreamSegments() {
      const wrap = document.getElementById("streamRows");
      wrap.innerHTML = "";
      streamSegments.forEach(row => {
        const item = document.createElement("div");
        item.className = "stream-row";
        item.draggable = true;
        item.dataset.id = String(row.id);

        item.addEventListener("dragstart", () => {
          draggedSegmentId = row.id;
          requestAnimationFrame(() => item.classList.add("dragging"));
        });
        item.addEventListener("dragend", () => {
          draggedSegmentId = null;
          clearStreamDragOverState();
          item.classList.remove("dragging");
        });
        item.addEventListener("dragover", (evt) => {
          evt.preventDefault();
          if (draggedSegmentId == null || draggedSegmentId === row.id) return;
          if (dragOverSegmentId !== row.id) {
            clearStreamDragOverState();
            item.classList.add("drag-over");
            dragOverSegmentId = row.id;
          }
        });
        item.addEventListener("drop", (evt) => {
          evt.preventDefault();
          if (draggedSegmentId == null) return;
          clearStreamDragOverState();
          moveStreamSegment(draggedSegmentId, row.id);
        });

        const grid = document.createElement("div");
        grid.className = "stream-format-grid";

        const handleBtn = document.createElement("button");
        handleBtn.type = "button";
        handleBtn.className = "drag-handle";
        handleBtn.title = "Drag to reorder";
        handleBtn.setAttribute("aria-label", "Drag to reorder");
        handleBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 7h14M5 12h14M5 17h14"/></svg>';

        const segInput = document.createElement("input");
        segInput.type = "text";
        segInput.value = row.segment || "";
        segInput.placeholder = "Segment";
        segInput.addEventListener("input", () => {
          updateStreamSegment(row.id, "segment", segInput.value);
        });

        const durInput = document.createElement("input");
        durInput.type = "number";
        durInput.min = "1";
        durInput.step = "1";
        durInput.inputMode = "numeric";
        durInput.value = row.duration || "";
        durInput.placeholder = "Duration";
        durInput.addEventListener("input", () => {
          const nextVal = String(durInput.value || "").replace(/[^\d]/g, "");
          if (durInput.value !== nextVal) durInput.value = nextVal;
          updateStreamSegment(row.id, "duration", nextVal);
        });

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "remove-segment-btn";
        removeBtn.textContent = "Remove";
        removeBtn.addEventListener("click", () => removeStreamSegment(row.id));

        grid.appendChild(handleBtn);
        grid.appendChild(segInput);
        grid.appendChild(durInput);
        grid.appendChild(removeBtn);
        item.appendChild(grid);
        wrap.appendChild(item);
      });
      updateStreamDurationTotal();
    }

    function selectedMembers() {
      return Array.from(document.querySelectorAll("input[name='memberPresent']:checked")).map(cb => cb.value);
    }

    function isGroupName(name) {
      const text = String(name || "").toLowerCase();
      return text.includes("boys") || text.includes("girls");
    }

    function renderGroupOptions(groupNames, fallbackNames) {
      const select = document.getElementById("groupSelect");
      const previous = select.value || "";
      const names = (groupNames && groupNames.length) ? groupNames : (fallbackNames || []);
      select.innerHTML = "";
      const empty = document.createElement("option");
      empty.value = "";
      empty.textContent = "(none)";
      select.appendChild(empty);
      names.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
      if (previous && names.includes(previous)) {
        select.value = previous;
      } else if (groupNames && groupNames.length) {
        select.value = groupNames[0];
      }
    }

    function renderMembers(names) {
      const wrap = document.getElementById("membersWrap");
      wrap.innerHTML = "";
      if (!names.length) {
        const empty = document.createElement("span");
        empty.textContent = "No dancers found.";
        empty.style.color = "#94a3b8";
        wrap.appendChild(empty);
        selectedMemberSet = new Set();
        return;
      }
      if (selectedMemberSet === null) {
        // Default behavior: all members present are checked when page loads.
        selectedMemberSet = new Set(names);
      } else {
        const next = new Set();
        names.forEach(name => {
          if (selectedMemberSet.has(name)) next.add(name);
        });
        // New members default to checked.
        names.forEach(name => {
          if (!next.has(name)) next.add(name);
        });
        selectedMemberSet = next;
      }
      names.forEach(name => {
        const label = document.createElement("label");
        label.className = "member-item";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.name = "memberPresent";
        cb.value = name;
        cb.checked = selectedMemberSet.has(name);
        cb.addEventListener("change", () => {
          if (!selectedMemberSet) selectedMemberSet = new Set();
          if (cb.checked) selectedMemberSet.add(name);
          else selectedMemberSet.delete(name);
        });
        const text = document.createElement("span");
        text.textContent = name;
        label.appendChild(cb);
        label.appendChild(text);
        wrap.appendChild(label);
      });
    }

    function renderDancers() {
      const names = sortedNames(dancers);
      const groupNames = names.filter(isGroupName);
      const memberNames = names.filter(name => !isGroupName(name));
      renderGroupOptions(groupNames, names);
      renderMembers(memberNames);
    }

    async function refreshDancers() {
      try {
        const res = await api("/dancers");
        const data = await res.json();
        dancers = Array.isArray(data) ? data : [];
        renderDancers();
      } catch (e) {
        dancers = [];
        renderDancers();
      }
    }

    function setFormStatus(message, kind = "") {
      const el = document.getElementById("formStatus");
      el.textContent = message || "";
      el.className = "status-text";
      if (kind) el.classList.add(kind);
    }

    async function submitForm(evt) {
      evt.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      setFormStatus("Submitting...");
      const streamFormat = streamFormatJsonlValue();
      if (!streamFormat.ok) {
        setFormStatus(streamFormat.error || "Invalid stream format.", "error");
        submitBtn.disabled = false;
        return;
      }
      const body = {
        host: document.getElementById("hostInput").value.trim(),
        group: document.getElementById("groupSelect").value.trim(),
        outfit_theme: document.getElementById("outfitThemeInput").value.trim(),
        members_present: selectedMembers(),
        stream_format: streamFormat.text,
        additional_notes: document.getElementById("additionalNotesInput").value.trim(),
      };
      setCookie(HOST_COOKIE_KEY, body.host);
      persistStreamSegmentsCookie();
      try {
        const res = await api("/notes/stream", {method: "POST", body});
        let payload = {};
        try { payload = await res.json(); } catch (e) {}
        if (!res.ok || payload.ok === false) {
          const err = payload.error || `Request failed (${res.status})`;
          setFormStatus(err, "error");
          return;
        }
        setFormStatus("Saved stream note.", "success");
      } catch (err) {
        setFormStatus(`Request failed: ${err}`, "error");
      } finally {
        submitBtn.disabled = false;
      }
    }

    function connectWs() {
      if (!window.PageShared?.connectWsStatus) return;
      const origin = (window.location && window.location.origin) ? window.location.origin : "";
      window.PageShared.connectWsStatus({
        wsUrl: origin ? (origin.replace(/^http/, "ws")) + "/ws/state" : undefined,
        connectedText: "Live",
        disconnectedText: "Disconnected",
        onState: (payload) => {
          if (Array.isArray(payload?.dancers)) {
            dancers = payload.dancers;
            renderDancers();
          }
        },
      });
    }

    document.getElementById("notesForm").addEventListener("submit", submitForm);
    restorePersistedDefaults();
    wirePersistedDefaults();
    window.PageShared.initPracticeModeHeader({apiFn: api});
    refreshDancers();
    connectWs();
  </script>
</body>
</html>
